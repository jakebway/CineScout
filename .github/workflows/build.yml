          from PIL import Image, ImageDraw
          S = 2048
          img = Image.new("RGB", (S, S))
          d = ImageDraw.Draw(img)
          top, bot = (255, 140, 40), (120, 20, 60)
          for y in range(S):
              t = y / (S - 1)
              d.line([(0, y), (S, y)], fill=tuple(int(top[i] * (1 - t) + bot[i] * t) for i in range(3)))
          m, y0, y1 = int(S * 0.2), int(S * 0.27), int(S * 0.73)
          d.rounded_rectangle([m, y0, S - m, y1], radius=int(S * 0.06), fill=(20, 14, 24))
          hole = int(S * 0.035)
          for x in range(m + int(S * 0.05), S - m - int(S * 0.05), int(S * 0.075)):
              for yy in (y0 + int(S * 0.03), y1 - int(S * 0.03) - hole):
                  d.rounded_rectangle([x, yy, x + hole, yy + hole], radius=hole // 4, fill=(255, 255, 255))
          cx, cy, r = S // 2, S // 2, int(S * 0.11)
          d.polygon([(cx - r * 0.8, cy - r), (cx - r * 0.8, cy + r), (cx + r * 1.1, cy)], fill=(255, 170, 60))
          img.resize((1024, 1024), Image.LANCZOS).save("CineScout/Assets.xcassets/AppIcon.appiconset/icon.png")
          CINESCOUT_EOF
          cat > 'Podfile' <<'CINESCOUT_EOF'
          platform :ios, '17.0'
          install! 'cocoapods', :warn_for_unused_master_specs_repo => false

          target 'CineScout' do
            use_frameworks!
            pod 'MobileVLCKit', '~> 3.6'
          end

          post_install do |installer|
            installer.pods_project.targets.each do |t|
              t.build_configurations.each do |c|
                c.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '17.0'
                c.build_settings['ENABLE_USER_SCRIPT_SANDBOXING'] = 'NO'
                c.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'
              end
            end
          end
          CINESCOUT_EOF

          BUILD="${GITHUB_RUN_NUMBER:-1}"
          sed -i '' "s/CFBundleVersion: \"1\"/CFBundleVersion: \"$BUILD\"/" project.yml
          echo "   Build number: $BUILD"

          echo "▶ Step 3/6: Drawing the app icon"
          python3 -m pip install --quiet --break-system-packages pillow 2>/dev/null || python3 -m pip install --quiet pillow
          python3 icon.py

          echo "▶ Step 4/6: Adding the VLC video engine (lets the app play MKV, AVI and more)"
          xcodegen generate >/dev/null
          command -v pod >/dev/null || brew install cocoapods >/dev/null
          VLC=0
          if pod install > pod.log 2>&1; then
            VLC=1
            echo "   VLC engine added"
          else
            echo "   ⚠️ Couldn't add the VLC engine; the app will still build, just without it."
            tail -25 pod.log
          fi

          build_app() {
            xcodebuild "$@" \
              -scheme CineScout \
              -configuration Release \
              -sdk iphoneos \
              -destination 'generic/platform=iOS' \
              -derivedDataPath build \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
              clean build > xcodebuild.log 2>&1
          }

          echo "▶ Step 5/6: Building the app (takes a while)"
          status=0
          if [ "$VLC" = 1 ]; then
            build_app -workspace CineScout.xcworkspace && status=0 || status=$?
            if [ "$status" -ne 0 ]; then
              echo "   ⚠️ Build with the VLC engine failed; building without it so you still get an app."
              grep -E "error:" xcodebuild.log | head -40 || true
              mv xcodebuild.log xcodebuild-with-vlc.log
              rm -rf Pods Podfile.lock CineScout.xcworkspace build
              xcodegen generate >/dev/null
              build_app -project CineScout.xcodeproj && status=0 || status=$?
              { echo; echo "===== Earlier attempt with the VLC engine ====="; cat xcodebuild-with-vlc.log; } >> xcodebuild.log
            fi
          else
            build_app -project CineScout.xcodeproj && status=0 || status=$?
          fi
          [ -f pod.log ] && { echo; echo "===== pod install ====="; cat pod.log; } >> xcodebuild.log
          grep -E "error:|BUILD (SUCCEEDED|FAILED)" xcodebuild.log | head -150 || true
          if [ "$status" -ne 0 ]; then
            echo "❌ The build failed. Scroll down to Artifacts on this run's page, download 'build-log' and send xcodebuild.log to Claude."
            exit "$status"
          fi

          echo "▶ Step 6/6: Packaging CineScout.ipa"
          rm -rf Payload CineScout.ipa
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/CineScout.app Payload/
          zip -qry CineScout.ipa Payload
          echo "✅ Done! CineScout.ipa (build $BUILD) is ready: scroll down to Artifacts on this run's page."

      - name: Save the app
        uses: actions/upload-artifact@v4
        with:
          name: CineScout-ipa
          path: CineScout.ipa

      - name: Save the error log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: xcodebuild.log
