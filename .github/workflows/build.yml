              /// CSS selectors for elements whose src/href/data-* holds the video address.
              var videoSelectors: [String]?
              /// CSS selectors for links/buttons that open a movie's video.
              var playLinkSelectors: [String]?
              /// Extra file extensions to treat as video.
              var extraVideoExtensions: [String]?
              /// Other hosts (e.g. your CDN) that player embeds may live on.
              var allowedHosts: [String]?
              /// Open <iframe> players on your own domains to find the video inside.
