              // MARK: Behaviour

              private func reveal(autoHide: Bool) {
                  showControls = true
                  if autoHide { scheduleHide() } else { hideTask?.cancel() }
              }

              private func hide() {
                  hideTask?.cancel()
                  if c.isPlaying { showControls = false }
              }

              private func scheduleHide() {
                  hideTask?.cancel()
                  hideTask = Task { @MainActor in
                      try? await Task.sleep(nanoseconds: 3_500_000_000)
                      guard !Task.isCancelled, c.isPlaying, !c.isScrubbing else { return }
                      showControls = false
                  }
              }

              private func show(flash text: String) {
                  flash = text
                  Task { @MainActor in
                      try? await Task.sleep(nanoseconds: 700_000_000)
                      if flash == text { flash = nil }
                  }
              }

              private func close() {
                  c.stop()
                  dismiss()
              }

              private func openExternally(_ player: ExternalPlayer) {
                  let url = player.url(for: c.request.url)
                  openURL(url) { ok in if !ok { missingApp = player.missingMessage } }
              }

              private func rateText(_ r: Float) -> String {
                  r == 1 ? "Normal" : String(format: "%gx", r)
              }

              static func clock(_ s: Double) -> String {
                  guard s.isFinite else { return "0:00" }
                  let t = Int(s.rounded(.down))
                  let h = t / 3600, m = (t % 3600) / 60, sec = t % 60
                  return h > 0 ? String(format: "%d:%02d:%02d", h, m, sec) : String(format: "%d:%02d", m, sec)
              }
          }
