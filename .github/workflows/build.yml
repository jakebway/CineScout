          cat > 'CineScout/Sources/WebBrowser.swift' <<'CINESCOUT_EOF'
          import Foundation
          import SwiftUI
          import UIKit
          import WebKit

          /// An outside site (e.g. FebBox) opened inside CineScout for one movie.
          struct WebSession: Identifiable {
              let id = UUID()
              let movie: Movie
              let link: ExternalLink
          }

          // MARK: Model

          /// Runs the in-app browser. Whenever the site hands over a video — a Play or Download
          /// button you tap, or the stream its own player loads — CineScout plays it natively
          /// instead of saving anything.
          @MainActor
          final class WebModel: NSObject, ObservableObject, WKNavigationDelegate, WKUIDelegate {
              let webView: WKWebView
              @Published var progress: Double = 0
              @Published var isLoading = false
              @Published var canGoBack = false
              @Published var canGoForward = false
              @Published var notice: String?
              /// Text of the button we highlighted (e.g. "Accept collaboration"), once found.
              @Published var highlighted: String?
              /// Video streams the page's own player asked for, newest first.
              @Published private(set) var captured: [URL] = []

              var onVideo: ((URL, [HTTPCookie], [String: String]) -> Void)?
              /// FebBox's site, and the only kind of FebBox address the page may move to on its own.
              var serviceHost: NSRegularExpression?
              var lockPattern: NSRegularExpression?
              /// While signing in, FebBox pages may move freely.
              private var freeBrowsingUntil = Date.distantPast
              private var observations: [NSKeyValueObservation] = []
              private var lastHandOff: (URL, Date)?

              private static let videoExts: Set<String> = ["mp4", "m4v", "mov", "mkv", "webm", "avi", "wmv", "ts", "m2ts", "m3u8", "mpg", "mpeg"]

              /// Watches the page's own requests for video streams (hls.js, fetch, XHR, <video>).
              static let sniffer = """
              (function () {
                if (window.__cinescout) return; window.__cinescout = true;
                const re = /\\.(m3u8|mp4|m4v|mov|mkv|webm)(\\?|#|$)/i;
                const send = (u) => { try { if (u && typeof u === 'string' && /^https?:/i.test(u) && re.test(u))
                  window.webkit.messageHandlers.cinescout.postMessage(u); } catch (e) {} };
                const abs = (u) => { try { return new URL(u, location.href).href; } catch (e) { return null; } };
                const open = XMLHttpRequest.prototype.open;
                XMLHttpRequest.prototype.open = function (m, u) { send(abs(u)); return open.apply(this, arguments); };
                if (window.fetch) { const f = window.fetch;
                  window.fetch = function (input) { send(abs(typeof input === 'string' ? input : (input && input.url))); return f.apply(this, arguments); }; }
                const scan = () => document.querySelectorAll('video, video source, source').forEach(v => send(abs(v.currentSrc || v.src)));
                new MutationObserver(scan).observe(document.documentElement, { childList: true, subtree: true, attributes: true, attributeFilter: ['src'] });
                document.addEventListener('play', (e) => { if (e.target && e.target.tagName === 'VIDEO') send(abs(e.target.currentSrc || e.target.src)); }, true);
              })();
              """

              override init() {
                  let config = WKWebViewConfiguration()
                  config.websiteDataStore = .default()
                  config.allowsInlineMediaPlayback = true
                  config.mediaTypesRequiringUserActionForPlayback = .all
                  webView = WKWebView(frame: .zero, configuration: config)
                  super.init()
                  let content = config.userContentController
                  content.addUserScript(WKUserScript(source: Self.sniffer, injectionTime: .atDocumentStart, forMainFrameOnly: false))
                  content.add(WeakMessageHandler(self), name: "cinescout")
                  webView.navigationDelegate = self
                  webView.uiDelegate = self
                  webView.allowsBackForwardNavigationGestures = true
                  observations = [
                      webView.observe(\.estimatedProgress) { [weak self] wv, _ in
                          let p = wv.estimatedProgress
                          Task { @MainActor in self?.progress = p }
                      },
                      webView.observe(\.isLoading) { [weak self] wv, _ in
                          let l = wv.isLoading, b = wv.canGoBack, f = wv.canGoForward
                          Task { @MainActor in
                              self?.isLoading = l
                              self?.canGoBack = b
                              self?.canGoForward = f
                          }
                      },
                  ]
              }

              /// Scrolls to and highlights the first button whose text matches `pattern`
              /// (FebBox's "Accept collaboration"). It only points at it; you tap it yourself.
              func installHighlighter(pattern: String) {
                  guard let data = try? JSONEncoder().encode(pattern), let literal = String(data: data, encoding: .utf8) else { return }
                  let js = """
                  (function () {
                    let re; try { re = new RegExp(\(literal), 'i'); } catch (e) { return; }
                    let done = false;
                    const find = () => {
                      if (done) return;
                      const els = document.querySelectorAll('button, a, [role=button], input[type=button], input[type=submit], div, span');
                      for (const el of els) {
                        if (!(el.children.length === 0 || el.matches('button, a, [role=button]'))) continue;
                        const t = ((el.innerText || el.value || '') + '').trim();
                        if (!t || t.length > 60 || !re.test(t)) continue;
                        const target = el.closest('button, a, [role=button]') || el;
                        target.scrollIntoView({ block: 'center', behavior: 'smooth' });
                        target.style.outline = '4px solid #ff9f0a';
                        target.style.outlineOffset = '4px';
                        try { target.animate([{ boxShadow: '0 0 0 0 rgba(255,159,10,0.9)' }, { boxShadow: '0 0 0 18px rgba(255,159,10,0)' }],
                                             { duration: 1200, iterations: Infinity }); } catch (e) {}
                        done = true;
                        try { window.webkit.messageHandlers.cinescoutHighlight.postMessage(t); } catch (e) {}
                        return;
                      }
                    };
                    find();
                    new MutationObserver(find).observe(document.documentElement, { childList: true, subtree: true });
                  })();
                  """
                  let content = webView.configuration.userContentController
                  content.addUserScript(WKUserScript(source: js, injectionTime: .atDocumentEnd, forMainFrameOnly: true))
                  content.add(WeakMessageHandler(self), name: "cinescoutHighlight")
              }

              func handle(name: String, body: String) {
                  if name == "cinescoutHighlight" {
                      if highlighted == nil { DiagLog.shared.log("web", "Highlighted “\(body)” for you to tap") }
                      highlighted = body
                  } else {
                      received(body)
                  }
              }

              func load(_ url: URL) {
                  freeBrowsingUntil = .distantPast
                  webView.load(URLRequest(url: url))
              }

              /// For signing in: lets FebBox move between its own pages for 10 minutes.
              func loadForSignIn(_ url: URL) {
                  freeBrowsingUntil = Date().addingTimeInterval(600)
                  notice = "Sign in, then tap ⋯ → Back to the Share Page."
                  webView.load(URLRequest(url: url))
              }

              func received(_ raw: String) {
                  guard let url = URL(string: raw), !captured.contains(url) else { return }
                  captured.insert(url, at: 0)
                  DiagLog.shared.debug("web", "Page's player requested \(url.absoluteString)")
              }

              /// The "Play in CineScout" button: the video this page is showing or has loaded.
              func playCurrentPage() async {
                  let js = """
                  (() => { const out = []; document.querySelectorAll('video, video source, source').forEach(v => {
                    const s = v.currentSrc || v.src; if (s && /^https?:/i.test(s)) out.push(s); }); return out; })()
                  """
                  let found = ((try? await webView.evaluateJavaScript(js)) as? [String])?.compactMap(URL.init(string:)) ?? []
                  let pick = found.first ?? captured.first(where: { $0.pathExtension.lowercased() == "m3u8" }) ?? captured.first
                  if let pick {
                      await handOff(pick)
                  } else {
                      notice = "No video found on this page yet. Tap the site's own Play or Download button first."
                  }
              }

              private func handOff(_ url: URL) async {
                  if let last = lastHandOff, last.0 == url, Date().timeIntervalSince(last.1) < 3 { return }
                  lastHandOff = (url, Date())
                  _ = try? await webView.evaluateJavaScript("document.querySelectorAll('video').forEach(v => v.pause()); true")
                  let all = await webView.configuration.websiteDataStore.httpCookieStore.allCookies()
                  let host = url.host?.lowercased() ?? ""
                  let cookies = all.filter { c in
                      let d = c.domain.lowercased().trimmingCharacters(in: CharacterSet(charactersIn: "."))
                      return host == d || host.hasSuffix("." + d)
                  }
                  var headers: [String: String] = [:]
                  if let page = webView.url { headers["Referer"] = page.absoluteString }
                  if let ua = try? await webView.evaluateJavaScript("navigator.userAgent") as? String { headers["User-Agent"] = ua }
                  DiagLog.shared.log("web", "Playing a video handed over by \(webView.url?.host ?? "the site"): \(url.absoluteString)")
                  onVideo?(url, cookies, headers)
              }

              private func looksLikeVideo(url: URL?, mime: String?, disposition: String?, length: Int64) -> Bool {
                  let m = (mime ?? "").lowercased()
                  if m.hasPrefix("video/") || m.contains("mpegurl") { return true }
                  if let url, Self.videoExts.contains(url.pathExtension.lowercased()) { return true }
                  let d = (disposition ?? "").lowercased()
                  if d.range(of: #"filename\*?=[^;]*\.(mp4|m4v|mov|mkv|webm|avi|wmv|ts|m2ts|mpg|mpeg)"#, options: .regularExpression) != nil { return true }
                  return m.contains("octet-stream") && length > 50_000_000
              }

              // MARK: WKNavigationDelegate

              func webView(_ webView: WKWebView, decidePolicyFor navigationAction: WKNavigationAction) async -> WKNavigationActionPolicy {
                  if let url = navigationAction.request.url, Self.videoExts.contains(url.pathExtension.lowercased()) {
                      Task { await handOff(url) }
                      return .cancel
                  }
                  // Stay on the share page: refuse FebBox redirects to any other FebBox address.
                  if let url = navigationAction.request.url,
                     navigationAction.targetFrame?.isMainFrame ?? true,
                     Date() > freeBrowsingUntil,
                     let lock = lockPattern,
                     let host = url.host?.lowercased(), Scraper.matches(serviceHost, host),
                     !Scraper.matches(lock, url.absoluteString),
                     navigationAction.navigationType != .linkActivated,
                     navigationAction.navigationType != .formSubmitted {
                      DiagLog.shared.log("web", "Refused redirect to \(url.absoluteString) (not a share page)")
                      notice = "FebBox tried to send you to \(url.path.isEmpty ? url.absoluteString : url.path). CineScout stayed on the share page. If you need to sign in, tap ⋯ → Sign In to FebBox."
                      return .cancel
                  }
                  return .allow
              }

              func webView(_ webView: WKWebView, decidePolicyFor navigationResponse: WKNavigationResponse) async -> WKNavigationResponsePolicy {
                  let r = navigationResponse.response
                  let disposition = (r as? HTTPURLResponse)?.value(forHTTPHeaderField: "Content-Disposition")
                  if looksLikeVideo(url: r.url, mime: r.mimeType, disposition: disposition, length: r.expectedContentLength), let url = r.url {
                      Task { await handOff(url) }
                      return .cancel
                  }
                  return .allow
              }

              func webView(_ webView: WKWebView, didFail navigation: WKNavigation!, withError error: Error) {
                  report(error)
              }

              func webView(_ webView: WKWebView, didFailProvisionalNavigation navigation: WKNavigation!, withError error: Error) {
                  report(error)
              }

              private func report(_ error: Error) {
                  let ns = error as NSError
                  // "Frame load interrupted" is what a cancelled download looks like; that's us taking over.
                  if ns.domain == "WebKitErrorDomain" && ns.code == 102 { return }
                  if ns.code == NSURLErrorCancelled { return }
                  DiagLog.shared.log("web", "Page failed to load: \(ns.domain) \(ns.code) \(ns.localizedDescription)")
                  notice = LibraryStore.friendly(error)
              }

              // MARK: WKUIDelegate — links that try to open a new window load here instead.

              func webView(_ webView: WKWebView, createWebViewWith configuration: WKWebViewConfiguration,
                           for navigationAction: WKNavigationAction, windowFeatures: WKWindowFeatures) -> WKWebView? {
                  if let url = navigationAction.request.url { webView.load(URLRequest(url: url)) }
                  return nil
              }
          }

          /// Breaks the retain cycle between WebKit's script handler and the model.
          @MainActor
          final class WeakMessageHandler: NSObject, WKScriptMessageHandler {
              weak var model: WebModel?
              init(_ model: WebModel) { self.model = model }

              func userContentController(_ userContentController: WKUserContentController, didReceive message: WKScriptMessage) {
                  guard let s = message.body as? String else { return }
                  model?.handle(name: message.name, body: s)
              }
          }

          struct WebViewHost: UIViewRepresentable {
              let model: WebModel
              func makeUIView(context: Context) -> WKWebView { model.webView }
              func updateUIView(_ uiView: WKWebView, context: Context) {}
          }

          // MARK: Screen

          struct WebBrowserView: View {
              let session: WebSession
              @EnvironmentObject private var store: LibraryStore
              @Environment(\.dismiss) private var dismiss
              @Environment(\.openURL) private var openURL
              @StateObject private var model = WebModel()
              @State private var preparing: PrepareJob?
              @AppStorage("webHintDismissed") private var hintDismissed = false

              var body: some View {
                  NavigationStack {
                      VStack(spacing: 0) {
                          if !hintDismissed {
                              HStack(alignment: .top, spacing: 10) {
                                  Image(systemName: "play.rectangle.fill").foregroundStyle(.orange)
                                  Text("Sign in if \(session.link.service) asks (you'll stay signed in). Then tap \(session.link.service)'s own **Play** or **Download** on the file, and CineScout downloads it, compresses it, plays it, and deletes it when you close the player.")
                                      .font(.footnote)
                                      .fixedSize(horizontal: false, vertical: true)
                                  Spacer(minLength: 0)
                                  Button { hintDismissed = true } label: {
                                      Image(systemName: "xmark").font(.caption.weight(.bold)).foregroundStyle(.secondary)
                                  }
                              }
                              .padding(12)
                              .background(Color(white: 0.12))
                          }
                          if model.isLoading {
                              ProgressView(value: model.progress).tint(.orange)
                          }
                          WebViewHost(model: model)
                          if let button = model.highlighted {
                              HStack(spacing: 10) {
                                  Image(systemName: "hand.tap.fill").foregroundStyle(.orange)
                                  Text("Tap the highlighted **\(button)** button, then play the file.")
                                      .font(.footnote)
                                  Spacer(minLength: 0)
                              }
                              .padding(12)
                              .background(Color.orange.opacity(0.18))
                          }
                          if let notice = model.notice {
                              HStack {
                                  Text(notice).font(.footnote)
                                  Spacer()
                                  Button("OK") { model.notice = nil }.font(.footnote.weight(.semibold))
                              }
                              .padding(12)
                              .background(Color.orange.opacity(0.2))
                          }
                          bottomBar
                      }
                      .navigationTitle(session.movie.title)
                      .navigationBarTitleDisplayMode(.inline)
                      .toolbar {
                          ToolbarItem(placement: .cancellationAction) { Button("Done") { dismiss() } }
                          ToolbarItem(placement: .primaryAction) {
                              Menu {
                                  Button { model.load(session.link.url) } label: { Label("Back to the Share Page", systemImage: "arrow.uturn.backward") }
                                  Button {
                                      if let host = session.link.url.host, let home = URL(string: "https://\(host)") { model.loadForSignIn(home) }
                                  } label: { Label("Sign In to \(session.link.service)", systemImage: "person.crop.circle") }
                                  Button { model.webView.reload() } label: { Label("Reload", systemImage: "arrow.clockwise") }
                                  Button { openURL(session.link.url) } label: {
                                      Label("Open in \(session.link.service) App or Safari", systemImage: "arrow.up.forward.app")
                                  }
                                  Button { UIPasteboard.general.string = session.link.url.absoluteString } label: {
                                      Label("Copy Link", systemImage: "link")
                                  }
                              } label: { Image(systemName: "ellipsis.circle") }
                          }
                      }
                  }
                  .preferredColorScheme(.dark)
                  .onAppear {
                      model.onVideo = { url, cookies, headers in
                          // Download → compress → play → delete.
                          preparing = PrepareJob(movie: session.movie, url: url, cookies: cookies, headers: headers)
                      }
                      if model.webView.url == nil {
                          if let svc = Rules.load().externalServices?.first(where: { $0.name == session.link.service }) {
                              model.serviceHost = Scraper.regex(svc.hostPattern, name: "hostPattern")
                              model.lockPattern = Scraper.regex(svc.acceptPattern, name: "acceptPattern")
                          }
                          if let pattern = Rules.load().externalServices?.first(where: { $0.name == session.link.service })?.highlightPattern,
                             !pattern.isEmpty {
                              model.installHighlighter(pattern: pattern)
                          }
                          DiagLog.shared.log("web", "Opening \(session.link.service) for “\(session.movie.title)”: \(session.link.url.absoluteString)")
                          model.load(session.link.url)
                      }
                  }
                  .fullScreenCover(item: $preparing) { job in
                      PrepareAndPlayView(job: job).environmentObject(store)
                  }
              }

              private var bottomBar: some View {
                  HStack(spacing: 22) {
                      Button { model.webView.goBack() } label: { Image(systemName: "chevron.backward") }
                          .disabled(!model.canGoBack)
