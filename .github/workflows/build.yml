          #  CineScout build script
          #  GitHub runs this on a Mac to turn the code below into CineScout.ipa.
          #  You never need to edit this file. When Claude sends a new version,
          #  upload it to your repository to replace this one.
          # =====================================================================
          set -euo pipefail

          echo "▶ Step 1/6: Installing tools"
          brew install xcodegen >/dev/null

          echo "▶ Step 2/6: Writing the app's code"
          rm -rf CineScout project.yml Podfile Pods Podfile.lock CineScout.xcworkspace CineScout.xcodeproj build
