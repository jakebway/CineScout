              static var fileURL: URL {
                  FileManager.default.urls(for: .documentDirectory, in: .userDomainMask)[0].appendingPathComponent("rules.json")
              }

              private static let writtenDefaultsKey = "rulesDefaultsWritten"

              static func encoded(_ r: Rules) -> String {
                  let enc = JSONEncoder()
                  enc.outputFormatting = [.prettyPrinted, .sortedKeys, .withoutEscapingSlashes]
                  guard let data = try? enc.encode(r) else { return "{}" }
                  return String(decoding: data, as: UTF8.self)
              }

              static var defaultsText: String { encoded(defaults) }

              /// Rules to scan with. Creates rules.json the first time, and refreshes it when it
              /// still holds an older app's untouched defaults.
              static func load() -> Rules {
                  let fm = FileManager.default
                  let ud = UserDefaults.standard
                  if !fm.fileExists(atPath: fileURL.path) {
                      writeDefaults()
                      return defaults
                  }
                  let text = (try? String(contentsOf: fileURL, encoding: .utf8)) ?? ""
                  if let written = ud.string(forKey: writtenDefaultsKey), written == text, text != defaultsText {
                      writeDefaults()
                      DiagLog.shared.log("rules", "Updated untouched rules.json to this build's defaults.")
                      return defaults
                  }
                  let (rules, error) = validate(text)
                  if let rules {
                      DiagLog.shared.log("rules", "Using \(text == defaultsText ? "default" : "custom") rules (version \(rules.version ?? 0)).")
                      return rules.resolved
                  }
                  DiagLog.shared.log("rules", "rules.json has a problem, scanning with defaults instead: \(error ?? "unknown")")
                  return defaults
              }

              static func currentText() -> String {
                  (try? String(contentsOf: fileURL, encoding: .utf8)) ?? defaultsText
              }

              static var isCustom: Bool { currentText() != defaultsText }

              static func writeDefaults() {
                  try? defaultsText.write(to: fileURL, atomically: true, encoding: .utf8)
                  UserDefaults.standard.set(defaultsText, forKey: writtenDefaultsKey)
              }

              /// Validates and saves. Returns an error message, or nil on success.
              static func save(_ text: String) -> String? {
                  let cleaned = clean(text)
                  let (rules, error) = validate(cleaned)
                  guard rules != nil else { return error }
                  do {
                      try cleaned.write(to: fileURL, atomically: true, encoding: .utf8)
                      DiagLog.shared.log("rules", "Saved new rules (version \(rules?.version ?? 0)).")
                      return nil
                  } catch {
                      return "Couldn't save: \(error.localizedDescription)"
                  }
              }

              /// Strips chat code fences and, if needed, curly quotes added by the keyboard.
              static func clean(_ text: String) -> String {
                  var t = text.trimmingCharacters(in: .whitespacesAndNewlines)
                  if t.hasPrefix("```") {
                      if let nl = t.firstIndex(of: "\n") { t = String(t[t.index(after: nl)...]) } else { t = "" }
                  }
                  if t.hasSuffix("```") { t = String(t.dropLast(3)) }
                  t = t.trimmingCharacters(in: .whitespacesAndNewlines)
                  if (try? JSONDecoder().decode(Rules.self, from: Data(t.utf8))) == nil {
                      let straightened = t
                          .replacingOccurrences(of: "“", with: "\"").replacingOccurrences(of: "”", with: "\"")
                          .replacingOccurrences(of: "‘", with: "'").replacingOccurrences(of: "’", with: "'")
                      if (try? JSONDecoder().decode(Rules.self, from: Data(straightened.utf8))) != nil { return straightened }
                  }
                  return t
              }

              static func validate(_ text: String) -> (Rules?, String?) {
                  let r: Rules
                  do {
                      r = try JSONDecoder().decode(Rules.self, from: Data(clean(text).utf8))
                  } catch {
                      return (nil, "That isn't valid rules JSON. \(String(String(describing: error).prefix(300)))")
                  }
                  let patterns: [(String, String?)] = [
                      ("playLabelPattern", r.playLabelPattern), ("genericLabelPattern", r.genericLabelPattern),
                      ("labelStripPattern", r.labelStripPattern), ("playHrefPattern", r.playHrefPattern),
                      ("playClassPattern", r.playClassPattern), ("skipHrefPattern", r.skipHrefPattern),
                      ("chainLabelPattern", r.chainLabelPattern), ("excludeVideoPattern", r.excludeVideoPattern),
                      ("robotClickPattern", r.robotClickPattern),
                      ("febboxAcceptPattern", r.febboxAcceptPattern), ("febboxConfirmPattern", r.febboxConfirmPattern),
                      ("febboxCollabPattern", r.febboxCollabPattern), ("febboxRemovePattern", r.febboxRemovePattern),
                      ("febboxMorePattern", r.febboxMorePattern), ("febboxPreviewPattern", r.febboxPreviewPattern),
                  ]
                  var allPatterns = patterns
                  for svc in r.externalServices ?? [] {
                      allPatterns.append(("externalServices \(svc.name) hostPattern", svc.hostPattern))
                      allPatterns.append(("externalServices \(svc.name) labelPattern", svc.labelPattern))
                      allPatterns.append(("externalServices \(svc.name) highlightPattern", svc.highlightPattern))
                      allPatterns.append(("externalServices \(svc.name) acceptPattern", svc.acceptPattern))
                      allPatterns.append(("externalServices \(svc.name) searchPattern", svc.searchPattern))
                      for p in svc.canonicalPatterns ?? [] { allPatterns.append(("externalServices \(svc.name) canonicalPatterns", p)) }
                  }
                  for (name, p) in allPatterns {
                      guard let p, !p.isEmpty else { continue }
                      if (try? NSRegularExpression(pattern: p)) == nil { return (nil, "\(name) isn't a valid pattern.") }
                  }
                  if let script = r.script, !script.isEmpty {
                      guard let ctx = JSContext() else { return (nil, "JavaScript isn't available.") }
                      var jsError: String?
                      ctx.exceptionHandler = { _, e in jsError = e?.toString() }
                      ctx.evaluateScript(script)
                      if let jsError { return (nil, "Script error: \(jsError)") }
                      if ctx.objectForKeyedSubscript("extract")?.isUndefined ?? true {
                          return (nil, "The script needs a function named extract(html, url).")
                      }
                  }
                  return (r, nil)
              }
          }
