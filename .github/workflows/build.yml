          import Foundation
          import UIKit
          import WebKit

          /// A hidden browser that does by hand-style taps what you'd do yourself:
          ///  1. open the movie's page, tap Watch now → Download until the FebBox share page loads
          ///     (refusing any other FebBox address on the way),
          ///  2. on the share page tap Accept collaboration,
          ///  3. play FebBox's preview there, or open your console's collaborative files and
          ///     preview the file from there,
          ///  4. later, remove that item from your collaborative files.
          /// Every button's wording comes from the rules, so it can be adjusted from the Console.
          @MainActor
          final class BrowserRobot: NSObject, WKNavigationDelegate, WKUIDelegate {
              struct Result {
                  var share: URL?
                  var videos: [URL] = []
                  var cookies: [HTTPCookie] = []
                  var headers: [String: String] = [:]
                  /// File / item names seen on the share page (used to find it in the console later).
                  var names: [String] = []
              }

              private enum Goal: String { case findShare, onShare, console, remove }

              private let webView: WKWebView
              private var holder: UIView?
              private let status: (String) -> Void
              private let rules: Rules
              private let service: ExternalService?
              private let serviceHost: NSRegularExpression?
              private let accept: NSRegularExpression?
              private let videoExts: Set<String> = ["mp4", "m4v", "mov", "mkv", "webm", "avi", "m3u8", "ts", "m2ts", "wmv"]

              private var goal: Goal = .findShare
              private var stopAtShare = false
              private var share: URL?
              private var videos: [URL] = []
              private var names: [String] = []
              private var clicked: [String] = []
              private var siteBase: String?
              private var accepted = false
              private var probes = 0
              private var removeClicked = false
              private var goneCount = 0
              private var removed = false
              private var finished = false
              private var waiter: CheckedContinuation<Void, Never>?
              private var loop: Task<Void, Never>?
              private var timeout: Task<Void, Never>?

              init(rules: Rules, status: @escaping (String) -> Void) {
                  let r = rules.resolved
                  self.rules = r
                  self.status = status
                  let svc = r.externalServices?.first
                  self.service = svc
                  self.serviceHost = Scraper.regex(svc?.hostPattern, name: "hostPattern")
                  self.accept = Scraper.regex(svc?.acceptPattern, name: "acceptPattern")

                  let config = WKWebViewConfiguration()
                  config.websiteDataStore = .default()          // shares your FebBox sign-in with the visible browser
                  config.allowsInlineMediaPlayback = true
                  config.mediaTypesRequiringUserActionForPlayback = []
                  webView = WKWebView(frame: CGRect(x: 0, y: 0, width: 390, height: 844), configuration: config)
                  super.init()

                  let content = config.userContentController
                  let popups = """
                  (function () {
                    window.open = function (u) {
                      try { window.webkit.messageHandlers.robot.postMessage('open:' + new URL(u, location.href).href); } catch (e) {}
                      return null;
                    };
                    window.alert = function () {}; window.confirm = function () { return true; };
                  })();
