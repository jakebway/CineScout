                  playHrefPattern: #"(?i)/(?:play|watch|stream|player|embed|e|v)/|/(?:play|watch|stream|player)(?:\.php|\.html?)?(?:[?#]|$)|[?&](?:play|watch|v|vid|video|stream)="#,
                  playClassPattern: #"(?i)\b(?:play|watch|btn-play|play-btn|play-button|watch-btn|watch-button|stream|player)\b"#,
                  skipHrefPattern: #"(?i)logout|log-out|signout|sign-out|/delete|[?&](?:action|do)=(?:delete|remove)|wp-admin|wp-login|/cart|/checkout|/account|/settings|/admin"#,
                  titleSelectors: [],
                  posterSelectors: [],
                  videoSelectors: [],
                  playLinkSelectors: [],
                  extraVideoExtensions: [],
                  allowedHosts: [],
                  followIframes: true,
