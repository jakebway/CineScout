          import Foundation
          import SwiftUI
          import UIKit

          @MainActor
          final class LibraryStore: ObservableObject {
              /// One library for the whole app (background refresh uses it too).
              static let shared = LibraryStore()

              enum ScanState: Equatable {
                  case idle
                  case scanning(pages: Int, found: Int, status: String)
                  case finished(String)
                  case failed(String)
              }

              @Published private(set) var movies: [Movie] = []
              @Published private(set) var sites: [Site] = []
              @Published private(set) var progress: [String: WatchProgress] = [:]
              @Published var scanState: ScanState = .idle
              @Published var nowPlaying: PlayRequest?
              @Published var webSession: WebSession?
              /// A plain-English message shown as an alert.
              @Published var alertMessage: String?
              /// What the hidden browser is doing right now (shown over the app while you wait).
              @Published private(set) var robotStatus: String?
              /// A video on its way through download → compress → play → delete.
              @Published var prepareJob: PrepareJob?
              private var robot: BrowserRobot?
              private var backgroundRobot: BrowserRobot?
              private var robotQueue: [String] = []
              private var robotTried: Set<String> = []
              /// Movies found by the most recent scan (used by first-time setup).
              @Published private(set) var lastScanFound = 0

              var isScanning: Bool {
                  if case .scanning = scanState { return true }
                  return false
              }

              var maxPages: Int {
                  get { UserDefaults.standard.object(forKey: "maxPages") as? Int ?? 500 }
                  set { UserDefaults.standard.set(newValue, forKey: "maxPages") }
              }

              private var scanTask: Task<Void, Never>?
              private var currentScan = UUID()
              private static let docs = FileManager.default.urls(for: .documentDirectory, in: .userDomainMask)[0]
              private let fileURL = LibraryStore.docs.appendingPathComponent("library.json")
              private let progressURL = LibraryStore.docs.appendingPathComponent("progress.json")

              private struct Saved: Codable {
                  var movies: [Movie]
                  var sites: [Site]
              }

              private init() { load() }

              // MARK: Lookups for the screens

              func movie(_ id: String) -> Movie? { movies.first { $0.id == id } }

              func movies(_ ids: [String]) -> [Movie] {
                  let byID = Dictionary(movies.map { ($0.id, $0) }, uniquingKeysWith: { a, _ in a })
                  return ids.compactMap { byID[$0] }
              }

              var featured: [Movie] {
                  let withArt = movies.filter { $0.posterURL != nil }
                  let pool = withArt.count >= 3 ? withArt : movies
                  return Array(pool.sorted { a, b in
                      let ra = (a.overview == nil ? 0 : 1), rb = (b.overview == nil ? 0 : 1)
                      return ra != rb ? ra > rb : a.addedAt > b.addedAt
                  }.prefix(6))
              }

              var recentlyAdded: [Movie] {
                  Array(movies.sorted { $0.addedAt > $1.addedAt }.prefix(20))
              }

              var continueWatching: [Movie] {
                  let ids = progress.sorted { $0.value.updated > $1.value.updated }.map(\.key)
                  return movies(ids)
              }

              struct GenreShelf: Identifiable {
                  let name: String
                  let movies: [Movie]
                  var id: String { name }
              }

              var genreShelves: [GenreShelf] {
                  var groups: [String: [Movie]] = [:]
                  for m in movies { for g in m.genres { groups[g, default: []].append(m) } }
                  return groups
                      .filter { $0.value.count >= 3 }
                      .sorted { $0.value.count > $1.value.count }
                      .prefix(8)
                      .map { GenreShelf(name: $0.key, movies: $0.value) }
              }

              var allGenres: [String] {
                  Array(Set(movies.flatMap(\.genres))).sorted()
              }

              func moreLike(_ movie: Movie) -> [Movie] {
                  let g = Set(movie.genres)
                  guard !g.isEmpty else { return [] }
                  return Array(movies.filter { $0.id != movie.id && !g.isDisjoint(with: $0.genres) }.prefix(15))
              }

              // MARK: Finding videos as you browse

              /// Movies whose video is being looked up right now.
              @Published private(set) var lookingUp: Set<String> = []
              private var lookupQueue: [String] = []
              private var lookupRunning = 0
              private var lookupWaiters: [String: [CheckedContinuation<Movie?, Never>]] = [:]
              private var saveTask: Task<Void, Never>?

              /// A movie came on screen: look up its video in the background.
              func prefetch(_ m: Movie) {
                  if !m.needsLookup { queueRobot(m) }
                  guard m.needsLookup, m.pageURL != nil, !lookingUp.contains(m.id), !lookupQueue.contains(m.id) else { return }
                  lookupQueue.append(m.id)
                  pumpLookups()
              }

              /// It scrolled away before its turn came: don't bother.
              func cancelPrefetch(_ m: Movie) {
                  lookupQueue.removeAll { $0 == m.id }
                  robotQueue.removeAll { $0 == m.id }
              }

              /// Look up a movie's video right now (you opened it or pressed Play) and wait for it.
              func lookUpNow(_ m: Movie) async -> Movie? {
                  guard let current = movie(m.id) else { return m }
                  guard current.needsLookup, current.pageURL != nil else { return current }
                  if !lookingUp.contains(m.id) {
                      lookupQueue.removeAll { $0 == m.id }
                      lookupQueue.insert(m.id, at: 0)
                  }
                  return await withCheckedContinuation { c in
                      lookupWaiters[m.id, default: []].append(c)
                      pumpLookups()
                  }
              }

              private func pumpLookups() {
                  while lookupRunning < 4, !lookupQueue.isEmpty {
                      let id = lookupQueue.removeFirst()
                      guard let m = movie(id), m.needsLookup, let page = m.pageURL else {
                          finishLookup(id)
                          continue
                      }
                      lookupRunning += 1
                      lookingUp.insert(id)
                      Task {
                          let scraper = Scraper(root: page, maxPages: 40, sourceKey: m.source, rules: Rules.load())
                          let updated = await scraper.resolve(m)
                          self.applyLookup(updated)
                          if let after = self.movie(id) { self.queueRobot(after) }
                          self.lookupRunning -= 1
                          self.lookingUp.remove(id)
                          self.finishLookup(id)
                          self.pumpLookups()
                      }
                  }
              }

              private func finishLookup(_ id: String) {
                  let found = movie(id)
                  for c in lookupWaiters.removeValue(forKey: id) ?? [] { c.resume(returning: found) }
              }

              private func applyLookup(_ updated: Movie) {
                  guard let i = movies.firstIndex(where: { $0.id == updated.id }) else { return }
                  var m = movies[i]
                  for v in updated.videoURLs where !m.videoURLs.contains(v) { m.videoURLs.append(v) }
                  for l in updated.externalLinks where !m.externalLinks.contains(where: { $0.url == l.url }) { m.externalLinks.append(l) }
                  m.pendingLinks = []
                  movies[i] = m
                  saveSoon()
              }

              /// Batches library saves while lots of lookups finish.
              private func saveSoon() {
                  saveTask?.cancel()
                  saveTask = Task {
                      try? await Task.sleep(nanoseconds: 2_000_000_000)
                      guard !Task.isCancelled else { return }
                      self.save()
                  }
              }

              /// Runs while the phone is idle (see BackgroundWork): refresh if stale, then
              /// look up videos for movies that still need it.
              func backgroundWork() async {
                  let oldest = sites.map { $0.lastScanned ?? .distantPast }.min() ?? .distantPast
                  if !sites.isEmpty && Date().timeIntervalSince(oldest) > 3 * 3600 && !isScanning {
                      rescanAll()
                      await waitForScan()
                  }
                  var done = 0
                  for m in movies where m.needsLookup && m.pageURL != nil {
                      if Task.isCancelled || done >= 60 { break }
                      _ = await lookUpNow(m)
                      done += 1
                  }
                  DiagLog.shared.log("background", "Background work finished (\(done) movie(s) looked up).")
              }

              // MARK: Fixes from the Console

              func editMovie(_ id: String, title: String?, year: String?, overview: String?, poster: URL?) -> Bool {
                  guard let i = movies.firstIndex(where: { $0.id == id }) else { return false }
                  if let title { movies[i].title = title }
                  if let year { movies[i].year = year.isEmpty ? nil : year }
                  if let overview { movies[i].overview = overview.isEmpty ? nil : overview }
                  if let poster { movies[i].posterURL = poster }
                  save()
                  return true
              }

              func removeMovie(_ id: String) -> Bool {
                  let before = movies.count
                  movies.removeAll { $0.id == id }
                  save()
                  return movies.count < before
              }

              func clearLibrary() {
                  movies.removeAll()
                  for i in sites.indices { sites[i].movieCount = 0 }
                  save()
              }

              func lookUpAll() {
                  for m in movies where m.needsLookup { prefetch(m) }
              }

              // MARK: Playback

              /// Plays the movie (resuming where you left off), or opens its FebBox / web link.
              // MARK: One-tap Play

              /// Everything behind the Play button, fully automatic:
              /// a video we have → play; play links not opened yet → open them;
              /// still nothing → the hidden browser clicks Watch now → Download → FebBox share page,
              /// finds the video file, then download → compress → play → delete.
              func playSmart(_ given: Movie) async {
                  guard robot == nil else { return }
                  var m = movie(given.id) ?? given
                  if m.hasVideo { play(m); return }

                  if m.needsLookup {
                      robotStatus = "Looking for the video…"
                      if let r = await lookUpNow(m) { m = r }
                      if m.hasVideo { robotStatus = nil; play(m); return }
                  }

                  let svc = Rules.load().externalServices?.first
                  let knownShare = m.externalLinks.first { l in svc.map { $0.accepts($0.canonical(l.url)) } ?? true }?.url
                  guard knownShare != nil || m.pageURL != nil else {
                      robotStatus = nil
                      alertMessage = "CineScout doesn't have a page or link for this movie yet. Pull down on the Home screen to rescan."
                      return
                  }

                  robotStatus = knownShare == nil ? "Opening the movie's page…" : "Opening the FebBox share page…"
                  backgroundRobot?.cancel()
                  let r = BrowserRobot(rules: Rules.load()) { [weak self] text in self?.robotStatus = text }
                  robot = r
                  let result = await r.run(page: m.pageURL, share: knownShare)
                  robot = nil
                  robotStatus = nil

                  if let share = result.share { remember(share: share, for: m.id, service: svc?.name ?? "FebBox") }
                  m = movie(m.id) ?? m

                  if let video = result.videos.first {
                      let rules = Rules.load().resolved
                      let names = result.names
                      if rules.febboxStreamPreview ?? true {
                          // Play FebBox's own preview stream directly: nothing is downloaded.
                          var req = request(for: m, url: video, cookies: result.cookies, headers: result.headers)
                          req.febboxNames = names
                          DiagLog.shared.log("robot", "Streaming FebBox's preview for “\(m.title)”.")
                          nowPlaying = req
                      } else {
                          var job = PrepareJob(movie: m, url: video, cookies: result.cookies, headers: result.headers)
                          job.febboxNames = names
                          prepareJob = job
                      }
                  } else if let share = result.share {
                      DiagLog.shared.log("robot", "No video file found automatically on \(share.absoluteString); showing the share page.")
                      webSession = WebSession(movie: m, link: ExternalLink(service: svc?.name ?? "FebBox", url: share, label: nil))
                  } else {
                      alertMessage = "CineScout opened “\(m.title)” and clicked through, but didn't reach a FebBox share page. Send Claude a report from Settings so it can be fixed with a paste."
                  }
              }

              // MARK: Removing finished items from your FebBox collaborative files

              private let pendingRemovalKey = "febboxPendingRemovals"
              private var removalFailuresThisSession = 0

              private var pendingRemovals: [[String]] {
                  get { (UserDefaults.standard.array(forKey: pendingRemovalKey) as? [[String]]) ?? [] }
                  set { UserDefaults.standard.set(newValue, forKey: pendingRemovalKey) }
              }

              /// Called when you close the player after a FebBox video.
              func scheduleFebBoxRemoval(_ names: [String], title: String) {
                  guard Rules.load().resolved.febboxRemoveAfterPlay ?? true, !names.isEmpty else { return }
                  if !pendingRemovals.contains(names) { pendingRemovals.append(names) }
                  DiagLog.shared.log("robot", "Will remove “\(title)” from your FebBox collaborative files.")
                  Task {
                      try? await Task.sleep(nanoseconds: 1_500_000_000)
                      self.pumpRemovals()
                  }
              }

              /// Works through removals one at a time, in the background. Ones that fail are kept
              /// and tried again the next time the app comes to the front.
              func pumpRemovals() {
                  guard backgroundRobot == nil, robot == nil, nowPlaying == nil, prepareJob == nil,
                        removalFailuresThisSession < 3, let names = pendingRemovals.first else { return }
                  let r = BrowserRobot(rules: Rules.load()) { _ in }
                  backgroundRobot = r
                  Task {
                      let ok = await r.remove(names: names)
                      self.backgroundRobot = nil
                      if ok {
                          self.pendingRemovals.removeAll { $0 == names }
                      } else {
                          self.removalFailuresThisSession += 1
                          var list = self.pendingRemovals
                          if let i = list.firstIndex(of: names) { list.append(list.remove(at: i)) }
                          self.pendingRemovals = list
                      }
                      self.pumpRemovals()
                      self.pumpRobot()
                  }
              }

              func cancelRobot() {
                  robot?.cancel()
              }

              private func remember(share: URL, for id: String, service: String) {
                  guard let i = movies.firstIndex(where: { $0.id == id }),
                        !movies[i].externalLinks.contains(where: { $0.url == share }) else { return }
                  movies[i].externalLinks.insert(ExternalLink(service: service, url: share, label: nil), at: 0)
                  saveSoon()
              }

              /// Background: find share links for movies on screen before you tap them.
              private func queueRobot(_ m: Movie) {
                  guard !m.hasVideo, m.externalLinks.isEmpty, !m.needsLookup, m.pageURL != nil,
                        !robotTried.contains(m.id), !robotQueue.contains(m.id) else { return }
                  robotQueue.append(m.id)
                  pumpRobot()
              }

              private func pumpRobot() {
                  guard backgroundRobot == nil, robot == nil, prepareJob == nil, nowPlaying == nil,
                        !robotQueue.isEmpty else { return }
                  let id = robotQueue.removeFirst()
                  robotTried.insert(id)
                  guard let m = movie(id), m.externalLinks.isEmpty, !m.hasVideo, let page = m.pageURL else { pumpRobot(); return }
                  let r = BrowserRobot(rules: Rules.load()) { _ in }
                  backgroundRobot = r
                  Task {
                      let result = await r.run(page: page, share: nil, stopAtShare: true)
                      if let share = result.share {
                          self.remember(share: share, for: id, service: Rules.load().externalServices?.first?.name ?? "FebBox")
                      }
                      self.backgroundRobot = nil
                      self.pumpRobot()
                  }
              }

              func play(_ movie: Movie, url: URL? = nil, fromStart: Bool = false) {
                  guard let u = url ?? movie.bestVideo(canPlayAnything: PlaybackSupport.vlc) else { return }
                  var start = 0.0
                  if !fromStart, let p = progress[movie.id], p.position > 10, p.duration <= 0 || p.position < p.duration * 0.95 {
                      start = p.position
                  }
                  nowPlaying = PlayRequest(movie: movie, url: u, start: start)
              }

              /// A play request for a video the in-app browser handed over, resuming where you left off.
              func request(for movie: Movie, url: URL, cookies: [HTTPCookie], headers: [String: String]) -> PlayRequest {
                  var start = 0.0
                  if let p = progress[movie.id], p.position > 10, p.duration <= 0 || p.position < p.duration * 0.95 {
                      start = p.position
                  }
                  return PlayRequest(movie: movie, url: url, start: start, cookies: cookies, headers: headers)
              }

              /// Opens a FebBox (or other service) link inside CineScout.
              func open(_ link: ExternalLink, for movie: Movie) {
                  var l = link
                  if let svc = Rules.load().externalServices?.first(where: { $0.name == link.service }) {
                      l.url = svc.canonical(link.url)
                      guard svc.accepts(l.url) else {
                          DiagLog.shared.log("open", "Won't open \(l.url.absoluteString) for “\(movie.title)”: not a \(svc.name) share link. Looking for the share link instead.")
                          Task { await findShareLink(for: movie, service: svc) }
                          return
                      }
                  }
                  webSession = WebSession(movie: movie, link: l)
              }

              /// Drops a non-share link and follows the movie's page (Watch now → Download → …)
              /// until its share link turns up, then opens that.
              private func findShareLink(for movie: Movie, service svc: ExternalService) async {
                  guard let i = movies.firstIndex(where: { $0.id == movie.id }) else { return }
                  movies[i].externalLinks.removeAll { !svc.accepts(svc.canonical($0.url)) }
                  if let page = movies[i].pageURL, !movies[i].pendingLinks.contains(page) {
                      movies[i].pendingLinks.append(page)
                  }
                  guard movies[i].needsLookup else {
                      alertMessage = "CineScout couldn't find a \(svc.name) share link for this movie."
                      return
                  }
                  let found = await lookUpNow(movies[i])
                  if let m = found, let share = m.externalLinks.first(where: { $0.service == svc.name && svc.accepts($0.url) }) {
                      webSession = WebSession(movie: m, link: share)
                  } else if let m = found, m.hasVideo {
                      play(m)
                  } else {
                      alertMessage = "CineScout followed this movie's page but didn't find a \(svc.name) share link. Send Claude a report from Settings so it can look."
                  }
              }

              /// Libraries saved by older versions may hold FebBox links that aren't share links
              /// (like the site's account page). Remove them and look up the real share link instead.
              private func cleanServiceLinks() {
                  let services = Rules.load().externalServices ?? []
                  var fixed = 0
                  for i in movies.indices {
                      let before = movies[i].externalLinks.count
                      movies[i].externalLinks.removeAll { l in
                          guard let svc = services.first(where: { $0.name == l.service }) else { return false }
                          return !svc.accepts(svc.canonical(l.url))
                      }
                      guard movies[i].externalLinks.count != before else { continue }
                      fixed += 1
                      if !movies[i].hasVideo, movies[i].externalLinks.isEmpty, let page = movies[i].pageURL,
                         !movies[i].pendingLinks.contains(page) {
                          movies[i].pendingLinks.append(page)
                      }
                  }
                  if fixed > 0 {
                      DiagLog.shared.log("open", "Removed non-share FebBox links from \(fixed) movie(s); their share links will be looked up.")
                      save()
                  }
              }

              func resumePosition(_ id: String) -> Double? {
                  guard let p = progress[id], p.position > 10 else { return nil }
                  return p.position
              }

              func progressFraction(_ id: String) -> Double? {
                  guard let p = progress[id], p.duration > 0 else { return nil }
                  return min(1, p.position / p.duration)
              }

              func remainingText(_ id: String) -> String? {
                  guard let p = progress[id], p.duration > 0 else { return nil }
                  let mins = max(1, Int((p.duration - p.position) / 60))
                  return mins >= 60 ? "\(mins / 60)h \(mins % 60)m left" : "\(mins) min left"
              }

              func saveProgress(id: String, position: Double, duration: Double) {
                  guard position.isFinite, duration.isFinite else { return }
                  if duration > 0 && position >= duration * 0.95 {
                      progress[id] = nil
                  } else if position > 10 {
                      progress[id] = WatchProgress(position: position, duration: duration, updated: Date())
                  }
                  if let data = try? JSONEncoder().encode(progress) { try? data.write(to: progressURL, options: .atomic) }
              }

              func clearProgress(_ id: String) {
                  progress[id] = nil
                  if let data = try? JSONEncoder().encode(progress) { try? data.write(to: progressURL, options: .atomic) }
              }

              // MARK: Scanning

              /// Checks what the person typed. Returns an error message or nil if it looks fine.
              func problem(with raw: String) -> String? {
                  let t = raw.trimmingCharacters(in: .whitespacesAndNewlines)
                  if t.isEmpty { return "Type or paste your website's address first." }
                  guard let normalized = Self.normalize(t) else {
                      return "That doesn't look like a website address. It should look like mymovies.com or http://192.168.1.20:8080"
                  }
                  let host = normalized.0.host?.lowercased() ?? ""
                  for svc in Rules.load().externalServices ?? [] {
                      if let p = svc.hostPattern, host.range(of: p, options: [.regularExpression, .caseInsensitive]) != nil {
                          return "That's a \(svc.name) link. Enter the address of YOUR website, the one that lists your movies and has the \(svc.name) links on it."
                      }
                  }
                  return nil
              }

              /// Adds a site (or rescans it if it's already added).
              func addSite(_ raw: String) {
                  if let issue = problem(with: raw) {
                      scanState = .failed(issue)
                      return
                  }
                  guard let normalized = Self.normalize(raw) else { return }
                  startScan([normalized.0], allowHTTPFallback: !normalized.1)
              }

              func rescan(_ site: Site) { startScan([site.url], allowHTTPFallback: false) }

              func rescanAll() {
                  guard !sites.isEmpty else { return }
                  startScan(sites.map(\.url), allowHTTPFallback: false)
              }

              func waitForScan() async { await scanTask?.value }

              /// Called whenever the app comes to the front: quietly refreshes the library if it's
              /// more than 6 hours old, so new movies just show up.
              func autoRefreshIfStale() {
                  removalFailuresThisSession = 0
                  pumpRemovals()
                  guard !isScanning, !sites.isEmpty else { return }
                  let oldest = sites.map { $0.lastScanned ?? .distantPast }.min() ?? .distantPast
                  guard Date().timeIntervalSince(oldest) > 6 * 3600 else { return }
                  DiagLog.shared.log("scan", "Library is more than 6 hours old; refreshing automatically.")
                  rescanAll()
              }

              func stopScan() { scanTask?.cancel() }

              func removeSites(at offsets: IndexSet) {
                  let keys = Set(offsets.map { sites[$0].url.absoluteString })
                  sites.remove(atOffsets: offsets)
                  movies.removeAll { keys.contains($0.source) }
                  save()
              }

              private func startScan(_ urls: [URL], allowHTTPFallback: Bool) {
                  scanTask?.cancel()
                  let scanID = UUID()
                  currentScan = scanID
                  lastScanFound = 0
                  scanState = .scanning(pages: 0, found: 0, status: urls.first?.host ?? "")
                  let pagesLimit = maxPages

                  scanTask = Task {
                      var summaries: [String] = []
                      var total = 0
                      var lastError: String?
                      for original in urls {
                          var url = original
                          var attempt = 0
                          while true {
                              attempt += 1
                              let key = url.absoluteString
                              let scraper = Scraper(root: url, maxPages: pagesLimit, sourceKey: key, rules: Rules.load())
                              do {
                                  let result = try await scraper.run { p in
                                      await MainActor.run {
                                          guard self.currentScan == scanID, self.isScanning else { return }
                                          self.scanState = .scanning(pages: p.pages, found: p.found, status: p.status)
                                          if let snapshot = p.snapshot { self.preview(snapshot, key: key) }
                                      }
                                  }
                                  guard self.currentScan == scanID else { return }
                                  let kept = self.finish(result, siteURL: url, key: key)
                                  total += kept
                                  summaries.append(Self.summary(kept: kept, result: result))
                                  break
                              } catch {
                                  guard self.currentScan == scanID else { return }
                                  if Self.isCancel(error) {
                                      self.scanState = .finished("Scan stopped.")
                                      return
                                  }
                                  if attempt == 1, allowHTTPFallback, url.scheme == "https", Self.isConnectionProblem(error),
                                     var c = URLComponents(url: url, resolvingAgainstBaseURL: false) {
                                      c.scheme = "http"
                                      if let httpURL = c.url {
                                          DiagLog.shared.log("scan", "https didn't work (\(error.localizedDescription)); trying \(httpURL.absoluteString)")
                                          url = httpURL
                                          continue
                                      }
                                  }
                                  DiagLog.shared.log("scan", "Scan of \(url.absoluteString) failed: \(error.localizedDescription)")
                                  lastError = Self.friendly(error)
                                  break
                              }
                          }
                      }
                      guard self.currentScan == scanID else { return }
                      self.lastScanFound = total
                      let haptic = UINotificationFeedbackGenerator()
                      if let lastError, total == 0 {
                          self.scanState = .failed(lastError)
                          haptic.notificationOccurred(.error)
                      } else {
                          self.scanState = .finished(summaries.joined(separator: " "))
                          haptic.notificationOccurred(total > 0 ? .success : .warning)
                      }
                  }
              }

              /// Shows movies as the scan finds them. The final result replaces these when the scan ends.
              private func preview(_ snapshot: [Movie], key: String) {
                  guard !snapshot.isEmpty else { return }
                  let existing = Dictionary(movies.filter { $0.source == key }.map { ($0.id, $0) }, uniquingKeysWith: { a, _ in a })
                  var fresh = snapshot
                  for i in fresh.indices {
                      if let old = existing[fresh[i].id] {
                          fresh[i].addedAt = old.addedAt
                          // Keep a video we already looked up rather than showing the movie as unresolved.
                          if fresh[i].videoURLs.isEmpty { fresh[i].videoURLs = old.videoURLs }
                          if fresh[i].externalLinks.isEmpty { fresh[i].externalLinks = old.externalLinks }
                          if !old.needsLookup && (old.hasVideo || !old.externalLinks.isEmpty) { fresh[i].pendingLinks = [] }
                      }
                  }
                  let ids = Set(fresh.map(\.id))
                  movies.removeAll { $0.source == key && ids.contains($0.id) }
                  movies.append(contentsOf: fresh)
                  movies.sort { $0.title.localizedCaseInsensitiveCompare($1.title) == .orderedAscending }
              }

              /// Updates the library with one site's results. Returns the number of movies kept.
              private func finish(_ r: ScanResult, siteURL: URL, key: String) -> Int {
                  if r.cancelled && r.movies.isEmpty { return 0 }
                  let old = Dictionary(movies.filter { $0.source == key }.map { ($0.id, $0.addedAt) },
                                       uniquingKeysWith: { a, _ in a })
                  let previous = Dictionary(movies.filter { $0.source == key }.map { ($0.id, $0) }, uniquingKeysWith: { a, _ in a })
                  var fresh = r.movies
                  for i in fresh.indices {
                      if let d = old[fresh[i].id] { fresh[i].addedAt = d }
                      // A movie whose video was already looked up keeps it; no need to look again.
                      if let p = previous[fresh[i].id], fresh[i].needsLookup, p.hasVideo || !p.externalLinks.isEmpty, !p.needsLookup {
                          fresh[i].videoURLs = p.videoURLs
                          fresh[i].externalLinks = p.externalLinks
                          fresh[i].pendingLinks = []
                      }
                  }
                  movies.removeAll { $0.source == key }
                  movies.append(contentsOf: fresh)
                  movies.sort { $0.title.localizedCaseInsensitiveCompare($1.title) == .orderedAscending }

                  if let i = sites.firstIndex(where: { $0.url.absoluteString == key }) {
                      sites[i].lastScanned = Date()
                      sites[i].movieCount = fresh.count
                  } else {
                      sites.append(Site(url: siteURL, lastScanned: Date(), movieCount: fresh.count))
                  }
                  save()
                  return fresh.count
              }

              private static func summary(kept: Int, result r: ScanResult) -> String {
                  let pageWord = r.pages == 1 ? "page" : "pages"
                  if kept == 0 {
                      return "No movies found on \(r.pages) \(pageWord). If your site builds its pages with JavaScript (Jellyfin, Plex and similar apps do), there's nothing for CineScout to read. Send Claude a report from Settings → Help & Fixes."
                  }
                  let lead = r.cancelled ? "Stopped early, kept" : "Found"
                  let failed = r.errors > 0 ? " \(r.errors) page\(r.errors == 1 ? "" : "s") wouldn't load." : ""
                  return "\(lead) \(kept) movie\(kept == 1 ? "" : "s") on \(r.pages) \(pageWord).\(failed)"
              }

              var statusText: String {
                  switch scanState {
                  case .idle: return "none this session"
                  case .scanning(let p, let f, let s): return "in progress (\(p) pages, \(f) found, at \(s))"
                  case .finished(let m): return m
                  case .failed(let m): return "failed: \(m)"
                  }
              }

              // MARK: Errors in plain English

              static func isCancel(_ error: Error) -> Bool {
                  error is CancellationError || (error as? URLError)?.code == .cancelled
              }

              static func isConnectionProblem(_ error: Error) -> Bool {
                  guard let u = error as? URLError else { return false }
                  let codes: [URLError.Code] = [.secureConnectionFailed, .serverCertificateUntrusted, .serverCertificateHasBadDate,
                          .serverCertificateNotYetValid, .serverCertificateHasUnknownRoot, .cannotConnectToHost,
                          .timedOut, .networkConnectionLost]
                  return codes.contains(u.code)
              }

              static func friendly(_ error: Error) -> String {
                  if let s = error as? ScrapeError {
                      switch s {
                      case .http(let code) where code == 401 || code == 403:
                          return "The site asked for a login or blocked CineScout (error \(code)). CineScout can only read pages that open without logging in."
                      case .http(404):
                          return "There's nothing at that address (error 404). Open your site in Safari, copy the address from the top bar, and paste it here."
                      case .http(let code) where code >= 500:
                          return "Your site had a problem on its end (error \(code)). Make sure it's running, then try again."
                      case .http(let code):
                          return "The site answered with error \(code)."
                      case .notHTML:
                          return "That address is a file, not a web page. Use the address of the page that lists your movies."
                      }
                  }
                  if let u = error as? URLError {
                      switch u.code {
                      case .notConnectedToInternet:
                          return "Your iPhone isn't online. If your site runs on your home network, also check Settings → Privacy & Security → Local Network → CineScout is turned on."
                      case .cannotFindHost, .dnsLookupFailed:
                          return "Couldn't find that website. Check the spelling of the address."
                      case .timedOut:
                          return "The site took too long to answer. Make sure it's running and try again."
                      case .cannotConnectToHost, .networkConnectionLost:
                          return "Couldn't connect to the site. Make sure it's running. If it's on your home network, your iPhone must be on the same Wi-Fi."
                      case .secureConnectionFailed, .serverCertificateUntrusted, .serverCertificateHasBadDate,
                           .serverCertificateNotYetValid, .serverCertificateHasUnknownRoot:
                          return "The secure connection to the site failed. Try typing the address with http:// at the start."
                      default:
                          return u.localizedDescription
                      }
                  }
                  return error.localizedDescription
              }

              // MARK: Storage

              private func load() {
                  if let data = try? Data(contentsOf: fileURL),
                     let saved = try? JSONDecoder().decode(Saved.self, from: data) {
                      movies = saved.movies
                      sites = saved.sites
                  }
                  if let data = try? Data(contentsOf: progressURL),
                     let p = try? JSONDecoder().decode([String: WatchProgress].self, from: data) {
                      progress = p
                  }
                  cleanServiceLinks()
              }

              private func save() {
                  if let data = try? JSONEncoder().encode(Saved(movies: movies, sites: sites)) {
                      try? data.write(to: fileURL, options: .atomic)
                  }
              }

              /// Returns the URL and whether the person typed http:// or https:// themselves.
              static func normalize(_ raw: String) -> (URL, Bool)? {
                  var s = raw.trimmingCharacters(in: .whitespacesAndNewlines)
                  guard !s.isEmpty, !s.contains(" ") else { return nil }
                  let lower = s.lowercased()
                  let typed = lower.hasPrefix("http://") || lower.hasPrefix("https://")
                  if !typed { s = "https://" + s }
                  guard let u = URL(string: s), let host = u.host, host.contains(".") || host == "localhost" else { return nil }
                  return (u, typed)
              }
          }
