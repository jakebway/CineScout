                  let extra = (r.extraVideoExtensions ?? [])
                      .map { $0.lowercased().trimmingCharacters(in: CharacterSet(charactersIn: ". ")) }
                      .filter { !$0.isEmpty }
                  let exts = Scraper.baseVideoExts.union(extra)
                  self.videoExts = exts
                  self.playLabelRE = Scraper.regex(r.playLabelPattern, name: "playLabelPattern")
                  self.genericLabelRE = Scraper.regex(r.genericLabelPattern, name: "genericLabelPattern")
                  self.labelStripRE = Scraper.regex(r.labelStripPattern, name: "labelStripPattern")
                  self.playHrefRE = Scraper.regex(r.playHrefPattern, name: "playHrefPattern")
                  self.playClassRE = Scraper.regex(r.playClassPattern, name: "playClassPattern")
                  self.skipRE = Scraper.regex(r.skipHrefPattern, name: "skipHrefPattern")
                  self.chainLabelRE = Scraper.regex(r.chainLabelPattern, name: "chainLabelPattern")
                  self.excludeRE = Scraper.regex(r.excludeVideoPattern, name: "excludeVideoPattern")
                  self.maxHops = max(1, min(r.maxPlayHops ?? 5, 10))
                  let alt = exts.sorted().map { NSRegularExpression.escapedPattern(for: $0) }.joined(separator: "|")
                  self.scriptAbsRE = Scraper.regex(#"(?i)(?:https?:)?//[^\s"'<>()\[\]{}]+?\.(?:"# + alt + #")(?:\?[^\s"'<>()\[\]{}]*)?(?![A-Za-z0-9])"#, name: "script video")
                  self.services = (r.externalServices ?? []).map {
                      ServiceMatcher(service: $0, name: $0.name,
                                     host: Scraper.regex($0.hostPattern, name: "\($0.name) hostPattern"),
                                     label: Scraper.regex($0.labelPattern, name: "\($0.name) labelPattern"),
                                     accept: Scraper.regex($0.acceptPattern, name: "\($0.name) acceptPattern"),
                                     search: Scraper.regex($0.searchPattern, name: "\($0.name) searchPattern"))
                  }
                  self.scriptRelRE = Scraper.regex(#"(?i)["'](/[^"'\s<>]+?\.(?:"# + alt + #")(?:\?[^"'\s<>]*)?)["']"#, name: "script video")
              }

              // MARK: Crawl loop

              func run(progress: @escaping @Sendable (ScanProgress) async -> Void) async throws -> ScanResult {
                  let started = Date()
                  log.log("scan", "Start \(root.absoluteString) · up to \(maxPages) pages · staying under \(pathPrefix)")
                  enqueue(root, depth: 0)
                  let rootError = await crawl(progress: progress)
                  if !queue.isEmpty && pages >= maxPages {
                      log.log("scan", "Hit the \(maxPages)-page limit with \(queue.count) pages still queued. Raise the limit in Settings if movies are missing.")
                  }

                  if pages == 0 && fileCandidates.isEmpty, let rootError {
                      log.log("scan", "Couldn't load the start page: \(rootError.localizedDescription)")
                      throw rootError
                  }

                  await progress(ScanProgress(pages: pages, found: foundCount, status: "Reading metadata files…"))
                  let movies = await finalize()
                  writeSamples()
                  let secs = String(format: "%.1f", Date().timeIntervalSince(started))
                  let waiting = movies.filter(\.needsLookup).count
                  log.log("scan", "Done in \(secs)s · \(pages) pages · \(movies.count) movies (\(waiting) will have their video looked up when you browse) · \(errors) failed requests\(cancelled ? " · stopped early" : "")")
                  return ScanResult(movies: movies, pages: pages, errors: errors, cancelled: cancelled)
              }

              /// Opens one movie's play links and returns the movie with the video(s) found behind them.
              func resolve(_ movie: Movie) async -> Movie {
                  chainOnly = true
                  var start = movie
                  let links = start.pendingLinks
                  start.pendingLinks = []
                  pageEntries[start.id] = PageEntry(movie: start, strong: true)
                  for l in links { followPlay(l, parent: start.id, depth: 0, hops: 1) }
                  _ = await crawl(progress: nil)
                  var list = [pageEntries[start.id]?.movie ?? start]
                  await resolveServiceRedirects(&list)
                  var result = list[0]
                  result.pendingLinks = []
                  if result.videoURLs.isEmpty && result.externalLinks.isEmpty {
                      log.log("video", "Looked behind \(links.count) play link(s) for “\(movie.title)” but found no video.")
                  } else {
                      log.log("video", "Found \(result.videoURLs.count) video(s) and \(result.externalLinks.count) outside link(s) for “\(movie.title)”.")
                  }
                  return result
              }

              /// Fetches queued pages ten at a time until the queue is empty or the page limit is hit.
              /// Returns the start page's error, if it failed.
              private func crawl(progress: (@Sendable (ScanProgress) async -> Void)?) async -> Error? {
                  var rootError: Error?
                  var isFirst = !chainOnly

                  while !queue.isEmpty && pages < maxPages {
                      if Task.isCancelled { cancelled = true; break }
                      let take = min(10, queue.count, max(1, maxPages - pages))
                      let batch = Array(queue.prefix(take))
                      queue.removeFirst(take)
                      if let progress {
                          var p = ScanProgress(pages: pages, found: foundCount, status: Self.shortName(batch[0].0))
                          if Date().timeIntervalSince(lastSnapshot) > 2 {
                              lastSnapshot = Date()
                              p.snapshot = quickSnapshot()
                          }
                          await progress(p)
                      }

                      let fetched = await withTaskGroup(of: (Int, Fetched).self) { group -> [(Int, Fetched)] in
                          for (i, item) in batch.enumerated() {
                              let url = item.0
                              group.addTask {
                                  let r = await Scraper.fetch(url)
                                  return (i, r)
                              }
                          }
                          var out: [(Int, Fetched)] = []
                          for await r in group { out.append(r) }
                          return out.sorted { $0.0 < $1.0 }
                      }

                      for (i, result) in fetched {
                          let (url, depth) = batch[i]
                          let hint = hints[Self.key(url)]
                          switch result {
                          case .html(let html, let finalURL):
                              if isFirst {
                                  if let h = finalURL.host?.lowercased(), !hosts.contains(h) {
                                      hosts.insert(h)
                                      log.log("scan", "Start page redirected to \(finalURL.absoluteString)")
                                  }
                                  keepSample("root", finalURL, html)
                              }
                              if isServiceSite(finalURL) {
                                  if let pid = hint?.parentID, let l = externalLink(finalURL, label: nil) {
                                      attachExternal([l], to: pid)
                                      log.debug("page", "\(url.absoluteString) led to \(l.url.absoluteString)")
                                  } else {
                                      log.debug("page", "Refused \(finalURL.absoluteString): not a share link")
                                  }
                                  break
                              }
                              pages += 1
                              process(html: html, url: finalURL, depth: depth, hint: hint)
                          case .video:
                              foundVideo(url, hint: hint)
                          case .other(let mime):
                              if mime.contains("octet-stream") && hint?.parentID != nil {
                                  foundVideo(url, hint: hint)
                              } else {
                                  if isFirst { rootError = ScrapeError.notHTML }
                                  log.debug("fetch", "Skipped \(url.absoluteString) (\(mime.isEmpty ? "no type" : mime))")
                              }
                          case .failed(let e):
                              if isFirst { rootError = e }
                              if !(e is CancellationError) && (e as? URLError)?.code != .cancelled {
                                  errors += 1
                                  log.log("fetch", "Failed \(url.absoluteString): \(e.localizedDescription)")
                              }
                          }
                          isFirst = false
                      }
                  }
                  if Task.isCancelled { cancelled = true }
                  return rootError
              }

              /// A cheap look at what's been found so far (no .nfo reading or redirect checks).
              private func quickSnapshot() -> [Movie] {
                  var out: [Movie] = []
                  var claimed = Set<String>()
                  for k in pageOrder {
                      guard let e = pageEntries[k] else { continue }
                      let m = e.movie
                      guard m.hasVideo || !m.externalLinks.isEmpty || m.needsLookup || e.strong else { continue }
                      for v in m.videoURLs { claimed.insert(v.absoluteString) }
                      out.append(m)
                  }
                  for k in fileOrder where !claimed.contains(k) {
                      if let c = fileCandidates[k] { out.append(makeFileMovie(c).0) }
                  }
                  return out
              }

              private func enqueue(_ url: URL, depth: Int, hint: LinkHint? = nil, front: Bool = false) {
                  let key = Self.key(url)
                  if let hint { hints[key] = Self.merge(hints[key], hint) }
                  guard depth <= 10, !seen.contains(key) else { return }
                  seen.insert(key)
                  if front { queue.insert((url, depth), at: 0) } else { queue.append((url, depth)) }
              }

              private static func merge(_ a: LinkHint?, _ b: LinkHint) -> LinkHint {
                  guard var a else { return b }
                  if a.title == nil { a.title = b.title }
                  if a.poster == nil { a.poster = b.poster }
                  if a.parentID == nil {
                      a.parentID = b.parentID
                      a.embedHop = b.embedHop
                      a.hops = b.hops
                  }
                  return a
              }

              /// Follow a link/embed that should lead to `parent`'s video.
              private func followPlay(_ url: URL, parent: String, depth: Int, hops: Int) {
                  switch serviceMatch(url, label: nil) {
                  case .accepted(let l):
                      attachExternal([l], to: parent)
                      return
                  case .rejected(let name):
                      log.debug("page", "Refused to follow a \(name) link that isn't a share link: \(url.absoluteString)")
                      return
                  default:
                      break
                  }
                  if isVideo(url) {
                      if !isExtra(url) { attach([url], to: parent) }
                      return
                  }
                  enqueue(url, depth: depth + 1, hint: LinkHint(parentID: parent, embedHop: !isSameSite(url), hops: hops), front: true)
              }

              /// During a normal scan, play links are only noted (opened later, when you browse).
              private func deferOrFollow(_ url: URL, parent: String, depth: Int) {
                  if isVideo(url) || !lazyPlayLinks {
                      followPlay(url, parent: parent, depth: depth, hops: 1)
                      return
                  }
                  guard var e = pageEntries[parent] else { return }
                  if !e.movie.pendingLinks.contains(url) { e.movie.pendingLinks.append(url) }
                  pageEntries[parent] = e
              }

              private func foundVideo(_ url: URL, hint: LinkHint?) {
                  if isExtra(url, label: hint?.title) { return }
                  if let pid = hint?.parentID, attach([url], to: pid) { return }
                  addFileCandidate(video: url, listing: url.deletingLastPathComponent(), label: hint?.title, poster: hint?.poster)
              }

              @discardableResult
              private func attach(_ videos: [URL], to id: String) -> Bool {
                  guard var e = pageEntries[id] else { return false }
                  var added = 0
                  for v in videos where !e.movie.videoURLs.contains(v) {
                      e.movie.videoURLs.append(v)
                      added += 1
                  }
                  pageEntries[id] = e
                  if added > 0 { log.debug("video", "+\(added) video(s) for “\(e.movie.title)”") }
                  return true
              }

              private func addFileCandidate(video: URL, listing: URL, label: String?, poster: URL?) {
                  let k = video.absoluteString
                  if var existing = fileCandidates[k] {
                      if existing.label == nil { existing.label = label }
                      if existing.poster == nil { existing.poster = poster }
                      fileCandidates[k] = existing
                      return
                  }
                  fileCandidates[k] = FileCandidate(video: video, listing: listing, label: label, poster: poster)
                  fileOrder.append(k)
                  videosPerListing[Self.key(listing), default: 0] += 1
              }

              // MARK: Outside services (FebBox…)

              /// Is this a FebBox (or other service) link, and is it the accepted kind?
              private func serviceMatch(_ url: URL, label: String?) -> ServiceMatch {
                  let unwrapped = Self.unwrapRedirect(url)
                  for svc in services {
                      for candidate in [unwrapped, url] {
                          if let h = candidate.host?.lowercased(), Self.matches(svc.host, h) {
                              let c = svc.service.canonical(candidate)
                              return svc.accepts(c) ? .accepted(ExternalLink(service: svc.name, url: c, label: label)) : .rejected(svc.name)
                          }
                      }
                      if let label, Self.matches(svc.label, label) { return .follow }
                  }
                  return .none
              }

              /// Only accepted service addresses (e.g. febbox.com/share/…).
              private func externalLink(_ url: URL, label: String?) -> ExternalLink? {
                  if case .accepted(let l) = serviceMatch(url, label: label) { return l }
                  return nil
              }

              private func isServiceSite(_ url: URL) -> Bool {
                  guard let h = url.host?.lowercased() else { return false }
                  return services.contains { Self.matches($0.host, h) }
              }

              /// Accepted service addresses written anywhere in the page (scripts, data, text).
              private func serviceLinksInText(_ html: String) -> [ExternalLink] {
                  var out: [ExternalLink] = []
                  var texts = [html.replacingOccurrences(of: "\\/", with: "/")]
                  if let decoded = html.removingPercentEncoding, decoded != html { texts.append(decoded) }
                  for svc in services {
                      guard let re = svc.search else { continue }
                      for text in texts {
                          let ns = text as NSString
                          for m in re.matches(in: text, range: NSRange(location: 0, length: ns.length)) {
                              guard let u = URL(string: ns.substring(with: m.range)) else { continue }
                              let c = svc.service.canonical(u)
                              if svc.accepts(c), !out.contains(where: { $0.url == c }) {
                                  out.append(ExternalLink(service: svc.name, url: c, label: nil))
                              }
                          }
                      }
                  }
                  return out
              }

              /// Links like "/go/123" labelled "Open in FebBox": follow the redirect once to get the
              /// real FebBox address, then put it in its standard form.
              private func resolveServiceRedirects(_ pageMovies: inout [Movie]) async {
                  var pending = Set<URL>()
                  for m in pageMovies { for l in m.externalLinks where !isServiceHost(l) { pending.insert(l.url) } }
                  for c in externalCandidates.values where !isServiceHost(c.link) { pending.insert(c.link.url) }
                  guard !pending.isEmpty, !Task.isCancelled else { return }
                  let resolved = await withTaskGroup(of: (URL, URL?).self) { group -> [URL: URL] in
                      for u in pending { group.addTask { (u, await Scraper.finalURL(u)) } }
                      var out: [URL: URL] = [:]
                      for await (from, to) in group { if let to { out[from] = to } }
                      return out
                  }
                  func fix(_ l: ExternalLink) -> ExternalLink {
                      guard let to = resolved[l.url], let svc = services.first(where: { $0.name == l.service }),
                            let h = to.host?.lowercased(), Self.matches(svc.host, h) else { return l }
                      var fixed = l
                      fixed.url = svc.service.canonical(to)
                      log.debug("page", "\(l.url.absoluteString) leads to \(fixed.url.absoluteString)")
                      return fixed
                  }
                  for i in pageMovies.indices { pageMovies[i].externalLinks = pageMovies[i].externalLinks.map(fix) }
                  for (k, c) in externalCandidates { externalCandidates[k] = ExternalCandidate(link: fix(c.link), title: c.title, poster: c.poster) }
              }

              private func isServiceHost(_ l: ExternalLink) -> Bool {
                  guard let svc = services.first(where: { $0.name == l.service }), let h = l.url.host?.lowercased() else { return true }
                  return Self.matches(svc.host, h)
              }

              /// Where a link ends up after redirects, without downloading the page.
              static func finalURL(_ url: URL) async -> URL? {
                  var req = URLRequest(url: url, timeoutInterval: 15)
                  req.setValue(userAgent, forHTTPHeaderField: "User-Agent")
                  guard let result = try? await URLSession.shared.bytes(for: req) else { return nil }
                  result.0.task.cancel()
                  return result.1.url
              }

              private func labelNamesService(_ label: String?) -> Bool {
                  guard let label else { return false }
                  return services.contains { Self.matches($0.label, label) }
              }

              /// "/out?url=https://www.febbox.com/share/abc" → the febbox address.
              static func unwrapRedirect(_ url: URL) -> URL {
                  guard let items = URLComponents(url: url, resolvingAgainstBaseURL: false)?.queryItems else { return url }
                  for item in items {
                      if let v = item.value, v.lowercased().hasPrefix("http"), let u = URL(string: v), u.host != nil { return u }
                  }
                  return url
              }

              private func attachExternal(_ links: [ExternalLink], to id: String) {
                  guard var e = pageEntries[id], !links.isEmpty else { return }
                  for l in links where !e.movie.externalLinks.contains(where: { $0.url == l.url }) {
                      e.movie.externalLinks.append(l)
                  }
                  pageEntries[id] = e
              }

              private func addExternalCandidate(_ link: ExternalLink, title: String?, poster: URL?) {
                  let k = link.url.absoluteString
                  if var existing = externalCandidates[k] {
                      if existing.title == nil { existing.title = title }
                      if existing.poster == nil { existing.poster = poster }
                      externalCandidates[k] = existing
                      return
                  }
                  externalCandidates[k] = ExternalCandidate(link: link, title: title, poster: poster)
                  externalOrder.append(k)
              }

              // MARK: Trailers, samples, extras

              /// True for videos that aren't the movie itself (trailer, sample, featurette…).
              private func isExtra(_ url: URL, label: String? = nil) -> Bool {
                  let path = url.path.removingPercentEncoding ?? url.path
                  if Self.matches(excludeRE, path) || Self.matches(excludeRE, label ?? "") {
                      log.debug("video", "Skipped extra: \(url.lastPathComponent)\(label.map { " (“\($0)”)" } ?? "")")
                      return true
                  }
                  return false
              }

              // MARK: Multi-step paths to a video

              /// Every way a page can send you on toward the video without a normal link:
              /// auto-redirects, JavaScript jumps, button targets and simple forms.
              private func jumpTargets(doc: Document, pageURL: URL) -> (redirects: [URL], jumps: [URL]) {
                  var redirects: [URL] = []
                  var jumps: [URL] = []
                  func add(_ raw: String?, to list: inout [URL]) {
                      guard let raw, let u = Self.makeURL(Self.decodeEntities(raw), relativeTo: pageURL),
                            Self.key(u) != Self.key(pageURL), !list.contains(u) else { return }
                      list.append(u)
                  }

                  // <meta http-equiv="refresh" content="5; url=/watch/123">
                  for m in Self.select(doc, "meta[http-equiv]") {
                      guard ((try? m.attr("http-equiv")) ?? "").lowercased() == "refresh",
                            let content = try? m.attr("content"),
                            let r = content.range(of: #"(?i)url\s*=\s*['"]?"#, options: .regularExpression) else { continue }
                      let rest = content[r.upperBound...].trimmingCharacters(in: CharacterSet(charactersIn: "'\" "))
                      add(rest, to: &redirects)
                  }

                  // location.href = "…", location.replace("…"), window.open("…") in scripts and onclick
                  var codeBits: [String] = Self.select(doc, "script").map { $0.data() }
                  for el in Self.select(doc, "[onclick]") { codeBits.append((try? el.attr("onclick")) ?? "") }
                  let jsPatterns = [
                      #"(?:window\.|document\.|top\.|self\.)?location(?:\.href)?\s*=\s*["'`]([^"'`]+)["'`]"#,
                      #"location\.(?:replace|assign)\(\s*["'`]([^"'`]+)["'`]"#,
                      #"window\.open\(\s*["'`]([^"'`]+)["'`]"#,
                  ]
                  for code in codeBits where code.count > 8 {
                      let text = code.replacingOccurrences(of: "\\/", with: "/")
                      let ns = text as NSString
                      for p in jsPatterns {
                          guard let re = try? NSRegularExpression(pattern: p) else { continue }
                          for m in re.matches(in: text, range: NSRange(location: 0, length: ns.length)) {
                              add(ns.substring(with: m.range(at: 1)), to: &jumps)
                          }
                      }
                  }

                  // Buttons and cards that carry their target in an attribute
                  let attrs = ["data-href", "data-link", "data-redirect", "data-go", "data-target-url", "data-url", "formaction"]
                  for el in Self.select(doc, attrs.map { "[\($0)]" }.joined(separator: ", ")) {
                      for attr in attrs where el.hasAttr(attr) { add(try? el.attr(attr), to: &jumps) }
                  }

                  // Simple "Continue" forms that use GET (POST forms are never submitted)
                  for form in Self.select(doc, "form") {
                      let method = ((try? form.attr("method")) ?? "get").lowercased()
                      guard method.isEmpty || method == "get" else { continue }
                      let action = (try? form.attr("action")).flatMap { $0.isEmpty ? nil : $0 } ?? pageURL.absoluteString
                      guard let base = Self.makeURL(action, relativeTo: pageURL),
                            var comps = URLComponents(url: base, resolvingAgainstBaseURL: true) else { continue }
                      let buttonText = Self.select(form, "button, input[type=submit]")
                          .map { ((try? $0.text()) ?? "") + " " + ((try? $0.attr("value")) ?? "") }
                          .joined(separator: " ")
                      guard Self.matches(chainLabelRE, buttonText.trimmingCharacters(in: .whitespaces))
                              || Self.matches(playLabelRE, buttonText.trimmingCharacters(in: .whitespaces)) else { continue }
                      var items = comps.queryItems ?? []
                      for input in Self.select(form, "input[name]") {
                          let type = ((try? input.attr("type")) ?? "").lowercased()
                          guard ["hidden", "submit", ""].contains(type), let name = try? input.attr("name"), !name.isEmpty else { continue }
                          items.append(URLQueryItem(name: name, value: (try? input.attr("value")) ?? ""))
                      }
                      comps.queryItems = items.isEmpty ? nil : items
                      if let u = comps.url, !jumps.contains(u) { jumps.append(u) }
                  }

                  let goodRedirects = redirects.filter { isVideo($0) || isPlayTarget($0) || externalLink($0, label: nil) != nil }
                  let goodJumps = jumps.filter { isVideo($0) || isPlayTarget($0) || externalLink($0, label: nil) != nil }
                  return (goodRedirects, goodJumps)
              }

              // MARK: Link classification

              private func isVideo(_ u: URL) -> Bool { videoExts.contains(u.pathExtension.lowercased()) }

              private func isSkipped(_ u: URL) -> Bool { Self.matches(skipRE, u.absoluteString) }

              private func isSameSite(_ u: URL) -> Bool {
                  guard let h = u.host?.lowercased() else { return false }
                  if hosts.contains(h) { return true }
                  return (rules.allowedHosts ?? []).contains { a in
                      let a = a.lowercased()
                      return h == a || h.hasSuffix("." + a)
                  }
              }

              /// Same site, or another host on the same domain (cdn.example.com for example.com).
              private func isRelatedHost(_ u: URL) -> Bool {
                  guard let h = u.host?.lowercased() else { return false }
                  if isSameSite(u) { return true }
                  let base = Self.baseDomain(h)
                  return hosts.contains { Self.baseDomain($0) == base }
              }

              private func isCrawlable(_ u: URL) -> Bool {
                  guard isSameSite(u) else { return false }
                  let path = u.path
                  if pathPrefix != "/" {
                      let withSlash = pathPrefix.hasSuffix("/") ? pathPrefix : pathPrefix + "/"
                      guard path == pathPrefix || path.hasPrefix(withSlash) else { return false }
                  }
                  let ext = u.pathExtension.lowercased()
                  if Self.skipExts.contains(ext) || isVideo(u) { return false }
                  if isSkipped(u) { return false }
                  if let q = u.query, q.range(of: #"^C=[A-Z];O=[A-Z]$"#, options: .regularExpression) != nil { return false }
                  return true
              }

              /// Play links may leave the start folder (e.g. /watch/123) but stay on your domains.
              private func isPlayTarget(_ u: URL) -> Bool {
                  let ext = u.pathExtension.lowercased()
                  return isRelatedHost(u) && !isSkipped(u) && !Self.skipExts.contains(ext)
              }

              private func isPlayLink(_ a: Element, url: URL, label: String?, rulePlay: Set<ObjectIdentifier>) -> Bool {
                  var el: Element? = a
                  for _ in 0..<3 {
                      guard let e = el else { break }
                      if rulePlay.contains(ObjectIdentifier(e)) { return true }
                      el = e.parent()
                  }
                  if let label, Self.matches(playLabelRE, label) { return true }
                  if Self.matches(playHrefRE, url.absoluteString) { return true }
                  let cls = ((try? a.className()) ?? "") + " " + a.id()
                  return Self.matches(playClassRE, cls)
              }

              /// A link label that could be a movie name, or nil for "Play", "Download", "1080p"…
              private func usableLabel(_ raw: String?) -> String? {
                  guard var t = raw else { return nil }
                  if t.contains("..>") || (t.hasSuffix("…") && t.count > 40) { return nil }
                  if let re = labelStripRE {
                      t = re.stringByReplacingMatches(in: t, range: NSRange(t.startIndex..., in: t), withTemplate: "")
                  }
                  t = t.trimmingCharacters(in: .whitespacesAndNewlines)
                  guard t.count >= 2, t.count <= 150 else { return nil }
                  if Self.matches(genericLabelRE, t) { return nil }
                  return t
              }

              /// For a link with no useful label (a "Watch" button, a bare poster), find the
              /// title and poster of the card it sits in.
              private func cardContext(_ a: Element, base: URL) -> (title: String?, poster: URL?) {
                  var title: String?
                  var poster: URL?
                  var el: Element = a
                  for _ in 0..<5 {
                      guard let p = el.parent() else { break }
                      if Self.select(p, "a[href]").count > 8 { break }
                      if poster == nil {
                          for img in Self.select(p, "img") {
                              if let u = Self.imageURL(img, base: base) { poster = u; break }
                          }
                      }
                      if title == nil {
                          for h in Self.select(p, "h1, h2, h3, h4, h5, [class*=title], [class*=name], [itemprop=name]") {
                              if let t = usableLabel(try? h.text()) { title = t; break }
                          }
                          if title == nil {
                              for img in Self.select(p, "img[alt]") {
                                  if let t = usableLabel(try? img.attr("alt")) { title = t; break }
                              }
                          }
                      }
                      if title != nil && poster != nil { break }
                      el = p
                  }
                  return (title, poster)
              }

              // MARK: Page parsing

              private func process(html: String, url pageURL: URL, depth: Int, hint: LinkHint?) {
                  let doc: Document
                  do {
                      doc = try SwiftSoup.parse(html, pageURL.absoluteString)
                  } catch {
                      errors += 1
                      log.log("parse", "Couldn't read the HTML of \(pageURL.absoluteString): \(error)")
                      return
                  }

                  let pageKey = Self.key(pageURL)
                  let short = Self.shortName(pageURL)
                  let titleText = ((try? doc.title()) ?? "").trimmingCharacters(in: .whitespacesAndNewlines)
                  let lowerTitle = titleText.lowercased()
                  let isListing = lowerTitle.hasPrefix("index of") || lowerTitle.hasPrefix("directory listing")
                  let crawlFurther = !(hint?.embedHop ?? false)

                  var rulePlay = Set<ObjectIdentifier>()
                  for sel in rules.playLinkSelectors ?? [] {
                      for el in Self.select(doc, sel) { rulePlay.insert(ObjectIdentifier(el)) }
                  }

                  // Links
                  var videoLinks: [LinkInfo] = []
                  var pageLinks: [LinkInfo] = []
                  var externals: [ExternalInfo] = []
                  var assets = dirAssets[pageKey] ?? [:]
                  for a in Self.select(doc, "a[href]") {
                      guard let u = Self.link(a, "href", base: pageURL) else { continue }
                      let ext = u.pathExtension.lowercased()
                      if Self.imageExts.contains(ext) || ext == "nfo" {
                          assets[u.lastPathComponent.lowercased()] = u
                          continue
                      }
                      let raw = Self.linkLabel(a)
                      var forcePlay = false
                      switch serviceMatch(u, label: raw) {
                      case .accepted(let ext):
                          if !externals.contains(where: { $0.link.url == ext.url }) {
                              let shownLabel = labelNamesService(raw) ? nil : usableLabel(raw)
                              externals.append(ExternalInfo(link: ExternalLink(service: ext.service, url: ext.url, label: shownLabel), element: a))
                          }
                          continue
                      case .rejected(let name):
                          log.debug("page", "Ignored a \(name) link that isn't a share link: \(u.absoluteString)")
                          continue
                      case .follow:
                          forcePlay = true
                      case .none:
                          break
                      }
                      let info = LinkInfo(url: u, label: usableLabel(raw), poster: Self.imageIn(a, base: pageURL),
                                          isPlay: forcePlay || isPlayLink(a, url: u, label: raw, rulePlay: rulePlay), element: a)
                      if isVideo(u) {
                          if !isExtra(u, label: raw) && !videoLinks.contains(where: { $0.url == u }) { videoLinks.append(info) }
                      } else if Self.key(u) != pageKey {
                          pageLinks.append(info)
                      }
                  }
                  dirAssets[pageKey] = assets

                  // Meta tags + structured data
                  var meta: [String: String] = [:]
                  for m in Self.select(doc, "meta") {
                      let names = ["property", "name", "itemprop"].compactMap { try? m.attr($0) }.filter { !$0.isEmpty }
                      guard let k = names.first?.lowercased(),
                            let c = try? m.attr("content"), !c.isEmpty,
                            meta[k] == nil else { continue }
                      meta[k] = c
                  }
                  let ld = Self.findLD(doc)

                  // Videos embedded in this page
                  var embedded: [URL] = []
                  func addVideo(_ u: URL?) {
                      if let u, !embedded.contains(u), !isExtra(u) { embedded.append(u) }
                  }
                  for v in Self.select(doc, "video[src], video source[src]") { addVideo(Self.link(v, "src", base: pageURL)) }
                  let metaVideos: [String?] = [meta["og:video:secure_url"], meta["og:video:url"], meta["og:video"],
                                               Self.str(ld?["contentUrl"]), Self.str(ld?["embedUrl"])]
                  for s in metaVideos {
                      if let s, let u = Self.makeURL(s, relativeTo: pageURL), isVideo(u) { addVideo(u) }
                  }
                  let dataAttrs = ["data-src", "data-video", "data-url", "data-file", "data-stream", "data-hls", "data-mp4"]
                  for el in Self.select(doc, dataAttrs.map { "[\($0)]" }.joined(separator: ", ")) {
                      for attr in dataAttrs {
                          if let u = Self.link(el, attr, base: pageURL), isVideo(u) { addVideo(u) }
                      }
                  }
                  for sel in rules.videoSelectors ?? [] {
                      for el in Self.select(doc, sel) {
                          for attr in ["src", "href", "content", "value"] + dataAttrs {
                              if let u = Self.link(el, attr, base: pageURL) { addVideo(u); break }
                          }
                      }
                  }
                  if rules.scanScripts ?? true {
                      for s in Self.select(doc, "script") {
                          let body = s.data()
                          if body.count > 10 { for u in scriptVideos(in: body, base: pageURL) { addVideo(u) } }
                      }
                  }

                  // Player iframes
                  var iframes: [URL] = []
                  if rules.followIframes ?? true {
                      for f in Self.select(doc, "iframe[src], iframe[data-src], embed[src]") {
                          guard let u = Self.link(f, "src", base: pageURL) ?? Self.link(f, "data-src", base: pageURL) else { continue }
                          if isVideo(u) {
                              addVideo(u)
                          } else if let ext = externalLink(u, label: nil) {
                              if !externals.contains(where: { $0.link.url == ext.url }) { externals.append(ExternalInfo(link: ext, element: nil)) }
                          } else if isRelatedHost(u) && !isSkipped(u) {
                              if !iframes.contains(u) { iframes.append(u) }
                          } else {
                              log.debug("embed", "Not opening player on another site (\(u.host ?? "?")) from \(short)")
                          }
                      }
                  }

                  // Custom script from rules
                  var js: JSResult?
                  if let script = rules.script, !script.isEmpty { js = runScript(script, html: html, url: pageURL) }
                  if let js {
                      for v in js.videos { addVideo(v) }
                      for l in js.links where isCrawlable(l) { enqueue(l, depth: depth + 1) }
                  }
                  let jsPlay = (js?.playLinks ?? []).filter { isPlayTarget($0) }
                  let onChain = hint?.parentID != nil
                  let playLinks = pageLinks.filter { l in
                      guard isPlayTarget(l.url) else { return false }
                      if l.isPlay || l.element.hasAttr("download") { return true }
                      let text = Self.linkLabel(l.element) ?? ""
                      return onChain && Self.matches(chainLabelRE, text)
                  }
                  let (redirects, jumps) = jumpTargets(doc: doc, pageURL: pageURL)

                  // 1) A page reached from a movie's play button or player embed:
                  //    whatever video is here belongs to that movie.
                  if let pid = hint?.parentID, pageEntries[pid] != nil {
                      var found = embedded
                      for v in videoLinks where v.isPlay || videoLinks.count <= 3 {
                          if !found.contains(v.url) { found.append(v.url) }
                      }
                      attach(found, to: pid)
                      attachExternal(externals.map(\.link) + serviceLinksInText(html), to: pid)
                      let hops = (hint?.hops ?? 0) + 1
                      if hops <= maxHops {
                          for u in redirects + jumps { followPlay(u, parent: pid, depth: depth, hops: hops) }
                          for f in iframes { followPlay(f, parent: pid, depth: depth, hops: hops) }
                          for p in playLinks { followPlay(p.url, parent: pid, depth: depth, hops: hops) }
                          for u in jsPlay { followPlay(u, parent: pid, depth: depth, hops: hops) }
                      } else {
                          log.log("page", "Stopped after \(maxHops) steps looking for the video of “\(pageEntries[pid]?.movie.title ?? pid)”. Raise maxPlayHops in Scanner rules if your site needs more.")
                      }
                      let title = pageEntries[pid]?.movie.title ?? pid
                      if found.isEmpty && externals.isEmpty && pageEntries[pid]?.movie.externalLinks.isEmpty != false && iframes.isEmpty && playLinks.isEmpty && jsPlay.isEmpty && redirects.isEmpty && jumps.isEmpty {
                          keepSample("play-page-no-video", pageURL, html)
                          log.log("page", "Opened a play link for “\(title)” but found no video on it: \(pageURL.absoluteString)")
                      } else {
                          keepSample("play-page", pageURL, html)
                          log.debug("page", "\(short) → player for “\(title)”: \(found.count) video(s), \(iframes.count) embed(s), \(playLinks.count + jsPlay.count + redirects.count + jumps.count) more step(s) to follow")
                      }
                      if crawlFurther && !chainOnly { enqueueOrdinary(pageLinks.filter { !$0.isPlay }, depth: depth, base: pageURL) }
                      return
                  }
                  if chainOnly { return }

                  // 2) Is this page itself a movie?
                  let ogType = meta["og:type"]?.lowercased() ?? ""
                  let strong = ld != nil || ogType.hasPrefix("video") || js?.isMovie == true
                  let targets = embedded.count + iframes.count + playLinks.count + jsPlay.count + videoLinks.count + externals.count + redirects.count + jumps.count
                  let hasTitleSignal = meta["og:title"] != nil || !Self.select(doc, "h1").isEmpty
                  let isMovie: Bool
                  if js?.isMovie == false || isListing { isMovie = false }
                  else if strong { isMovie = true }
                  else if (1...4).contains(embedded.count) { isMovie = true }
                  else if hint?.title != nil && (1...4).contains(targets) { isMovie = true }
                  else if videoLinks.count == 1 && meta["og:image"] != nil { isMovie = true }
                  else if externals.count == 1 && hasTitleSignal && playLinks.isEmpty && videoLinks.count <= 1 { isMovie = true }
                  else { isMovie = false }

                  if isMovie {
                      var videos = embedded
                      var consumed = Set<URL>()
                      for v in videoLinks where v.isPlay || videoLinks.count <= 3 {
                          if !videos.contains(v.url) { videos.append(v.url) }
                          consumed.insert(v.url)
                      }
                      let movie = buildPageMovie(doc: doc, pageURL: pageURL, pageKey: pageKey, titleText: titleText,
                                                 meta: meta, ld: ld, js: js, hint: hint, videos: videos)
                      var withLinks = movie
                      withLinks.externalLinks = externals.map(\.link)
                      for l in serviceLinksInText(html) where !withLinks.externalLinks.contains(where: { $0.url == l.url }) {
                          withLinks.externalLinks.append(l)
                      }
                      pageEntries[pageKey] = PageEntry(movie: withLinks, strong: strong)
                      pageOrder.append(pageKey)
                      for u in redirects + jumps + iframes + playLinks.map(\.url) + jsPlay {
                          deferOrFollow(u, parent: pageKey, depth: depth)
                      }
                      for v in videoLinks where !consumed.contains(v.url) {
                          addFileCandidate(video: v.url, listing: pageURL, label: v.label, poster: v.poster)
                      }
                      keepSample("movie-page", pageURL, html)
                      let why = strong ? "page data" : (hint?.title != nil ? "link label" : "player")
                      log.debug("page", "\(short) → movie “\(movie.title)” (from \(why)): \(videos.count) video(s), \(externals.count) outside link(s), following \(iframes.count + playLinks.count + jsPlay.count + redirects.count + jumps.count) step(s) toward the video")
                  } else {
                      // 3) A listing or catalog: label each video/play link with its card's title.
                      if isListing { keepSample("listing", pageURL, html) }
                      for v in videoLinks {
                          var label = v.label
                          var poster = v.poster
                          if !isListing && (label == nil || poster == nil) {
                              let ctx = cardContext(v.element, base: pageURL)
                              label = label ?? ctx.title
                              poster = poster ?? ctx.poster
                          }
                          addFileCandidate(video: v.url, listing: pageURL, label: label, poster: poster)
                      }
                      for p in playLinks {
                          var label = p.label
                          var poster = p.poster
                          if label == nil || poster == nil {
                              let ctx = cardContext(p.element, base: pageURL)
                              label = label ?? ctx.title
                              poster = poster ?? ctx.poster
                          }
                          enqueue(p.url, depth: depth + 1, hint: LinkHint(title: label, poster: poster))
                      }
                      for u in jsPlay { enqueue(u, depth: depth + 1) }
                      for u in redirects where isCrawlable(u) { enqueue(u, depth: depth + 1, hint: hint) }
                      for e in externals {
                          var title = e.link.label
                          var poster: URL?
                          if let el = e.element {
                              let ctx = cardContext(el, base: pageURL)
                              title = title ?? ctx.title
                              poster = ctx.poster
                          }
                          addExternalCandidate(e.link, title: title, poster: poster)
                      }
                      if !playLinks.isEmpty || !externals.isEmpty { keepSample("catalog", pageURL, html) }
                      log.debug("page", "\(short) → \(isListing ? "folder listing" : "index page"): \(videoLinks.count) video link(s), \(playLinks.count) play link(s), \(externals.count) outside link(s), \(pageLinks.count) other link(s)")
                  }

                  if crawlFurther { enqueueOrdinary(pageLinks.filter { !$0.isPlay }, depth: depth, base: pageURL) }
              }

              private func enqueueOrdinary(_ links: [LinkInfo], depth: Int, base: URL) {
                  let useContext = links.count <= 400
                  for l in links where isCrawlable(l.url) {
                      var title = l.label
                      let poster = l.poster
                      if useContext && poster != nil && title == nil { title = cardContext(l.element, base: base).title }
                      let hint: LinkHint? = (title == nil && poster == nil) ? nil : LinkHint(title: title, poster: poster)
                      enqueue(l.url, depth: depth + 1, hint: hint)
                  }
              }

              private func buildPageMovie(doc: Document, pageURL: URL, pageKey: String, titleText: String,
                                          meta: [String: String], ld: [String: Any]?, js: JSResult?,
                                          hint: LinkHint?, videos: [URL]) -> Movie {
                  var ruleTitle: String?
                  for sel in rules.titleSelectors ?? [] {
                      if let t = Self.select(doc, sel).first.flatMap({ try? $0.text() }),
                         !t.trimmingCharacters(in: .whitespacesAndNewlines).isEmpty {
                          ruleTitle = t
                          break
                      }
                  }
                  var rulePoster: URL?
                  for sel in rules.posterSelectors ?? [] {
                      if let el = Self.select(doc, sel).first,
                         let u = Self.imageURL(el, base: pageURL) ?? Self.link(el, "content", base: pageURL) ?? Self.link(el, "href", base: pageURL) {
                          rulePoster = u
                          break
                      }
                  }

                  let hinted = hint?.title.map { Self.cleanTitle(stem: $0, dotsAreSpaces: false) }
                  let candidates: [String?] = [js?.title, ruleTitle, Self.str(ld?["name"]), meta["og:title"], meta["twitter:title"],
                                               hinted?.0, try? doc.select("h1").first()?.text(), Self.trimSiteSuffix(titleText)]
                  var title = candidates
                      .compactMap { $0?.trimmingCharacters(in: .whitespacesAndNewlines) }
                      .first { !$0.isEmpty }
                      ?? videos.first.map { Self.cleanTitle(stem: ($0.lastPathComponent as NSString).deletingPathExtension).0 }
                      ?? "Untitled"

                  var year: String? = js?.year
                  if year == nil {
                      for k in ["datePublished", "dateCreated", "releaseDate", "startDate"] {
                          if let d = Self.str(ld?[k]), d.count >= 4, Int(d.prefix(4)) != nil { year = String(d.prefix(4)); break }
                      }
                  }
                  if year == nil, let d = meta["video:release_date"] ?? meta["og:video:release_date"], Int(d.prefix(4)) != nil {
                      year = String(d.prefix(4))
                  }
                  if year == nil { year = hinted?.1 }
                  if let r = title.range(of: #"\s*[\(\[](19|20)\d{2}[\)\]]\s*$"#, options: .regularExpression) {
                      if year == nil { year = title[r].filter { $0.isNumber } }
                      title.removeSubrange(r)
                  }

                  let overview = js?.overview ?? Self.str(ld?["description"]) ?? meta["og:description"] ?? meta["description"] ?? meta["twitter:description"]

                  let videoPoster = Self.select(doc, "video[poster]").first.flatMap { Self.link($0, "poster", base: pageURL) }
                  let posterString = Self.imageString(ld?["image"]) ?? Self.imageString(ld?["thumbnailUrl"])
                      ?? meta["og:image:secure_url"] ?? meta["og:image"] ?? meta["twitter:image"]
                  let poster = js?.poster ?? rulePoster ?? posterString.flatMap { Self.makeURL($0, relativeTo: pageURL) } ?? hint?.poster ?? videoPoster

                  var details: [Movie.Detail] = []
                  func add(_ label: String, _ value: String?) {
                      if let v = value?.trimmingCharacters(in: .whitespacesAndNewlines), !v.isEmpty {
                          details.append(Movie.Detail(label: label, value: v))
                      }
                  }
                  add("Genre", Self.strs(ld?["genre"]).joined(separator: ", "))
                  add("Runtime", Self.formatDuration(ld?["duration"])
                      ?? meta["video:duration"].flatMap { Int($0) }.map { Self.formatMinutes($0 / 60) })
                  add("Director", Self.strs(ld?["director"]).joined(separator: ", "))
                  add("Cast", Self.strs(ld?["actor"] ?? ld?["actors"]).prefix(8).joined(separator: ", "))
                  add("Rated", Self.str(ld?["contentRating"]))
                  if let agg = ld?["aggregateRating"] as? [String: Any], let v = Self.str(agg["ratingValue"]) {
                      add("Rating", Self.str(agg["bestRating"]).map { "\(v) / \($0)" } ?? v)
                  }

                  return Movie(id: pageKey, title: title, year: year, overview: overview, posterURL: poster,
                               videoURLs: videos, pageURL: pageURL, source: sourceKey, details: details)
              }

              private func scriptVideos(in body: String, base: URL) -> [URL] {
                  let text = body.replacingOccurrences(of: "\\/", with: "/")
                  let ns = text as NSString
                  let range = NSRange(location: 0, length: ns.length)
                  var out: [URL] = []
                  if let re = scriptAbsRE {
                      for m in re.matches(in: text, range: range) {
                          if let u = Self.makeURL(ns.substring(with: m.range), relativeTo: base) { out.append(u) }
                      }
                  }
                  // atob("aHR0cHM6Ly9…") — addresses hidden as base64
                  if let re = try? NSRegularExpression(pattern: #"atob\(\s*["'`]([A-Za-z0-9+/=_-]{16,})["'`]\s*\)"#) {
                      for m in re.matches(in: text, range: range) {
                          var b64 = ns.substring(with: m.range(at: 1)).replacingOccurrences(of: "-", with: "+").replacingOccurrences(of: "_", with: "/")
                          while b64.count % 4 != 0 { b64 += "=" }
                          if let data = Data(base64Encoded: b64), let decoded = String(data: data, encoding: .utf8),
                             let u = Self.makeURL(decoded.trimmingCharacters(in: .whitespacesAndNewlines), relativeTo: base), isVideo(u) {
                              out.append(u)
                          }
                      }
                  }
                  if let re = scriptRelRE {
                      for m in re.matches(in: text, range: range) {
                          if let u = Self.makeURL(ns.substring(with: m.range(at: 1)), relativeTo: base) { out.append(u) }
                      }
                  }
                  return out
              }

              private func runScript(_ script: String, html: String, url: URL) -> JSResult? {
                  if jsContext == nil {
                      guard let ctx = JSContext() else { return nil }
                      ctx.exceptionHandler = { _, exc in
                          DiagLog.shared.log("js", "Script error: \(exc?.toString() ?? "unknown")")
                      }
                      let logFn: @convention(block) (String) -> Void = { DiagLog.shared.log("js", $0) }
                      ctx.setObject(unsafeBitCast(logFn, to: AnyObject.self), forKeyedSubscript: "log" as NSString)
                      ctx.evaluateScript(script)
                      jsContext = ctx
                  }
                  guard let ctx = jsContext,
                        let fn = ctx.objectForKeyedSubscript("extract"), !fn.isUndefined,
                        let out = fn.call(withArguments: [html, url.absoluteString]),
                        out.isObject,
                        let d = out.toDictionary() else { return nil }

                  func text(_ k: String) -> String? {
                      if let s = d[k] as? String { return s.isEmpty ? nil : s }
                      return (d[k] as? NSNumber)?.stringValue
                  }
                  func urls(_ k: String) -> [URL] {
                      ((d[k] as? [Any]) ?? []).compactMap { ($0 as? String).flatMap { Self.makeURL($0, relativeTo: url) } }
                  }
                  var r = JSResult()
                  r.title = text("title")
                  r.year = text("year")
                  r.overview = text("overview")
                  r.poster = text("poster").flatMap { Self.makeURL($0, relativeTo: url) }
                  r.videos = urls("videos")
                  r.playLinks = urls("playLinks")
                  r.links = urls("links")
                  r.isMovie = d["isMovie"] as? Bool
                  return r
              }

              // MARK: Assemble library

              private func finalize() async -> [Movie] {
                  var pageMovies: [Movie] = []
                  var dropped = 0
                  for k in pageOrder {
                      guard let e = pageEntries[k] else { continue }
                      if e.movie.videoURLs.isEmpty && e.movie.externalLinks.isEmpty && !e.movie.needsLookup && !e.strong {
                          dropped += 1
                          log.debug("page", "Left out “\(e.movie.title)”: no video found behind it (\(k))")
                          continue
                      }
                      if e.movie.videoURLs.isEmpty && e.movie.externalLinks.isEmpty && !e.movie.needsLookup {
                          log.log("page", "“\(e.movie.title)” has no video I could reach; it opens the web page instead (\(k))")
                      }
                      pageMovies.append(e.movie)
                  }
                  if dropped > 0 {
                      log.log("scan", "\(dropped) possible movie page(s) had no video behind them. Turn on the detailed log to see which.")
                  }

                  var claimed = Set<String>()
                  var claimedExternal = Set<String>()
                  for pm in pageMovies {
                      for v in pm.videoURLs { claimed.insert(v.absoluteString) }
                      for l in pm.externalLinks { claimedExternal.insert(l.url.absoluteString) }
                  }

                  var fileMovies: [Movie] = []
                  var nfoJobs: [(Int, URL)] = []
                  for k in fileOrder where !claimed.contains(k) {
                      guard let c = fileCandidates[k] else { continue }
                      let (movie, nfo) = makeFileMovie(c)
                      if let nfo { nfoJobs.append((fileMovies.count, nfo)) }
                      fileMovies.append(movie)
                  }

                  if !nfoJobs.isEmpty && !Task.isCancelled {
                      let jobs = nfoJobs
                      let parsed = await withTaskGroup(of: (Int, NFO?).self) { group -> [(Int, NFO?)] in
                          var iterator = jobs.makeIterator()
                          var active = 0
                          while active < 6, let job = iterator.next() {
                              group.addTask { (job.0, await Scraper.fetchNFO(job.1)) }
                              active += 1
                          }
                          var results: [(Int, NFO?)] = []
                          while let r = await group.next() {
                              results.append(r)
                              if let job = iterator.next() {
                                  group.addTask { (job.0, await Scraper.fetchNFO(job.1)) }
                              }
                          }
                          return results
                      }
                      for (i, nfo) in parsed {
                          if let nfo { Self.apply(nfo, to: &fileMovies[i]) }
                      }
                  }

                  await resolveServiceRedirects(&pageMovies)

                  var externalMovies: [Movie] = []
                  for k in externalOrder where !claimedExternal.contains(k) {
                      guard let c = externalCandidates[k] else { continue }
                      var title = "\(c.link.service) link"
                      var year: String?
                      if let t = c.title {
                          let cleaned = Self.cleanTitle(stem: t, dotsAreSpaces: false)
                          title = cleaned.0
                          year = cleaned.1
                      } else {
                          log.log("page", "Found a \(c.link.service) link with no movie name near it: \(k)")
                      }
                      externalMovies.append(Movie(id: k, title: title, year: year, overview: nil, posterURL: c.poster,
                                                  videoURLs: [], pageURL: nil, source: sourceKey, details: [],
                                                  externalLinks: [c.link]))
                  }

                  var seenIDs = Set<String>()
                  var seenVideos = Set<String>()
                  var all: [Movie] = []
                  for m in pageMovies + fileMovies + externalMovies {
                      guard !seenIDs.contains(m.id) else { continue }
                      if let v = m.videoURLs.first?.absoluteString {
                          guard !seenVideos.contains(v) else { continue }
                          seenVideos.insert(v)
                      }
                      seenIDs.insert(m.id)
                      all.append(m)
                  }
                  let merged = Self.mergeDuplicates(all)
                  if merged.count < all.count {
                      log.log("scan", "Combined \(all.count - merged.count) duplicate entr\(all.count - merged.count == 1 ? "y" : "ies") for the same movie.")
                  }
                  return merged.sorted { $0.title.localizedCaseInsensitiveCompare($1.title) == .orderedAscending }
              }

              /// One entry per movie: a file, a movie page and a FebBox link for "The Matrix (1999)"
              /// become a single movie with all of them.
              static func mergeDuplicates(_ movies: [Movie]) -> [Movie] {
                  var byTitle: [String: [Int]] = [:]
                  var out: [Movie] = []
                  for m in movies {
                      let key = normalizedTitle(m.title)
                      if !key.isEmpty, let i = byTitle[key]?.first(where: { m.year == nil || out[$0].year == nil || out[$0].year == m.year }) {
                          var a = out[i]
                          for v in m.videoURLs where !a.videoURLs.contains(v) { a.videoURLs.append(v) }
                          for l in m.externalLinks where !a.externalLinks.contains(where: { $0.url == l.url }) { a.externalLinks.append(l) }
                          a.year = a.year ?? m.year
                          a.posterURL = a.posterURL ?? m.posterURL
                          a.overview = a.overview ?? m.overview
                          a.pageURL = a.pageURL ?? m.pageURL
                          if m.details.count > a.details.count { a.details = m.details }
                          out[i] = a
                      } else {
                          byTitle[key, default: []].append(out.count)
                          out.append(m)
                      }
                  }
                  return out
              }

              static func normalizedTitle(_ t: String) -> String {
                  var s = t.lowercased()
                  if s.hasPrefix("the ") { s.removeFirst(4) }
                  return String(s.unicodeScalars.filter { CharacterSet.alphanumerics.contains($0) })
              }

              private func makeFileMovie(_ c: FileCandidate) -> (Movie, URL?) {
                  let filename = c.video.lastPathComponent
                  let stem = (filename as NSString).deletingPathExtension
                  let base = stem.lowercased()
                  let listingKey = Self.key(c.listing)
                  let single = (videosPerListing[listingKey] ?? 0) == 1
                  let assets = dirAssets[listingKey] ?? [:]

                  var (title, year) = Self.cleanTitle(stem: stem)
                  if single {
                      let (folderTitle, folderYear) = Self.cleanTitle(stem: c.listing.lastPathComponent)
                      if folderYear != nil && !folderTitle.isEmpty {
                          title = folderTitle
                          year = folderYear
                      }
                  }
                  // The link's own label ("The Matrix (1999)") beats the filename.
                  if let label = c.label, Self.isDistinctLabel(label, filename: filename) {
                      let (lt, ly) = Self.cleanTitle(stem: label, dotsAreSpaces: false)
                      if !lt.isEmpty {
                          title = lt
                          year = ly ?? year
                      }
                  }

                  var posterNames = ["jpg", "jpeg", "png", "webp"].flatMap { [base + "." + $0, base + "-poster." + $0] }
                  if single {
                      posterNames += ["poster.jpg", "poster.png", "folder.jpg", "folder.png", "cover.jpg", "cover.png"]
                  }
                  let poster = posterNames.lazy.compactMap { assets[$0] }.first ?? c.poster
                  let nfo = assets[base + ".nfo"] ?? (single ? assets["movie.nfo"] : nil)

                  let movie = Movie(id: c.video.absoluteString, title: title, year: year, overview: nil,
                                    posterURL: poster, videoURLs: [c.video], pageURL: nil, source: sourceKey,
                                    details: [Movie.Detail(label: "File", value: filename)])
                  return (movie, nfo)
              }

              // MARK: Samples for the diagnostic report

              private func keepSample(_ kind: String, _ url: URL, _ html: String) {
                  guard samples[kind] == nil else { return }
                  samples[kind] = (url, html)
              }

              private func writeSamples() {
                  let fm = FileManager.default
                  let dir = fm.urls(for: .documentDirectory, in: .userDomainMask)[0].appendingPathComponent("samples", isDirectory: true)
                  try? fm.removeItem(at: dir)
                  try? fm.createDirectory(at: dir, withIntermediateDirectories: true)
                  for (kind, sample) in samples {
                      let (url, html) = sample
                      let body = "<!-- \(url.absoluteString) -->\n" + String(html.prefix(400_000))
                      try? body.write(to: dir.appendingPathComponent("\(kind).html"), atomically: true, encoding: .utf8)
                  }
              }

              // MARK: Networking

              static func fetch(_ url: URL) async -> Fetched {
                  var req = URLRequest(url: url, timeoutInterval: 12)
                  req.setValue(userAgent, forHTTPHeaderField: "User-Agent")
                  req.setValue("text/html,application/xhtml+xml,*/*;q=0.8", forHTTPHeaderField: "Accept")
                  do {
                      let (bytes, response) = try await URLSession.shared.bytes(for: req)
                      guard let http = response as? HTTPURLResponse else { bytes.task.cancel(); return .other("") }
                      guard (200..<400).contains(http.statusCode) else {
                          bytes.task.cancel()
                          return .failed(ScrapeError.http(http.statusCode))
                      }
                      let mime = (http.mimeType ?? "").lowercased()
                      let disposition = (http.value(forHTTPHeaderField: "Content-Disposition") ?? "").lowercased()
                      let namedVideo = disposition.range(of: #"filename\*?=[^;]*\.(mp4|m4v|mov|mkv|webm|avi|wmv|ts|m2ts|mpg|mpeg)"#,
                                                         options: .regularExpression) != nil
                      if mime.hasPrefix("video/") || mime.contains("mpegurl") || namedVideo
                          || (mime.contains("octet-stream") && http.expectedContentLength > 50_000_000) {
                          bytes.task.cancel()
                          return .video
                      }
                      guard mime.isEmpty || mime.contains("html") || mime.contains("xml") || mime.hasPrefix("text/") else {
                          bytes.task.cancel()
                          return .other(mime)
                      }
                      var data = Data()
                      for try await b in bytes {
                          data.append(b)
                          if data.count > 5_000_000 { bytes.task.cancel(); break }
                      }
                      let text = String(data: data, encoding: .utf8) ?? String(decoding: data, as: UTF8.self)
                      return .html(text, http.url ?? url)
                  } catch {
                      return .failed(error)
                  }
              }

              static func fetchNFO(_ url: URL) async -> NFO? {
                  var req = URLRequest(url: url, timeoutInterval: 15)
                  req.setValue(userAgent, forHTTPHeaderField: "User-Agent")
                  guard let result = try? await URLSession.shared.data(for: req) else { return nil }
                  let (data, response) = result
                  guard ((response as? HTTPURLResponse)?.statusCode ?? 0) < 400, data.count < 2_000_000 else { return nil }
                  let text = String(data: data, encoding: .utf8) ?? String(decoding: data, as: UTF8.self)
                  return parseNFO(text, base: url)
              }

              // MARK: NFO (Kodi-style metadata files)

              static func parseNFO(_ xml: String, base: URL) -> NFO? {
                  let lower = xml.lowercased()
                  guard lower.contains("<movie") || lower.contains("<episodedetails") || lower.contains("<musicvideo") else { return nil }
                  var n = NFO()
                  n.title = tagValues("title", in: xml).first
                  n.year = tagValues("year", in: xml).first ?? tagValues("premiered", in: xml).first.map { String($0.prefix(4)) }
                  n.plot = tagValues("plot", in: xml).first ?? tagValues("outline", in: xml).first
                  n.tagline = tagValues("tagline", in: xml).first
                  n.runtime = tagValues("runtime", in: xml).first
                  n.mpaa = tagValues("mpaa", in: xml).first
                  n.genres = tagValues("genre", in: xml)
                  n.directors = tagValues("director", in: xml)
                  n.actors = tagValues("actor", in: xml).compactMap { tagValues("name", in: $0).first }
                  n.rating = tagValues("rating", in: xml).first
                  if let r = n.rating, r.contains("<") { n.rating = tagValues("value", in: r).first }
                  if let t = tagValues("thumb", in: xml).first { n.thumb = makeURL(t, relativeTo: base) }
                  return n
              }

              static func apply(_ n: NFO, to m: inout Movie) {
                  if let t = n.title, !t.isEmpty { m.title = t }
                  if let y = n.year, y.count == 4 { m.year = y }
                  if let p = n.plot, !p.isEmpty { m.overview = p }
                  if m.posterURL == nil { m.posterURL = n.thumb }
                  var extra: [Movie.Detail] = []
                  if let t = n.tagline { extra.append(Movie.Detail(label: "Tagline", value: t)) }
                  if !n.genres.isEmpty { extra.append(Movie.Detail(label: "Genre", value: n.genres.joined(separator: ", "))) }
                  if let r = n.runtime, let mins = Int(r), mins > 0 { extra.append(Movie.Detail(label: "Runtime", value: formatMinutes(mins))) }
                  if !n.directors.isEmpty { extra.append(Movie.Detail(label: "Director", value: n.directors.joined(separator: ", "))) }
                  if !n.actors.isEmpty { extra.append(Movie.Detail(label: "Cast", value: n.actors.prefix(8).joined(separator: ", "))) }
                  if let r = n.rating { extra.append(Movie.Detail(label: "Rating", value: r)) }
                  if let r = n.mpaa { extra.append(Movie.Detail(label: "Rated", value: r)) }
                  m.details = extra + m.details
              }

              static func tagValues(_ name: String, in xml: String) -> [String] {
                  guard let re = try? NSRegularExpression(pattern: "<\(name)(?:\\s[^>]*)?>(.*?)</\(name)>",
                                                          options: [.dotMatchesLineSeparators, .caseInsensitive]) else { return [] }
                  let ns = xml as NSString
                  return re.matches(in: xml, range: NSRange(location: 0, length: ns.length)).compactMap { m in
                      let raw = ns.substring(with: m.range(at: 1)).trimmingCharacters(in: .whitespacesAndNewlines)
                      let value = decodeEntities(raw).trimmingCharacters(in: .whitespacesAndNewlines)
                      return value.isEmpty ? nil : value
                  }
              }

              static func decodeEntities(_ s: String) -> String {
                  var out = s
                  if out.hasPrefix("<![CDATA["), out.hasSuffix("]]>") { out = String(out.dropFirst(9).dropLast(3)) }
                  for (k, v) in [("&lt;", "<"), ("&gt;", ">"), ("&quot;", "\""), ("&#39;", "'"), ("&apos;", "'"), ("&amp;", "&")] {
                      out = out.replacingOccurrences(of: k, with: v)
                  }
                  return out
              }

              // MARK: JSON-LD

              static func findLD(_ doc: Document) -> [String: Any]? {
                  for s in select(doc, "script") {
                      guard ((try? s.attr("type")) ?? "").lowercased().contains("ld+json") else { continue }
                      guard let d = s.data().data(using: .utf8),
                            let obj = try? JSONSerialization.jsonObject(with: d, options: [.fragmentsAllowed]) else { continue }
                      if let hit = searchLD(obj) { return hit }
                  }
                  return nil
              }

              static func searchLD(_ obj: Any) -> [String: Any]? {
                  if let arr = obj as? [Any] {
                      for o in arr { if let h = searchLD(o) { return h } }
                      return nil
                  }
                  guard let dict = obj as? [String: Any] else { return nil }
                  let types = strs(dict["@type"]).map { $0.lowercased() }
                  if types.contains(where: { ldTypes.contains($0) }) { return dict }
                  for k in ["@graph", "mainEntity"] {
                      if let v = dict[k], let h = searchLD(v) { return h }
                  }
                  return nil
              }

              static func str(_ v: Any?) -> String? {
                  switch v {
                  case let s as String:
                      let t = s.trimmingCharacters(in: .whitespacesAndNewlines)
                      return t.isEmpty ? nil : t
                  case let n as NSNumber: return n.stringValue
                  case let d as [String: Any]: return str(d["name"]) ?? str(d["url"]) ?? str(d["@value"])
                  case let a as [Any]: return a.lazy.compactMap { str($0) }.first
                  default: return nil
                  }
              }

              static func strs(_ v: Any?) -> [String] {
                  if let a = v as? [Any] { return a.compactMap { str($0) } }
                  return str(v).map { [$0] } ?? []
              }

              static func imageString(_ v: Any?) -> String? {
                  if let d = v as? [String: Any] { return str(d["url"]) ?? str(d["contentUrl"]) }
                  if let a = v as? [Any] { return a.lazy.compactMap { imageString($0) }.first }
                  return str(v)
              }

              static func formatDuration(_ v: Any?) -> String? {
                  guard let s = str(v) else { return nil }
                  if let mins = Int(s) { return formatMinutes(mins) }
                  let ns = s as NSString
                  guard let re = try? NSRegularExpression(pattern: #"PT(?:(\d+)H)?(?:(\d+)M)?"#),
                        let m = re.firstMatch(in: s, range: NSRange(location: 0, length: ns.length)) else { return nil }
                  let h = m.range(at: 1).location != NSNotFound ? Int(ns.substring(with: m.range(at: 1))) ?? 0 : 0
                  let mm = m.range(at: 2).location != NSNotFound ? Int(ns.substring(with: m.range(at: 2))) ?? 0 : 0
                  let total = h * 60 + mm
                  return total > 0 ? formatMinutes(total) : nil
              }

              static func formatMinutes(_ mins: Int) -> String {
                  mins >= 60 ? "\(mins / 60)h \(mins % 60)m" : "\(mins)m"
              }

              // MARK: Helpers

              static func regex(_ p: String?, name: String) -> NSRegularExpression? {
                  guard let p, !p.isEmpty else { return nil }
                  do {
                      return try NSRegularExpression(pattern: p)
                  } catch {
                      DiagLog.shared.log("rules", "\(name) isn't a valid pattern and is being ignored: \(error.localizedDescription)")
                      return nil
                  }
              }

              static func matches(_ re: NSRegularExpression?, _ s: String) -> Bool {
                  guard let re else { return false }
                  return re.firstMatch(in: s, range: NSRange(s.startIndex..., in: s)) != nil
              }

              static func select(_ el: Element, _ query: String) -> [Element] {
                  do {
                      return try el.select(query).array()
                  } catch {
                      DiagLog.shared.log("rules", "Bad CSS selector “\(query)”: \(error)")
                      return []
                  }
              }

              static func linkLabel(_ a: Element) -> String? {
                  var t = (try? a.text()) ?? ""
                  if t.trimmingCharacters(in: .whitespacesAndNewlines).isEmpty { t = (try? a.attr("aria-label")) ?? "" }
                  if t.trimmingCharacters(in: .whitespacesAndNewlines).isEmpty { t = (try? a.attr("title")) ?? "" }
                  if t.trimmingCharacters(in: .whitespacesAndNewlines).isEmpty, let img = select(a, "img[alt]").first {
                      t = (try? img.attr("alt")) ?? ""
                  }
                  let c = t.replacingOccurrences(of: #"\s+"#, with: " ", options: .regularExpression)
                      .trimmingCharacters(in: .whitespacesAndNewlines)
                  return c.isEmpty ? nil : c
              }

              static func imageIn(_ a: Element, base: URL) -> URL? {
                  for img in select(a, "img") {
                      if let u = imageURL(img, base: base) { return u }
                  }
                  return nil
              }

              static func imageURL(_ img: Element, base: URL) -> URL? {
                  func ok(_ u: URL?) -> URL? {
                      guard let u else { return nil }
                      let ext = u.pathExtension.lowercased()
                      if ["gif", "svg", "ico"].contains(ext) || u.path.lowercased().contains("/icons/") { return nil }
                      return u
                  }
                  for attr in ["data-src", "data-lazy-src", "data-original", "src"] {
                      if let u = ok(link(img, attr, base: base)) { return u }
                  }
                  if let set = try? img.attr("srcset"),
                     let first = set.split(separator: ",").first?.split(separator: " ").first {
                      return ok(makeURL(String(first), relativeTo: base))
                  }
                  return nil
              }

              static func isDistinctLabel(_ label: String, filename: String) -> Bool {
                  let l = label.lowercased().trimmingCharacters(in: .whitespacesAndNewlines)
                  let f = filename.lowercased()
                  let stem = (f as NSString).deletingPathExtension
                  let spaced = stem.replacingOccurrences(of: #"[._]+"#, with: " ", options: .regularExpression)
                  return ![f, stem, spaced, f.removingPercentEncoding ?? f].contains(l)
              }

              static func cleanTitle(stem raw: String, dotsAreSpaces: Bool = true) -> (String, String?) {
                  var name = raw.removingPercentEncoding ?? raw
                  name = name.replacingOccurrences(of: dotsAreSpaces ? #"[._]+"# : #"_+"#, with: " ", options: .regularExpression)
                  var year: String?
                  if let r = name.range(of: #"[\(\[](19|20)\d{2}[\)\]]"#, options: .regularExpression), r.lowerBound > name.startIndex {
                      year = name[r].filter { $0.isNumber }
                      name = String(name[..<r.lowerBound])
                  } else if let re = try? NSRegularExpression(pattern: #"\b(19|20)\d{2}\b"#) {
                      let ns = name as NSString
                      if let m = re.matches(in: name, range: NSRange(location: 0, length: ns.length)).last, m.range.location > 0 {
                          year = ns.substring(with: m.range)
                          name = ns.substring(to: m.range.location)
                      }
                  }
                  let junk = #"(?i)\b(2160p|1080p|720p|576p|480p|4k|uhd|bluray|blu-ray|brrip|bdrip|webrip|web-dl|webdl|hdrip|dvdrip|hdtv|x264|x265|h264|h265|hevc|10bit|hdr|remux|proper|repack|dts|aac|ac3)\b"#
                  if let r = name.range(of: junk, options: .regularExpression) {
                      name = String(name[..<r.lowerBound])
                  }
                  name = name.replacingOccurrences(of: #"\s+"#, with: " ", options: .regularExpression)
                      .trimmingCharacters(in: CharacterSet(charactersIn: " -–—|:[](){}"))
                  return (name.isEmpty ? raw : name, year)
              }

              static func trimSiteSuffix(_ t: String) -> String {
                  for sep in [" | ", " – ", " — ", " - ", " · ", " :: "] {
                      if let r = t.range(of: sep) {
                          let head = String(t[..<r.lowerBound]).trimmingCharacters(in: .whitespaces)
                          if head.count >= 2 { return head }
                      }
                  }
                  return t
              }

              static func link(_ el: Element, _ attr: String, base: URL) -> URL? {
                  guard el.hasAttr(attr) else { return nil }
                  if let abs = try? el.absUrl(attr), !abs.isEmpty, let u = makeURL(abs) { return u }
                  if let raw = try? el.attr(attr), !raw.isEmpty { return makeURL(raw, relativeTo: base) }
                  return nil
              }

              static func makeURL(_ s: String, relativeTo base: URL? = nil) -> URL? {
                  let t = s.trimmingCharacters(in: .whitespacesAndNewlines)
                  guard !t.isEmpty else { return nil }
                  var url = URL(string: t, relativeTo: base)?.absoluteURL
                  if url == nil {
                      let allowed = CharacterSet.urlQueryAllowed.union(.urlPathAllowed).union(CharacterSet(charactersIn: "#%"))
                      if let enc = t.addingPercentEncoding(withAllowedCharacters: allowed) {
                          url = URL(string: enc, relativeTo: base)?.absoluteURL
                      }
                  }
                  guard let u = url, let scheme = u.scheme?.lowercased(), scheme == "http" || scheme == "https" else { return nil }
                  return u
              }

              static func key(_ url: URL) -> String {
                  var c = URLComponents(url: url, resolvingAgainstBaseURL: true)
                  c?.fragment = nil
                  var s = c?.string ?? url.absoluteString
                  if s.hasSuffix("/") && s.count > 1 { s.removeLast() }
                  return s
              }

              static func baseDomain(_ h: String) -> String {
                  if h.allSatisfy({ $0.isNumber || $0 == "." || $0 == ":" }) { return h }
                  return h.split(separator: ".").suffix(2).joined(separator: ".")
              }

              static func directoryPath(of url: URL) -> String {
                  var path = url.path
                  if path.isEmpty { return "/" }
                  if !url.pathExtension.isEmpty { path = (path as NSString).deletingLastPathComponent }
                  return path.isEmpty ? "/" : path
              }

              static func shortName(_ url: URL) -> String {
                  let p = url.path.removingPercentEncoding ?? url.path
                  return p.isEmpty || p == "/" ? (url.host ?? url.absoluteString) : p
              }
          }
