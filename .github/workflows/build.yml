          import Foundation
          import SwiftUI
          import UIKit
          import UniformTypeIdentifiers
          import Darwin

          // MARK: Log file

          /// Append-only log at Documents/cinescout-log.txt. Every line is written straight to
          /// the file, so it survives a crash.
          final class DiagLog: @unchecked Sendable {
              static let shared = DiagLog()

              let fileURL: URL
              private let queue = DispatchQueue(label: "cinescout.log")
              private var handle: FileHandle?
              private let stamp: DateFormatter

              private init() {
                  let docs = FileManager.default.urls(for: .documentDirectory, in: .userDomainMask)[0]
                  fileURL = docs.appendingPathComponent("cinescout-log.txt")
                  stamp = DateFormatter()
                  stamp.locale = Locale(identifier: "en_US_POSIX")
                  stamp.dateFormat = "MM-dd HH:mm:ss.SSS"
                  let fm = FileManager.default
                  if let size = (try? fm.attributesOfItem(atPath: fileURL.path))?[.size] as? Int, size > 3_000_000,
                     let data = try? Data(contentsOf: fileURL) {
                      try? data.suffix(1_500_000).write(to: fileURL)
                  }
                  if !fm.fileExists(atPath: fileURL.path) { fm.createFile(atPath: fileURL.path, contents: nil) }
                  handle = try? FileHandle(forWritingTo: fileURL)
                  _ = try? handle?.seekToEnd()
              }

              var verbose: Bool { UserDefaults.standard.bool(forKey: "verboseLog") }
              var fileDescriptor: Int32 { handle?.fileDescriptor ?? -1 }

              func log(_ category: String, _ message: String) {
                  queue.sync {
                      let line = "\(stamp.string(from: Date())) [\(category)] \(message)\n"
                      try? handle?.write(contentsOf: Data(line.utf8))
                  }
              }

              /// Only written when "Detailed scan log" is on.
              func debug(_ category: String, _ message: @autoclosure () -> String) {
                  if verbose { log(category, message()) }
              }

              func contents() -> String {
                  queue.sync { (try? String(contentsOf: fileURL, encoding: .utf8)) ?? "" }
              }

              func clear() {
                  queue.sync {
                      try? handle?.truncate(atOffset: 0)
                      try? handle?.seek(toOffset: 0)
                  }
                  log("app", "Log cleared.")
              }
          }

          // MARK: Crash capture

          private var crashFD: Int32 = -1
          private let crashNote = strdup("\n*** CRASH: the app was stopped by a fatal error. The lines above show what it was doing. ***\n")

          enum CrashWatch {
              static func install() {
                  crashFD = DiagLog.shared.fileDescriptor
                  NSSetUncaughtExceptionHandler { e in
                      DiagLog.shared.log("crash", "Uncaught exception \(e.name.rawValue): \(e.reason ?? "")\n\(e.callStackSymbols.joined(separator: "\n"))")
                  }
                  for sig in [SIGABRT, SIGSEGV, SIGBUS, SIGILL, SIGTRAP, SIGFPE] {
                      signal(sig) { s in
                          if crashFD >= 0, let note = crashNote { _ = write(crashFD, note, strlen(note)) }
                          signal(s, SIG_DFL)
                          raise(s)
                      }
                  }
              }
          }

          enum AppInfo {
              static var version: String { Bundle.main.infoDictionary?["CFBundleShortVersionString"] as? String ?? "?" }
              static var build: String { Bundle.main.infoDictionary?["CFBundleVersion"] as? String ?? "?" }

              @MainActor static var summary: String {
                  "CineScout \(version) (build \(build)) · VLC engine \(PlaybackSupport.vlc ? "included" : "not included") · iOS \(UIDevice.current.systemVersion) · \(UIDevice.current.model)"
              }
          }

          // MARK: Report

          @MainActor
          enum Report {
              static var samplesDir: URL {
                  FileManager.default.urls(for: .documentDirectory, in: .userDomainMask)[0].appendingPathComponent("samples", isDirectory: true)
              }

              /// One text file with everything Claude needs to diagnose a problem.
              static func build(store: LibraryStore) -> URL {
                  var s = "CINESCOUT DIAGNOSTIC REPORT\n"
                  s += "Generated: \(Date().formatted(date: .abbreviated, time: .standard))\n"
                  s += "\(AppInfo.summary)\n"
                  s += "Library: \(store.movies.count) movies from \(store.sites.count) site(s)\n"
                  for site in store.sites {
                      let when = site.lastScanned?.formatted(date: .abbreviated, time: .shortened) ?? "never"
                      s += "  - \(site.url.absoluteString): \(site.movieCount) movies, scanned \(when)\n"
                  }
                  s += "Last scan: \(store.statusText)\n"
                  s += "Detailed log: \(DiagLog.shared.verbose ? "on" : "off")\n"

                  s += "\n===== rules.json (\(Rules.isCustom ? "custom" : "default")) =====\n"
                  s += Rules.currentText()

                  s += "\n\n===== Library sample (first 40) =====\n"
                  for m in store.movies.prefix(40) {
                      s += "• \(m.title) [\(m.year ?? "-")]\n"
                      s += "    videos: \(m.videoURLs.isEmpty ? "none" : m.videoURLs.map(\.absoluteString).joined(separator: " | "))\n"
                      s += "    poster: \(m.posterURL?.absoluteString ?? "none")  page: \(m.pageURL?.absoluteString ?? "-")\n"
                      if !m.externalLinks.isEmpty {
                          s += "    links: \(m.externalLinks.map { "\($0.service) \($0.url.absoluteString)" }.joined(separator: " | "))\n"
                      }
                  }

                  s += "\n===== Log (oldest first) =====\n"
                  s += String(DiagLog.shared.contents().suffix(400_000))

                  let fm = FileManager.default
                  if let files = try? fm.contentsOfDirectory(at: samplesDir, includingPropertiesForKeys: nil) {
                      for f in files.sorted(by: { $0.lastPathComponent < $1.lastPathComponent }) {
                          guard let html = try? String(contentsOf: f, encoding: .utf8) else { continue }
                          s += "\n\n===== Sample page: \(f.deletingPathExtension().lastPathComponent) =====\n"
                          s += String(html.prefix(150_000))
                      }
                  }

                  let name = "CineScout-report-\(Int(Date().timeIntervalSince1970)).txt"
                  let url = fm.temporaryDirectory.appendingPathComponent(name)
                  if let old = try? fm.contentsOfDirectory(at: fm.temporaryDirectory, includingPropertiesForKeys: nil) {
                      for f in old where f.lastPathComponent.hasPrefix("CineScout-report-") { try? fm.removeItem(at: f) }
                  }
                  try? s.write(to: url, atomically: true, encoding: .utf8)
                  return url
              }
          }

          // MARK: Diagnostics screen

