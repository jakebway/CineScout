          import Foundation
          import SwiftUI
          import UIKit
          import AVFoundation

          /// A video handed over by the in-app browser (e.g. FebBox), to go through
          /// download → compress → play → delete.
          struct PrepareJob: Identifiable {
              let id = UUID()
              let movie: Movie
              let url: URL
              let cookies: [HTTPCookie]
              let headers: [String: String]
              /// FebBox collaborative item to remove once you close the player.
              var febboxNames: [String] = []
          }

          /// Where temporary copies live. Everything in here is deleted after playback,
          /// when you cancel, and again every time the app starts.
          enum WorkFolder {
              static var root: URL {
                  FileManager.default.temporaryDirectory.appendingPathComponent("CineScoutWork", isDirectory: true)
              }

              static func make() -> URL {
                  let dir = root.appendingPathComponent(UUID().uuidString, isDirectory: true)
                  try? FileManager.default.createDirectory(at: dir, withIntermediateDirectories: true)
                  return dir
              }

              static func delete(_ dir: URL, reason: String) {
                  guard FileManager.default.fileExists(atPath: dir.path) else { return }
                  try? FileManager.default.removeItem(at: dir)
                  DiagLog.shared.log("files", "Deleted the temporary copy (\(reason)).")
              }

              /// Run at launch: removes anything left behind by a crash or force-quit.
              static func cleanAll() {
                  let fm = FileManager.default
                  guard let items = try? fm.contentsOfDirectory(at: root, includingPropertiesForKeys: nil), !items.isEmpty else { return }
                  try? fm.removeItem(at: root)
                  DiagLog.shared.log("files", "Removed \(items.count) leftover temporary video folder(s).")
              }

              static var freeSpace: Int64 {
                  let values = try? URL(fileURLWithPath: NSHomeDirectory())
                      .resourceValues(forKeys: [.volumeAvailableCapacityForImportantUsageKey])
                  return values?.volumeAvailableCapacityForImportantUsage ?? 0
              }
          }

          @MainActor
          final class MediaPipeline: ObservableObject {
              enum Stage: Equatable {
                  case starting
                  case downloading(received: Int64, expected: Int64, bytesPerSecond: Double)
                  case compressing(progress: Double)
                  case ready(URL)
                  case streaming
                  case failed(String)
              }

              @Published private(set) var stage: Stage = .starting
              /// Set when a step was skipped, e.g. a file type iPhone can't compress.
              @Published private(set) var note: String?

              let job: PrepareJob
              let folder: URL
              private var downloadTask: URLSessionDownloadTask?
              private var session: URLSession?
              private var export: AVAssetExportSession?
              private var ticker: Timer?
              private var lastBytes: Int64 = 0
              private var lastTick = Date()
              private var speed: Double = 0
              private var backgroundTask: UIBackgroundTaskIdentifier = .invalid
              private var finished = false

              init(job: PrepareJob) {
                  self.job = job
                  self.folder = WorkFolder.make()
              }

              private var keepOriginalResolution: Bool {
                  UserDefaults.standard.string(forKey: "compressQuality") == "original"
              }

              // MARK: Start / cancel

              func start() {
                  guard case .starting = stage else { return }
                  UIApplication.shared.isIdleTimerDisabled = true
                  backgroundTask = UIApplication.shared.beginBackgroundTask(withName: "CineScout video") { [weak self] in
                      Task { @MainActor in self?.endBackgroundTask() }
                  }
                  if job.url.pathExtension.lowercased() == "m3u8" {
                      // A live stream playlist isn't one file; it plays directly and nothing is stored.
                      note = "This video is a stream, so it plays directly. Nothing is saved."
                      DiagLog.shared.log("files", "“\(job.movie.title)” is a stream (m3u8): playing directly, nothing stored.")
                      WorkFolder.delete(folder, reason: "stream needs no copy")
                      stage = .streaming
                      return
                  }
                  download()
              }

              func cancel() {
                  guard !finished else { return }
                  finished = true
                  downloadTask?.cancel()
                  export?.cancelExport()
                  session?.invalidateAndCancel()
                  ticker?.invalidate()
                  WorkFolder.delete(folder, reason: "cancelled")
                  wrapUp()
              }

              func streamInstead() {
                  downloadTask?.cancel()
                  export?.cancelExport()
                  ticker?.invalidate()
                  WorkFolder.delete(folder, reason: "switched to streaming")
                  DiagLog.shared.log("files", "Streaming “\(job.movie.title)” directly instead; nothing stored.")
                  stage = .streaming
              }

              func retry() {
                  downloadTask?.cancel()
                  export?.cancelExport()
                  ticker?.invalidate()
                  try? FileManager.default.createDirectory(at: folder, withIntermediateDirectories: true)
                  note = nil
                  stage = .starting
                  start()
              }

              private func wrapUp() {
                  UIApplication.shared.isIdleTimerDisabled = false
                  endBackgroundTask()
              }

              private func endBackgroundTask() {
                  if backgroundTask != .invalid {
                      UIApplication.shared.endBackgroundTask(backgroundTask)
                      backgroundTask = .invalid
                  }
              }

              // MARK: 1. Download

              private func download() {
                  var req = URLRequest(url: job.url, timeoutInterval: 60)
                  for (k, v) in job.headers { req.setValue(v, forHTTPHeaderField: k) }
                  for (k, v) in HTTPCookie.requestHeaderFields(with: job.cookies) { req.setValue(v, forHTTPHeaderField: k) }
                  let config = URLSessionConfiguration.default
                  config.timeoutIntervalForResource = 12 * 3600
                  config.httpCookieStorage = nil
                  let session = URLSession(configuration: config)
                  self.session = session
                  let dest = folder
                  DiagLog.shared.log("files", "Downloading “\(job.movie.title)”: \(job.url.absoluteString)")

                  let task = session.downloadTask(with: req) { [weak self] tmp, response, error in
                      var result: Result<URL, Error>
                      if let error {
                          result = .failure(error)
                      } else if let tmp, let http = response as? HTTPURLResponse {
                          if (200..<300).contains(http.statusCode) {
                              var ext = ((http.suggestedFilename ?? "") as NSString).pathExtension
                              if ext.isEmpty { ext = response?.url?.pathExtension ?? "" }
                              if ext.isEmpty { ext = "mp4" }
                              let target = dest.appendingPathComponent("download.\(ext.lowercased())")
                              do {
                                  try? FileManager.default.removeItem(at: target)
                                  try FileManager.default.moveItem(at: tmp, to: target)
                                  result = .success(target)
                              } catch {
                                  result = .failure(error)
                              }
                          } else {
                              result = .failure(ScrapeError.http(http.statusCode))
                          }
                      } else {
                          result = .failure(URLError(.badServerResponse))
                      }
                      Task { @MainActor in self?.downloaded(result) }
                  }
                  downloadTask = task
                  stage = .downloading(received: 0, expected: 0, bytesPerSecond: 0)
                  lastBytes = 0
                  lastTick = Date()
                  ticker = Timer.scheduledTimer(withTimeInterval: 0.5, repeats: true) { [weak self] _ in
                      Task { @MainActor in self?.downloadTick() }
                  }
                  task.resume()
              }

              private func downloadTick() {
                  guard let t = downloadTask, case .downloading = stage else { return }
                  let received = t.countOfBytesReceived
                  let expected = t.countOfBytesExpectedToReceive
                  let now = Date()
                  let dt = now.timeIntervalSince(lastTick)
                  if dt > 0 {
                      let instant = Double(received - lastBytes) / dt
                      speed = speed == 0 ? instant : speed * 0.8 + instant * 0.2
                  }
                  lastBytes = received
                  lastTick = now
                  stage = .downloading(received: received, expected: expected, bytesPerSecond: speed)

                  // Room for the download plus the compressed copy.
                  if expected > 0 && received < 5_000_000 {
                      let needed = Int64(Double(expected) * 1.8)
                      let free = WorkFolder.freeSpace
                      if free > 0 && needed > free {
                          t.cancel()
                          ticker?.invalidate()
                          let msg = "Not enough free space on your iPhone. This video needs about \(Self.bytes(needed)) while it's prepared, and you have \(Self.bytes(free)) free. Free up space, or tap Stream Instead (nothing gets saved)."
                          DiagLog.shared.log("files", msg)
                          stage = .failed(msg)
                      }
                  }
              }

              private func downloaded(_ result: Result<URL, Error>) {
                  ticker?.invalidate()
                  guard !finished else { return }
                  switch result {
                  case .success(let file):
                      let size = (try? FileManager.default.attributesOfItem(atPath: file.path)[.size] as? Int64) ?? 0
                      DiagLog.shared.log("files", "Downloaded \(Self.bytes(size)) for “\(job.movie.title)”.")
                      Task { await compress(file) }
                  case .failure(let error):
                      if LibraryStore.isCancel(error) { return }
                      DiagLog.shared.log("files", "Download failed: \(error.localizedDescription)")
                      stage = .failed("The download didn't finish. \(LibraryStore.friendly(error))")
                  }
              }

              // MARK: 2. Compress

              private func compress(_ input: URL) async {
                  stage = .compressing(progress: 0)
                  let asset = AVURLAsset(url: input)
                  guard (try? await asset.load(.isExportable)) == true,
                        let track = try? await asset.loadTracks(withMediaType: .video).first else {
                      skipCompression(input, because: "iPhone can't compress this file type (\(input.pathExtension.uppercased())), so it plays as downloaded.")
                      return
                  }
                  let size = (try? await track.load(.naturalSize)) ?? .zero
                  let longest = max(abs(size.width), abs(size.height))
                  let formats = (try? await track.load(.formatDescriptions)) ?? []
                  let isHEVC = formats.contains { CMFormatDescriptionGetMediaSubType($0) == kCMVideoCodecType_HEVC }

                  let preset: String
                  if !keepOriginalResolution && longest > 1920 {
                      preset = AVAssetExportPresetHEVC1920x1080
                  } else if !isHEVC {
                      preset = AVAssetExportPresetHEVCHighestQuality
                  } else {
                      skipCompression(input, because: "This file is already compact, so it plays as downloaded.")
                      return
                  }

                  guard let session = AVAssetExportSession(asset: asset, presetName: preset) else {
                      skipCompression(input, because: "Compression isn't available for this file, so it plays as downloaded.")
                      return
                  }
                  let output = folder.appendingPathComponent("compressed.mp4")
                  try? FileManager.default.removeItem(at: output)
                  session.outputURL = output
                  session.outputFileType = .mp4
                  session.shouldOptimizeForNetworkUse = false
                  export = session
                  DiagLog.shared.log("files", "Compressing \(Int(size.width))×\(Int(size.height))\(isHEVC ? " HEVC" : "") with \(preset)")

                  ticker = Timer.scheduledTimer(withTimeInterval: 0.5, repeats: true) { [weak self] _ in
                      Task { @MainActor in
                          guard let self, let e = self.export, case .compressing = self.stage else { return }
                          self.stage = .compressing(progress: Double(e.progress))
                      }
                  }
                  await session.export()
                  ticker?.invalidate()
                  guard !finished else { return }

                  if session.status == .completed {
                      let before = (try? FileManager.default.attributesOfItem(atPath: input.path)[.size] as? Int64) ?? 0
                      let after = (try? FileManager.default.attributesOfItem(atPath: output.path)[.size] as? Int64) ?? 0
                      try? FileManager.default.removeItem(at: input)
                      DiagLog.shared.log("files", "Compressed \(Self.bytes(before)) → \(Self.bytes(after)); original download deleted.")
                      ready(output)
                  } else {
                      try? FileManager.default.removeItem(at: output)
                      skipCompression(input, because: "Compression didn't work for this file (\(session.error?.localizedDescription ?? "unknown error")), so it plays as downloaded.")
                  }
              }

              private func skipCompression(_ input: URL, because reason: String) {
                  DiagLog.shared.log("files", reason)
                  note = reason
                  ready(input)
              }

              // MARK: 3. Play (4. delete happens when the player closes)

              private func ready(_ file: URL) {
                  finished = true
                  endBackgroundTask()
                  stage = .ready(file)
              }

              static func bytes(_ n: Int64) -> String {
                  ByteCountFormatter.string(fromByteCount: n, countStyle: .file)
              }
          }

          // MARK: Screen

          struct PrepareAndPlayView: View {
              let job: PrepareJob
              @EnvironmentObject private var store: LibraryStore
              @Environment(\.dismiss) private var dismiss
              @StateObject private var pipe: MediaPipeline

              init(job: PrepareJob) {
                  self.job = job
                  _pipe = StateObject(wrappedValue: MediaPipeline(job: job))
              }

              var body: some View {
                  Group {
                      switch pipe.stage {
                      case .ready(let file):
                          PlayerScreen(request: request(file: file, cleanup: pipe.folder), store: store)
                      case .streaming:
                          PlayerScreen(request: request(file: job.url, cleanup: nil), store: store)
                      default:
                          progressScreen
                      }
                  }
                  .onAppear { pipe.start() }
              }

              private func request(file: URL, cleanup: URL?) -> PlayRequest {
                  var r = store.request(for: job.movie, url: file, cookies: file.isFileURL ? [] : job.cookies,
                                        headers: file.isFileURL ? [:] : job.headers)
                  r.cleanup = cleanup
                  r.febboxNames = job.febboxNames
                  return r
              }

              private var progressScreen: some View {
                  ZStack {
                      Color.black.ignoresSafeArea()
                      VStack(spacing: 22) {
                          Text(job.movie.title)
                              .font(.title2.weight(.bold))
                              .multilineTextAlignment(.center)

                          VStack(alignment: .leading, spacing: 14) {
                              step(1, "Download", state: downloadState)
                              step(2, "Compress", state: compressState)
                              step(3, "Play", state: .waiting)
                              step(4, "Delete when you close the player", state: .waiting)
                          }
                          .padding(18)
                          .background(Color(white: 0.1), in: RoundedRectangle(cornerRadius: 16, style: .continuous))

                          stageDetail

                          if let note = pipe.note {
                              Text(note).font(.footnote).foregroundStyle(.secondary).multilineTextAlignment(.center)
                          }

                          if case .failed(let message) = pipe.stage {
                              Text(message).font(.subheadline).foregroundStyle(.orange).multilineTextAlignment(.center)
                              BigButton(title: "Try Again", systemImage: "arrow.clockwise") { pipe.retry() }
                              BigButton(title: "Stream Instead (nothing saved)", systemImage: "play.fill", prominent: false) { pipe.streamInstead() }
                          } else {
                              Text("Keep CineScout open until this finishes.")
                                  .font(.footnote).foregroundStyle(.secondary)
                          }

                          BigButton(title: "Cancel", prominent: false) {
                              pipe.cancel()
                              dismiss()
                          }
                      }
                      .padding(24)
                      .frame(maxWidth: 480)
                  }
                  .foregroundStyle(.white)
                  .preferredColorScheme(.dark)
              }

              private enum StepState { case waiting, active, done }

              private var downloadState: StepState {
                  switch pipe.stage {
                  case .starting, .downloading: return .active
                  case .failed: return .waiting
                  default: return .done
                  }
              }

              private var compressState: StepState {
                  switch pipe.stage {
                  case .compressing: return .active
                  case .ready, .streaming: return .done
                  default: return .waiting
                  }
              }

              private func step(_ n: Int, _ title: String, state: StepState) -> some View {
                  HStack(spacing: 12) {
                      ZStack {
                          Circle().fill(state == .done ? Color.green : (state == .active ? Color.orange : Color(white: 0.25)))
                              .frame(width: 26, height: 26)
                          if state == .done {
                              Image(systemName: "checkmark").font(.caption.weight(.bold))
                          } else {
                              Text("\(n)").font(.caption.weight(.bold))
                          }
                      }
                      Text(title)
                          .font(.subheadline.weight(state == .active ? .semibold : .regular))
                          .foregroundStyle(state == .waiting ? .secondary : .primary)
                      Spacer()
                      if state == .active { ProgressView().controlSize(.small).tint(.white) }
                  }
              }

              @ViewBuilder private var stageDetail: some View {
                  switch pipe.stage {
                  case .downloading(let received, let expected, let speed):
                      VStack(spacing: 8) {
                          if expected > 0 {
                              ProgressView(value: Double(received), total: Double(expected)).tint(.orange)
                          }
                          Text(downloadText(received, expected, speed))
                              .font(.footnote.monospacedDigit())
                              .foregroundStyle(.secondary)
                      }
                  case .compressing(let p):
                      VStack(spacing: 8) {
                          ProgressView(value: p).tint(.orange)
                          Text("Compressing… \(Int(p * 100))%. Long 4K videos can take a while.")
                              .font(.footnote.monospacedDigit())
                              .foregroundStyle(.secondary)
                      }
                  default:
                      EmptyView()
                  }
              }

              private func downloadText(_ received: Int64, _ expected: Int64, _ speed: Double) -> String {
                  var parts = [expected > 0 ? "\(MediaPipeline.bytes(received)) of \(MediaPipeline.bytes(expected))" : MediaPipeline.bytes(received)]
                  if speed > 0 {
                      parts.append("\(MediaPipeline.bytes(Int64(speed)))/s")
                      if expected > received {
                          let secs = Double(expected - received) / speed
                          parts.append(secs > 90 ? "about \(Int(secs / 60)) min left" : "under 2 min left")
                      }
                  }
                  return parts.joined(separator: " · ")
              }
          }
          CINESCOUT_EOF

