          import Foundation

          /// A link that opens the movie in another app or service (e.g. FebBox).
          struct ExternalLink: Codable, Hashable, Sendable {
              var service: String
              var url: URL
              var label: String?
          }

          struct Movie: Identifiable, Codable, Hashable, Sendable {
              struct Detail: Codable, Hashable, Sendable {
                  var label: String
                  var value: String
              }

              var id: String
              var title: String
              var year: String?
              var overview: String?
              var posterURL: URL?
              var videoURLs: [URL]
              var pageURL: URL?
              var source: String
              var details: [Detail] = []
              var externalLinks: [ExternalLink] = []
              /// Play buttons / player pages not opened yet. The video behind them is looked up
              /// when the movie comes on screen or you open it, instead of during the scan.
              var pendingLinks: [URL] = []
              var addedAt: Date = Date()
          }

          extension Movie {
              // Tolerant decoding, so libraries saved by older builds still load.
              enum CodingKeys: String, CodingKey {
                  case id, title, year, overview, posterURL, videoURLs, pageURL, source, details, externalLinks, pendingLinks, addedAt
              }

              init(from decoder: Decoder) throws {
                  let c = try decoder.container(keyedBy: CodingKeys.self)
                  id = try c.decode(String.self, forKey: .id)
                  title = try c.decode(String.self, forKey: .title)
                  year = try c.decodeIfPresent(String.self, forKey: .year)
                  overview = try c.decodeIfPresent(String.self, forKey: .overview)
                  posterURL = try c.decodeIfPresent(URL.self, forKey: .posterURL)
                  videoURLs = try c.decodeIfPresent([URL].self, forKey: .videoURLs) ?? []
                  pageURL = try c.decodeIfPresent(URL.self, forKey: .pageURL)
                  source = try c.decodeIfPresent(String.self, forKey: .source) ?? ""
                  details = try c.decodeIfPresent([Detail].self, forKey: .details) ?? []
                  externalLinks = try c.decodeIfPresent([ExternalLink].self, forKey: .externalLinks) ?? []
                  pendingLinks = try c.decodeIfPresent([URL].self, forKey: .pendingLinks) ?? []
                  addedAt = try c.decodeIfPresent(Date.self, forKey: .addedAt) ?? Date()
              }

              func detail(_ label: String) -> String? {
                  details.first { $0.label == label }?.value
              }

              var genres: [String] {
                  (detail("Genre") ?? "")
                      .split(separator: ",")
                      .map { $0.trimmingCharacters(in: .whitespaces) }
                      .filter { !$0.isEmpty }
              }

              /// "1999 · Action · 2h 16m · R"
              var metaLine: String {
                  [year, genres.first, detail("Runtime"), detail("Rated")]
                      .compactMap { $0 }
                      .filter { !$0.isEmpty }
                      .joined(separator: " · ")
              }

              var hasVideo: Bool { !videoURLs.isEmpty }
              var needsLookup: Bool { !pendingLinks.isEmpty }

              /// The version to play by default: highest quality the app can play
              /// (4K first), preferring files the built-in engines handle.
              func bestVideo(canPlayAnything: Bool) -> URL? {
                  func score(_ u: URL) -> Int {
                      let s = (u.path.removingPercentEncoding ?? u.path).lowercased()
                      var v = 0
                      if s.range(of: #"2160p|\b4k\b|\buhd\b"#, options: .regularExpression) != nil { v += 40 }
                      else if s.contains("1080") { v += 30 }
                      else if s.contains("720") { v += 20 }
                      else if s.contains("480") { v += 10 }
                      if !canPlayAnything && ExternalPlayer.needed(for: u) { v -= 100 }
                      return v
                  }
                  var best: URL?
                  var bestScore = Int.min
                  for u in videoURLs where score(u) > bestScore {
                      best = u
                      bestScore = score(u)
                  }
                  return best
              }
          }

          struct Site: Identifiable, Codable, Hashable, Sendable {
              var url: URL
              var lastScanned: Date?
              var movieCount: Int = 0
              var id: String { url.absoluteString }
          }

          struct WatchProgress: Codable, Hashable, Sendable {
              var position: Double
              var duration: Double
              var updated: Date
          }

          struct PlayRequest: Identifiable {
              let id = UUID()
              let movie: Movie
              let url: URL
              let start: Double
              /// Sign-in cookies and headers from the in-app browser, for links that need them.
              var cookies: [HTTPCookie] = []
              var headers: [String: String] = [:]
              /// Temporary folder holding a downloaded copy; deleted when the player closes.
              var cleanup: URL? = nil
              /// FebBox collaborative item to remove once you close the player.
              var febboxNames: [String] = []
          }

          /// "See all" destination for a shelf.
          struct ShelfRoute: Hashable {
              var title: String
              var ids: [String]
          }
