                  content.addUserScript(WKUserScript(source: popups, injectionTime: .atDocumentStart, forMainFrameOnly: false))
                  content.addUserScript(WKUserScript(source: WebModel.sniffer, injectionTime: .atDocumentStart, forMainFrameOnly: false))
                  let handler = RobotMessageHandler(self)
                  content.add(handler, name: "robot")
                  content.add(handler, name: "cinescout")
                  webView.navigationDelegate = self
                  webView.uiDelegate = self
                  webView.customUserAgent = Scraper.userAgent
              }

              // MARK: Play flow

              /// - Parameters:
              ///   - page: the movie's page on your site (used when the share link isn't known yet)
              ///   - share: a known FebBox share link (skips the site steps)
              ///   - stopAtShare: background mode — stop once the share link is found
              func run(page: URL?, share knownShare: URL?, stopAtShare: Bool = false) async -> Result {
                  self.stopAtShare = stopAtShare
                  if let knownShare {
                      share = knownShare
                      enter(.onShare)
                      say("Opening the FebBox share page…")
                      webView.load(URLRequest(url: knownShare))
                  } else if let page {
                      siteBase = page.host.map(Scraper.baseDomain)
                      enter(.findShare)
                      say("Opening the movie's page…")
                      webView.load(URLRequest(url: page))
                  } else {
                      return Result()
                  }
                  DiagLog.shared.log("robot", "Start: \(knownShare?.absoluteString ?? page?.absoluteString ?? "")")
                  await drive(seconds: rules.robotTimeout ?? 60)

                  var result = Result(share: share, videos: videos, names: names)
                  if let v = videos.first {
                      let all = await webView.configuration.websiteDataStore.httpCookieStore.allCookies()
                      let host = v.host?.lowercased() ?? ""
                      result.cookies = all.filter { c in
                          let d = c.domain.lowercased().trimmingCharacters(in: CharacterSet(charactersIn: "."))
                          return host == d || host.hasSuffix("." + d) || d.hasSuffix(Scraper.baseDomain(host))
                      }
                      if let ref = webView.url?.absoluteString { result.headers["Referer"] = ref }
                      result.headers["User-Agent"] = Scraper.userAgent
                  }
                  DiagLog.shared.log("robot", "Done: share \(share?.absoluteString ?? "none"), accepted: \(accepted), \(videos.count) stream(s), names: \(names.prefix(3).joined(separator: " | "))")
                  detach()
                  return result
              }

              // MARK: Removal flow

              /// Opens your console's collaborative files and removes the item with one of these names.
              func remove(names itemNames: [String]) async -> Bool {
                  names = itemNames.filter { !$0.isEmpty }
                  guard !names.isEmpty, let console = URL(string: rules.febboxConsoleURL ?? "") else { return false }
                  enter(.remove)
                  say("Removing it from your collaborative files…")
                  DiagLog.shared.log("robot", "Remove from collaborative files: \(names.prefix(3).joined(separator: " | "))")
                  webView.load(URLRequest(url: console))
                  await drive(seconds: 75)
                  DiagLog.shared.log("robot", removed ? "Removed from collaborative files." : "Couldn't confirm the removal (will try again later).")
                  detach()
                  return removed
              }

              func cancel() {
                  DiagLog.shared.log("robot", "Cancelled.")
                  finish()
              }

              // MARK: Engine

              private func drive(seconds: Int) async {
                  attachOffscreen()
                  let limit = UInt64(max(15, min(seconds, 240)))
                  timeout = Task { [weak self] in
                      try? await Task.sleep(nanoseconds: limit * 1_000_000_000)
                      guard let self, !Task.isCancelled else { return }
                      DiagLog.shared.log("robot", "Stopped after \(limit)s at step “\(self.goal.rawValue)” on \(self.webView.url?.absoluteString ?? "-")")
                      await self.saveSample()
                      self.finish()
                  }
                  loop = Task { [weak self] in
                      try? await Task.sleep(nanoseconds: 1_500_000_000)
                      while let self, !self.finished, !Task.isCancelled {
                          await self.probe()
                          try? await Task.sleep(nanoseconds: 1_200_000_000)
                      }
                  }
                  await withCheckedContinuation { c in
                      if finished { c.resume() } else { waiter = c }
                  }
              }

              private func finish() {
                  guard !finished else { return }
                  finished = true
                  loop?.cancel()
                  timeout?.cancel()
                  webView.stopLoading()
                  waiter?.resume()
                  waiter = nil
              }

              private func enter(_ g: Goal) {
                  goal = g
                  probes = 0
                  clicked.removeAll()
              }

              private func say(_ text: String) {
                  status(text)
                  DiagLog.shared.debug("robot", text)
              }

              private var playConfirm: String { #"^\s*(?:ok|okay|confirm|yes|sure|accept|agree|continue|got it|done)\s*$"# }

              // MARK: Found things

              private func foundShare(_ url: URL) {
                  guard share == nil else { return }
                  share = url
                  DiagLog.shared.log("robot", "Share link: \(url.absoluteString)")
                  if stopAtShare {
                      finish()
                      return
                  }
                  enter(.onShare)
                  say("Opening the FebBox share page…")
                  webView.load(URLRequest(url: url))
              }

              private func foundVideo(_ url: URL) {
                  guard goal == .onShare || goal == .console, !videos.contains(url) else { return }
                  videos.append(url)
                  DiagLog.shared.log("robot", "Stream: \(url.absoluteString)")
                  say("Found the video.")
                  Task { await saveSample() }
                  finish()
              }

              private func goToConsole() {
                  guard let console = URL(string: rules.febboxConsoleURL ?? "") else {
                      DiagLog.shared.log("robot", "No console address in rules; stopping.")
                      finish()
                      return
                  }
                  Task { await saveSample() }
                  enter(.console)
                  say("Opening your FebBox collaborative files…")
                  webView.load(URLRequest(url: console))
              }

              func message(_ name: String, _ body: String) {
                  if body.hasPrefix("open:") {
                      guard let u = URL(string: String(body.dropFirst(5))) else { return }
                      if goal == .findShare {
                          if isAcceptedShare(u) { foundShare(u) } else if isSameSite(u) { webView.load(URLRequest(url: u)) }
                      } else if isServiceSite(u) || videoExts.contains(u.pathExtension.lowercased()) {
                          webView.load(URLRequest(url: u))
                      }
                      return
                  }
                  // Stream requests made by FebBox's own preview player.
                  guard let u = URL(string: body), videoExts.contains(u.pathExtension.lowercased()) else { return }
                  foundVideo(u)
              }

              // MARK: Each step

              private func probe() async {
                  probes += 1
                  switch goal {
                  case .findShare: await probeFindShare()
                  case .onShare: await probeShare()
                  case .console: await probeConsole()
                  case .remove: await probeRemove()
                  }
                  if let extra = rules.robotScript, !extra.isEmpty, !finished {
                      _ = try? await webView.evaluateJavaScript(extra + "\n;true")
                  }
              }

              private func probeFindShare() async {
                  if let u = webView.url, isAcceptedShare(u) { foundShare(u); return }
                  let out = await evaluate("""
                  (function (acceptSrc, searchSrc, clickSrc, clicked) {
                    const acc = new RegExp(acceptSrc, 'i');
                    const found = [];
                    const add = (u) => { try { if (!u) return; u = new URL(u, location.href).href; if (acc.test(u)) found.push(u); } catch (e) {} };
                    add(location.href);
                    document.querySelectorAll('a[href], iframe[src], [data-href], [data-url], [data-link]').forEach(e =>
                      add(e.getAttribute('href') || e.getAttribute('src') || e.getAttribute('data-href') || e.getAttribute('data-url') || e.getAttribute('data-link')));
                    try {
                      const html = document.documentElement.outerHTML.split('\\\\/').join('/');
                      (html.match(new RegExp(searchSrc, 'gi')) || []).forEach(add);
                    } catch (e) {}
                    if (found.length) return JSON.stringify({ share: found[0] });
                    const c = CS.clickText(new RegExp(clickSrc, 'i'), clicked, 50);
                    return JSON.stringify(c ? { clicked: c } : {});
                  })(\(js(service?.acceptPattern)), \(js(service?.searchPattern)), \(js(rules.robotClickPattern)), \(clickedJSON))
                  """)
                  if let s = out["share"] as? String, let u = URL(string: s), isAcceptedShare(u) {
                      foundShare(u)
                  } else if let c = out["clicked"] as? String {
                      clicked.append(c)
                      say("Tapping “\(label(c))”…")
                  }
              }

              private func probeShare() async {
                  let doAccept = rules.febboxAutoAccept ?? true
                  let out = await evaluate("""
                  (function (acceptSrc, confirmSrc, previewSrc, doAccept, accepted, clicked) {
                    const names = CS.fileNames(), title = CS.title();
                    const vids = CS.videoSources();
                    if (vids.length) return JSON.stringify({ videos: vids, names, title });
                    const acc = new RegExp(acceptSrc, 'i');
                    if (doAccept && !accepted) {
                      const c = CS.clickText(acc, clicked, 45);
                      if (c) return JSON.stringify({ clicked: c, kind: 'accept', names, title });
                    }
                    if (accepted) {
                      const c = CS.clickText(new RegExp(confirmSrc, 'i'), clicked, 20);
                      if (c) return JSON.stringify({ clicked: c, kind: 'confirm', names, title });
                    }
                    const p = CS.clickText(new RegExp(previewSrc, 'i'), clicked, 30) || CS.clickMatching(t => CS.extRe.test(t), clicked, 160);
                    if (p) return JSON.stringify({ clicked: p, kind: 'preview', names, title });
                    return JSON.stringify({ names, title, acceptVisible: CS.anyText(acc) });
                  })(\(js(rules.febboxAcceptPattern)), \(js(playConfirm)), \(js(rules.febboxPreviewPattern)), \(doAccept), \(accepted), \(clickedJSON))
                  """)
                  collectNames(out)
                  if let list = out["videos"] as? [String] {
                      for s in list { if let u = URL(string: s) { foundVideo(u) } }
                      return
                  }
                  if let c = out["clicked"] as? String {
                      clicked.append(c)
                      switch out["kind"] as? String {
                      case "accept":
                          accepted = true
                          DiagLog.shared.log("robot", "Tapped “\(label(c))” on the share page.")
                          say("Accepting the collaboration…")
                      case "preview":
                          say("Starting FebBox's preview…")
                      default:
                          say("Tapping “\(label(c))”…")
                      }
                  }
                  // Give the share page a few tries; if it won't play here, use the console.
                  if probes >= (accepted ? 9 : 6) { goToConsole() }
              }

              private func probeConsole() async {
                  let out = await evaluate("""
                  (function (confirmSrc, collabSrc, previewSrc, names, clicked) {
                    const vids = CS.videoSources();
                    if (vids.length) return JSON.stringify({ videos: vids });
                    const c0 = CS.clickText(new RegExp(confirmSrc, 'i'), clicked, 20);
                    if (c0) return JSON.stringify({ clicked: c0, kind: 'confirm' });
                    const item = CS.findName(names);
                    if (!item) {
                      const s = CS.clickText(new RegExp(collabSrc, 'i'), clicked, 40);
                      return JSON.stringify(s ? { clicked: s, kind: 'section' } : { present: false });
                    }
                    const sig = CS.clickElement(item, clicked);
                    if (sig) return JSON.stringify({ clicked: sig, kind: 'item', present: true });
                    const p = CS.clickText(new RegExp(previewSrc, 'i'), clicked, 30);
                    return JSON.stringify(p ? { clicked: p, kind: 'preview', present: true } : { present: true });
                  })(\(js(playConfirm)), \(js(rules.febboxCollabPattern)), \(js(rules.febboxPreviewPattern)), \(namesJSON), \(clickedJSON))
                  """)
                  if let list = out["videos"] as? [String] {
                      for s in list { if let u = URL(string: s) { foundVideo(u) } }
                      return
                  }
                  if let c = out["clicked"] as? String {
                      clicked.append(c)
                      switch out["kind"] as? String {
                      case "section": say("Opening collaborative files…")
                      case "item": say("Opening “\(label(c))”…")
                      case "preview": say("Starting FebBox's preview…")
                      default: break
                      }
                  }
                  if probes == 8 && (out["present"] as? Bool) != true {
                      DiagLog.shared.log("robot", "Couldn't find \(names.first ?? "the file") in the console yet (\(webView.url?.absoluteString ?? "-")).")
                      await saveSample()
                  }
              }

              private func probeRemove() async {
                  let out = await evaluate("""
                  (function (collabSrc, removeSrc, confirmSrc, moreSrc, names, clicked, removeClicked) {
                    const removeRe = new RegExp(removeSrc, 'i'), moreRe = new RegExp(moreSrc, 'i');
                    if (removeClicked) {
                      const c = CS.clickText(new RegExp(confirmSrc, 'i'), clicked, 25);
                      if (c) return JSON.stringify({ clicked: c, kind: 'confirm', present: !!CS.findName(names) });
                    }
                    const row = CS.findName(names);
                    if (!row) {
                      const s = CS.clickText(new RegExp(collabSrc, 'i'), clicked, 40);
                      return JSON.stringify(s ? { clicked: s, kind: 'section', present: false } : { present: false });
                    }
                    // A remove button or "more" menu next to the item
                    let anc = row;
                    for (let i = 0; i < 6 && anc; i++) {
                      const btns = Array.from(anc.querySelectorAll('a, button, [role=button], [role=menuitem], span, i, div, li')).reverse();
                      for (const b of btns) {
                        if (!CS.visible(b)) continue;
                        const t = CS.text(b);
                        if (t && t.length < 40 && removeRe.test(t)) { const sig = CS.clickElement(b, clicked); if (sig) return JSON.stringify({ clicked: sig, kind: 'remove', present: true }); }
                      }
                      for (const b of btns) {
                        if (!CS.visible(b)) continue;
                        const t = CS.text(b);
                        if (t && t.length < 25 && moreRe.test(t)) { const sig = CS.clickElement(b, clicked); if (sig) return JSON.stringify({ clicked: sig, kind: 'more', present: true }); }
                      }
                      anc = anc.parentElement;
                      if (anc && anc.querySelectorAll('*').length > 600) break;
                    }
                    // A menu that opened somewhere else on the page
                    const r = CS.clickText(removeRe, clicked, 40);
                    if (r) return JSON.stringify({ clicked: r, kind: 'remove', present: true });
                    // Select the row (checkbox), then a toolbar Remove appears
                    const holder = row.closest('tr, li, [class*=item], [class*=row], [class*=file]') || row.parentElement;
                    const box = holder && holder.querySelector('input[type=checkbox], [role=checkbox], [class*=check]');
                    if (box && clicked.indexOf('select|' + CS.text(row)) < 0) { box.click(); return JSON.stringify({ clicked: 'select|' + CS.text(row), kind: 'select', present: true }); }
                    if (clicked.indexOf('context|' + CS.text(row)) < 0) {
                      row.dispatchEvent(new MouseEvent('contextmenu', { bubbles: true, cancelable: true }));
                      return JSON.stringify({ clicked: 'context|' + CS.text(row), kind: 'more', present: true });
                    }
                    return JSON.stringify({ present: true });
                  })(\(js(rules.febboxCollabPattern)), \(js(rules.febboxRemovePattern)), \(js(rules.febboxConfirmPattern)), \(js(rules.febboxMorePattern)), \(namesJSON), \(clickedJSON), \(removeClicked))
                  """)
                  if let c = out["clicked"] as? String {
                      clicked.append(c)
                      if out["kind"] as? String == "remove" {
                          removeClicked = true
                          DiagLog.shared.log("robot", "Tapped “\(label(c))”.")
                      }
                  }
                  let present = out["present"] as? Bool ?? false
                  if removeClicked && !present {
                      goneCount += 1
                      if goneCount >= 2 {
                          removed = true
                          finish()
                      }
                  } else {
                      goneCount = 0
                  }
                  if probes == 20 { await saveSample() }
              }

              // MARK: JavaScript helpers

              private func evaluate(_ body: String) async -> [String: Any] {
                  guard !finished,
                        let text = try? await webView.evaluateJavaScript(Self.helpers + "\n" + body) as? String,
                        let obj = try? JSONSerialization.jsonObject(with: Data(text.utf8)) as? [String: Any] else { return [:] }
                  return obj
              }

              /// Shared page helpers: visible text, clicking the innermost matching element, file names, streams.
              private static let helpers = """
              var CS = {
                extRe: /\\.(mp4|m4v|mov|mkv|webm|avi|ts|m2ts|wmv)\\b/i,
                visible: function (el) { var r = el.getBoundingClientRect(); return r.width > 0 && r.height > 0; },
                text: function (el) { return ((el.innerText || el.value || el.getAttribute('aria-label') || el.getAttribute('title') || '') + '').replace(/\\s+/g, ' ').trim(); },
                all: function () { return Array.from(document.querySelectorAll('a, button, [role=button], [role=menuitem], [role=tab], [role=option], input[type=button], input[type=submit], [onclick], li, div, span, p, td, label')).reverse(); },
                sig: function (el, t) { return t.slice(0, 80) + '|' + (el.getAttribute('href') || el.getAttribute('data-id') || el.id || (typeof el.className === 'string' ? el.className : '') || el.tagName); },
                clickElement: function (el, clicked) {
                  var t = CS.text(el) || el.tagName; var s = CS.sig(el, t);
                  if (clicked.indexOf(s) >= 0) return null;
                  try { el.scrollIntoView({ block: 'center' }); } catch (e) {}
                  el.click(); return s;
                },
                clickMatching: function (test, clicked, maxLen) {
                  var els = CS.all();
                  for (var i = 0; i < els.length; i++) {
                    var el = els[i]; if (el.children.length > 5) continue;
                    var t = CS.text(el); if (!t || t.length > maxLen || !test(t) || !CS.visible(el)) continue;
                    var s = CS.sig(el, t); if (clicked.indexOf(s) >= 0) continue;
                    try { el.scrollIntoView({ block: 'center' }); } catch (e) {}
                    el.click(); return s;
                  }
                  return null;
                },
                clickText: function (re, clicked, maxLen) { return CS.clickMatching(function (t) { return re.test(t); }, clicked, maxLen); },
                anyText: function (re) { return CS.all().some(function (el) { var t = CS.text(el); return t && t.length < 60 && re.test(t) && CS.visible(el); }); },
                fileNames: function () {
                  var out = [];
                  CS.all().forEach(function (el) {
                    if (el.children.length > 1) return;
                    var t = CS.text(el); if (t && t.length < 200 && CS.extRe.test(t) && out.indexOf(t) < 0) out.push(t);
                  });
                  return out.slice(0, 12);
                },
                title: function () {
                  var h = document.querySelector('h1, h2, [class*=title], [class*=name]');
                  return ((h && CS.text(h)) || document.title || '').replace(/\\s*[-|·]\\s*febbox.*$/i, '').trim();
                },
                videoSources: function () {
                  var ext = /\\.(mp4|m4v|mov|mkv|webm|m3u8)(\\?|#|$)/i, out = [];
                  document.querySelectorAll('video, video source, source').forEach(function (e) {
                    var u = e.currentSrc || e.src || e.getAttribute('src');
                    if (u && /^https?:/i.test(u) && (ext.test(u) || e.tagName === 'VIDEO')) out.push(u);
                  });
                  return out;
                },
                findName: function (names) {
                  var wanted = names.map(function (n) { return n.toLowerCase(); }).concat(
                    names.map(function (n) { return n.toLowerCase().replace(/\\.[a-z0-9]{2,4}$/, ''); })).filter(function (n) { return n.length > 2; });
                  var els = CS.all();
                  for (var i = 0; i < els.length; i++) {
                    var el = els[i]; if (el.children.length > 3 || !CS.visible(el)) continue;
                    var t = CS.text(el).toLowerCase(); if (!t || t.length > 220) continue;
                    for (var j = 0; j < wanted.length; j++) { if (t.indexOf(wanted[j]) >= 0) return el; }
                  }
                  return null;
                }
              };
              """

              private func js(_ pattern: String?) -> String {
                  var p = pattern ?? ""
                  if p.hasPrefix("(?i)") { p.removeFirst(4) }
                  let data = (try? JSONEncoder().encode(p)) ?? Data("\"\"".utf8)
                  return String(decoding: data, as: UTF8.self)
              }

              private var clickedJSON: String {
                  String(decoding: (try? JSONEncoder().encode(clicked)) ?? Data("[]".utf8), as: UTF8.self)
              }

              private var namesJSON: String {
                  String(decoding: (try? JSONEncoder().encode(names)) ?? Data("[]".utf8), as: UTF8.self)
              }

              private func collectNames(_ out: [String: Any]) {
                  var found = (out["names"] as? [String]) ?? []
                  if let t = out["title"] as? String, t.count > 2, t.count < 150 { found.append(t) }
                  for n in found where !names.contains(n) { names.append(n) }
              }

              private func label(_ sig: String) -> String {
                  String((sig.components(separatedBy: "|").first ?? sig).prefix(40))
              }

              /// Saves the current page for the diagnostic report, so Claude can see the real buttons.
              private func saveSample() async {
                  guard let html = try? await webView.evaluateJavaScript("document.documentElement.outerHTML") as? String else { return }
                  let dir = FileManager.default.urls(for: .documentDirectory, in: .userDomainMask)[0].appendingPathComponent("samples", isDirectory: true)
                  try? FileManager.default.createDirectory(at: dir, withIntermediateDirectories: true)
                  let body = "<!-- \(webView.url?.absoluteString ?? "") -->\n" + String(html.prefix(300_000))
                  try? body.write(to: dir.appendingPathComponent("febbox-\(goal.rawValue).html"), atomically: true, encoding: .utf8)
              }

              // MARK: Where the page may go

              private func isServiceSite(_ u: URL) -> Bool {
                  guard let h = u.host?.lowercased() else { return false }
                  return Scraper.matches(serviceHost, h)
              }

              private func isAcceptedShare(_ u: URL) -> Bool {
                  isServiceSite(u) && (accept == nil || Scraper.matches(accept, u.absoluteString))
              }

              private func isSameSite(_ u: URL) -> Bool {
                  guard let h = u.host?.lowercased(), let siteBase else { return false }
                  return Scraper.baseDomain(h) == siteBase
              }

              func webView(_ webView: WKWebView, decidePolicyFor navigationAction: WKNavigationAction) async -> WKNavigationActionPolicy {
                  guard let url = navigationAction.request.url else { return .allow }
                  if videoExts.contains(url.pathExtension.lowercased()) {
                      foundVideo(url)
                      return goal == .findShare ? .allow : .cancel
                  }
                  guard navigationAction.targetFrame?.isMainFrame ?? true else { return .allow }
                  if isServiceSite(url) && !isAcceptedShare(url) {
                      switch goal {
                      case .findShare:
                          // On the way to the share page: refuse any other FebBox address.
                          DiagLog.shared.log("robot", "Refused \(url.absoluteString) (not a share page)")
                          return .cancel
                      case .onShare:
                          // Before accepting, stay on the share page; after accepting, FebBox may take us to the console.
                          if accepted || navigationAction.navigationType == .linkActivated {
                              if accepted { enter(.console); say("Opening your FebBox collaborative files…") }
                              return .allow
                          }
                          DiagLog.shared.log("robot", "Refused \(url.absoluteString) (not a share page)")
                          return .cancel
                      case .console, .remove:
                          return .allow
                      }
                  }
                  if goal == .findShare && isAcceptedShare(url) {
                      foundShare(url)
                      return stopAtShare ? .cancel : .allow
                  }
                  return .allow
              }

              func webView(_ webView: WKWebView, decidePolicyFor navigationResponse: WKNavigationResponse) async -> WKNavigationResponsePolicy {
                  let r = navigationResponse.response
                  let mime = (r.mimeType ?? "").lowercased()
                  let disposition = ((r as? HTTPURLResponse)?.value(forHTTPHeaderField: "Content-Disposition") ?? "").lowercased()
                  let named = disposition.range(of: #"filename\*?=[^;]*\.(mp4|m4v|mov|mkv|webm|avi|wmv|ts|m2ts)"#, options: .regularExpression) != nil
                  if goal != .findShare, goal != .remove, let url = r.url,
                     mime.hasPrefix("video/") || mime.contains("mpegurl") || named || (mime.contains("octet-stream") && r.expectedContentLength > 50_000_000) {
                      foundVideo(url)
                      return .cancel
                  }
                  return .allow
              }

              func webView(_ webView: WKWebView, createWebViewWith configuration: WKWebViewConfiguration,
                           for navigationAction: WKNavigationAction, windowFeatures: WKWindowFeatures) -> WKWebView? {
                  // New windows (often ads) are ignored unless they lead somewhere we need.
                  if let url = navigationAction.request.url {
                      if goal == .findShare {
                          if isAcceptedShare(url) { foundShare(url) } else if isSameSite(url) { webView.load(URLRequest(url: url)) }
                      } else if isServiceSite(url) {
                          webView.load(URLRequest(url: url))
                      } else if videoExts.contains(url.pathExtension.lowercased()) {
                          foundVideo(url)
                      }
                  }
                  return nil
              }

              // MARK: Hidden placement (pages need to be on screen for their scripts to run normally)

              private func attachOffscreen() {
                  guard holder == nil,
                        let window = UIApplication.shared.connectedScenes
                          .compactMap({ $0 as? UIWindowScene })
                          .flatMap(\.windows)
                          .first(where: \.isKeyWindow) else { return }
                  let box = UIView(frame: CGRect(x: 0, y: 0, width: 390, height: 844))
                  box.alpha = 0.01
                  box.isUserInteractionEnabled = false
                  box.addSubview(webView)
                  window.insertSubview(box, at: 0)
                  holder = box
              }

              private func detach() {
                  webView.stopLoading()
                  webView.removeFromSuperview()
                  holder?.removeFromSuperview()
                  holder = nil
              }
          }

          @MainActor
          final class RobotMessageHandler: NSObject, WKScriptMessageHandler {
              weak var robot: BrowserRobot?
              init(_ robot: BrowserRobot) { self.robot = robot }

              func userContentController(_ userContentController: WKUserContentController, didReceive message: WKScriptMessage) {
                  guard let s = message.body as? String else { return }
                  robot?.message(message.name, s)
              }
          }
          CINESCOUT_EOF

