          import Foundation
          import JavaScriptCore

          /// Scanner behaviour that can be changed without rebuilding the app.
          /// Stored as Documents/rules.json; edited in Diagnostics → Scanner rules.
          /// Any field left out falls back to the built-in default.
          /// An outside service whose links should be shown as "Open in <name>" buttons.
          struct ExternalService: Codable, Sendable, Equatable {
              var name: String
              /// Matches the link's host, e.g. febbox.com.
              var hostPattern: String?
              /// Matches the link's text, e.g. "Open in FebBox" (catches links that redirect through your site).
              var labelPattern: String?
              /// Patterns that pull the item's code out of any form of link (first capture group).
              var canonicalPatterns: [String]?
              /// The address to open, with $1 replaced by that code.
              var canonicalTemplate: String?
              /// Button text to scroll to and highlight when the page opens.
              var highlightPattern: String?
              /// The ONLY kind of address CineScout accepts for this service. Other links to the
              /// service (account pages, home page) are ignored and the search keeps going.
              var acceptPattern: String?
              /// Finds accepted addresses written anywhere in a page (scripts, data, plain text).
              var searchPattern: String?

              func accepts(_ url: URL) -> Bool {
                  guard let p = acceptPattern, !p.isEmpty else { return true }
                  return url.absoluteString.range(of: p, options: .regularExpression) != nil
              }

              /// Any form of this service's link → the one address CineScout opens.
              func canonical(_ url: URL) -> URL {
                  guard let template = canonicalTemplate, !template.isEmpty else { return url }
                  let text = url.absoluteString
                  for p in canonicalPatterns ?? [] {
                      guard let re = try? NSRegularExpression(pattern: p),
                            let m = re.firstMatch(in: text, range: NSRange(text.startIndex..., in: text)),
                            m.numberOfRanges > 1, let r = Range(m.range(at: 1), in: text) else { continue }
                      let code = String(text[r])
                      if let u = URL(string: template.replacingOccurrences(of: "$1", with: code)) { return u }
                  }
                  return url
              }
          }

          struct Rules: Codable, Sendable, Equatable {
              var version: Int?
              var note: String?
              /// Link text that means "this link plays the movie" (Play, Watch, 1080p…).
              var playLabelPattern: String?
              /// Link text that is NOT a movie name (Play, Download, Home, Server 2…).
