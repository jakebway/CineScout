                  script: "",
                  externalServices: [
                      ExternalService(name: "FebBox",
                                      hostPattern: #"(?i)(^|\.)febbox\.com$"#,
                                      labelPattern: #"(?i)\bfeb\s?box\b"#,
                                      canonicalPatterns: [
                                          #"(?i)febbox\.com/(?:share|s)/([A-Za-z0-9_-]+)"#,
                                          #"(?i)febbox[^?#]*[?&#](?:share_key|sharekey|share|key)=([A-Za-z0-9_-]+)"#,
