name: Build CineScout
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Build CineScout
        shell: bash
        run: |
          # =====================================================================
          #  CineScout build script
          #  GitHub runs this on a Mac to turn the code below into CineScout.ipa.
          #  You never need to edit this file. When Claude sends a new version,
          #  upload it to your repository to replace this one.
          # =====================================================================
          set -euo pipefail

          echo "▶ Step 1/6: Installing tools"
          brew install xcodegen >/dev/null

          echo "▶ Step 2/6: Writing the app's code"
          rm -rf CineScout project.yml Podfile Pods Podfile.lock CineScout.xcworkspace CineScout.xcodeproj build
          mkdir -p CineScout/Sources CineScout/Assets.xcassets/AppIcon.appiconset

          cat > 'project.yml' <<'CINESCOUT_EOF'
          name: CineScout
          options:
            bundleIdPrefix: com.jakebway
            deploymentTarget:
              iOS: "17.0"
          packages:
            SwiftSoup:
              url: https://github.com/scinfu/SwiftSoup
              from: "2.7.0"
          targets:
            CineScout:
              type: application
              platform: iOS
              sources:
                - path: CineScout/Sources
                - path: CineScout/Assets.xcassets
              dependencies:
                - package: SwiftSoup
              scheme: {}
              info:
                path: CineScout/Info.plist
                properties:
                  CFBundleDisplayName: CineScout
                  CFBundleShortVersionString: "1.0"
                  CFBundleVersion: "1"
                  UILaunchScreen: {}
                  UIUserInterfaceStyle: Dark
                  UIApplicationSupportsIndirectInputEvents: true
                  UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
                  UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
                  NSAppTransportSecurity:
                    NSAllowsArbitraryLoads: true
                    NSAllowsLocalNetworking: true
                  NSLocalNetworkUsageDescription: CineScout connects to your media site on your local network.
                  UIBackgroundModes: [audio, fetch, processing]
                  BGTaskSchedulerPermittedIdentifiers: [com.jakebway.cinescout.refresh]
                  LSApplicationQueriesSchemes: [vlc-x-callback, infuse]
                  UIFileSharingEnabled: true
                  LSSupportsOpeningDocumentsInPlace: true
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.jakebway.cinescout
                  SWIFT_VERSION: "5.0"
                  ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
                  TARGETED_DEVICE_FAMILY: "1,2"
                  CODE_SIGNING_ALLOWED: "NO"
                  ENABLE_USER_SCRIPT_SANDBOXING: "NO"
          CINESCOUT_EOF
          cat > 'CineScout/Assets.xcassets/Contents.json' <<'CINESCOUT_EOF'
          {"info":{"author":"xcode","version":1}}
          CINESCOUT_EOF
          cat > 'CineScout/Assets.xcassets/AppIcon.appiconset/Contents.json' <<'CINESCOUT_EOF'
          {"images":[{"filename":"icon.png","idiom":"universal","platform":"ios","size":"1024x1024"}],"info":{"author":"xcode","version":1}}
          CINESCOUT_EOF

          # ---- Background.swift
          cat > 'CineScout/Sources/Background.swift' <<'CINESCOUT_EOF'
          import Foundation
          import BackgroundTasks

          /// Lets iPhone run CineScout's refresh while the phone is idle (usually overnight on
          /// Wi-Fi): rescans stale sites and looks up videos ahead of time.
          enum BackgroundWork {
              static let id = "com.jakebway.cinescout.refresh"

              /// Must run before the app finishes launching.
              static func register() {
                  BGTaskScheduler.shared.register(forTaskWithIdentifier: id, using: nil) { task in
                      guard let task = task as? BGProcessingTask else {
                          task.setTaskCompleted(success: false)
                          return
                      }
                      handle(task)
                  }
              }

              static func schedule() {
                  let request = BGProcessingTaskRequest(identifier: id)
                  request.requiresNetworkConnectivity = true
                  request.requiresExternalPower = false
                  request.earliestBeginDate = Date(timeIntervalSinceNow: 2 * 3600)
                  do {
                      try BGTaskScheduler.shared.submit(request)
                  } catch {
                      DiagLog.shared.debug("background", "Couldn't schedule background refresh: \(error.localizedDescription)")
                  }
              }

              private static func handle(_ task: BGProcessingTask) {
                  schedule()
                  DiagLog.shared.log("background", "Background refresh started by iOS")
                  let work = Task { @MainActor in
                      await LibraryStore.shared.backgroundWork()
                      task.setTaskCompleted(success: true)
                  }
                  task.expirationHandler = {
                      work.cancel()
                      Task { @MainActor in LibraryStore.shared.stopScan() }
                      DiagLog.shared.log("background", "iOS ended background time; will continue next time.")
                  }
              }
          }
          CINESCOUT_EOF

          # ---- CineScoutApp.swift
          cat > 'CineScout/Sources/CineScoutApp.swift' <<'CINESCOUT_EOF'
          import SwiftUI
          import AVFoundation

          @main
          struct CineScoutApp: App {
              @StateObject private var store = LibraryStore.shared
              @Environment(\.scenePhase) private var phase

              init() {
                  CrashWatch.install()
                  WorkFolder.cleanAll()
                  BackgroundWork.register()
                  URLCache.shared = URLCache(memoryCapacity: 64 * 1024 * 1024, diskCapacity: 400 * 1024 * 1024)
                  try? AVAudioSession.sharedInstance().setCategory(.playback, mode: .moviePlayback)
                  if UserDefaults.standard.bool(forKey: "sessionOpen") {
                      DiagLog.shared.log("app", "The previous session ended while the app was open (crash or killed by iOS).")
                  }
                  DiagLog.shared.log("app", "Launch · \(AppInfo.summary)")
              }

              var body: some Scene {
                  WindowGroup {
                      RootView()
                          .environmentObject(store)
                          .preferredColorScheme(.dark)
                          .tint(.orange)
                  }
                  .onChange(of: phase) { _, newPhase in
                      switch newPhase {
                      case .active:
                          UserDefaults.standard.set(true, forKey: "sessionOpen")
                          store.autoRefreshIfStale()
                      case .background:
                          UserDefaults.standard.set(false, forKey: "sessionOpen")
                          BackgroundWork.schedule()
                      default: break
                      }
                  }
              }
          }
          CINESCOUT_EOF

          # ---- Components.swift
          cat > 'CineScout/Sources/Components.swift' <<'CINESCOUT_EOF'
          import SwiftUI
          import UIKit

          // MARK: Artwork

          /// Poster art that fills whatever frame it's given, with a coloured fallback while loading.
          struct ArtFill: View {
              let movie: Movie
              var showTitle = true

              var body: some View {
                  ZStack {
                      LinearGradient(colors: [ArtFill.tint(for: movie.title), Color(white: 0.07)],
                                     startPoint: .topLeading, endPoint: .bottomTrailing)
                      if showTitle {
                          Text(movie.title)
                              .font(.headline)
                              .multilineTextAlignment(.center)
                              .foregroundStyle(.white.opacity(0.85))
                              .minimumScaleFactor(0.6)
                              .padding(12)
                      }
                      if let url = movie.posterURL {
                          AsyncImage(url: url, transaction: Transaction(animation: .easeOut(duration: 0.25))) { phase in
                              if let image = phase.image {
                                  image.resizable().scaledToFill()
                              }
                          }
                      }
                  }
              }

              static func tint(for title: String) -> Color {
                  let sum = title.unicodeScalars.reduce(0) { ($0 &* 31 &+ Int($1.value)) & 0xFFFF }
                  return Color(hue: Double(sum % 360) / 360, saturation: 0.5, brightness: 0.42)
              }
          }

          /// Artwork at a fixed aspect ratio (2:3 posters, 16:9 wide cards), rounded like the TV app.
          struct Artwork: View {
              let movie: Movie
              var aspect: CGFloat
              var corner: CGFloat = 10

              var body: some View {
                  Color.clear
                      .aspectRatio(aspect, contentMode: .fit)
                      .overlay { ArtFill(movie: movie) }
                      .clipShape(RoundedRectangle(cornerRadius: corner, style: .continuous))
                      .overlay(RoundedRectangle(cornerRadius: corner, style: .continuous).strokeBorder(.white.opacity(0.07)))
              }
          }

          struct ProgressBar: View {
              var value: Double

              var body: some View {
                  GeometryReader { geo in
                      ZStack(alignment: .leading) {
                          Capsule().fill(.white.opacity(0.3))
                          Capsule().fill(.white).frame(width: max(4, geo.size.width * value))
                      }
                  }
                  .frame(height: 4)
              }
          }

          // MARK: Cards

          /// Starts looking up a movie's video when its card scrolls into view, and drops the
          /// request if it scrolls away first.
          struct PrefetchOnScreen: ViewModifier {
              let movie: Movie
              @EnvironmentObject private var store: LibraryStore

              func body(content: Content) -> some View {
                  content
                      .onAppear { store.prefetch(movie) }
                      .onDisappear { store.cancelPrefetch(movie) }
              }
          }

          extension View {
              func prefetching(_ movie: Movie) -> some View { modifier(PrefetchOnScreen(movie: movie)) }
          }

          struct PosterCard: View {
              let movie: Movie
              var width: CGFloat = 118

              var body: some View {
                  VStack(alignment: .leading, spacing: 6) {
                      Artwork(movie: movie, aspect: 2.0 / 3.0)
                      Text(movie.title)
                          .font(.caption.weight(.semibold))
                          .lineLimit(1)
                      if let y = movie.year {
                          Text(y).font(.caption2).foregroundStyle(.secondary)
                      }
                  }
                  .frame(width: width, alignment: .leading)
                  .contentShape(Rectangle())
                  .prefetching(movie)
              }
          }

          struct WideCard: View {
              let movie: Movie
              var progress: Double? = nil
              var subtitle: String? = nil
              var width: CGFloat = 270

              var body: some View {
                  VStack(alignment: .leading, spacing: 6) {
                      Artwork(movie: movie, aspect: 16.0 / 9.0)
                          .overlay(alignment: .bottom) {
                              if let progress {
                                  ProgressBar(value: progress).padding(.horizontal, 12).padding(.bottom, 10)
                              }
                          }
                      Text(movie.title)
                          .font(.subheadline.weight(.semibold))
                          .lineLimit(1)
                      if let subtitle, !subtitle.isEmpty {
                          Text(subtitle).font(.caption).foregroundStyle(.secondary).lineLimit(1)
                      }
                  }
                  .frame(width: width, alignment: .leading)
                  .contentShape(Rectangle())
                  .prefetching(movie)
              }
          }

          /// A titled, sideways-scrolling row of cards.
          struct Shelf<Content: View>: View {
              let title: String
              var seeAll: ShelfRoute? = nil
              @ViewBuilder var content: () -> Content

              var body: some View {
                  VStack(alignment: .leading, spacing: 12) {
                      Group {
                          if let seeAll {
                              NavigationLink(value: seeAll) {
                                  HStack(spacing: 5) {
                                      Text(title)
                                      Image(systemName: "chevron.right")
                                          .font(.subheadline.weight(.bold))
                                          .foregroundStyle(.secondary)
                                  }
                              }
                              .buttonStyle(.plain)
                          } else {
                              Text(title)
                          }
                      }
                      .font(.title3.weight(.bold))
                      .padding(.horizontal, 20)

                      ScrollView(.horizontal, showsIndicators: false) {
                          LazyHStack(alignment: .top, spacing: 14) {
                              content()
                          }
                          .padding(.horizontal, 20)
                      }
                  }
              }
          }

          struct MovieGrid: View {
              let movies: [Movie]
              private let columns = [GridItem(.adaptive(minimum: 104), spacing: 14, alignment: .top)]

              var body: some View {
                  LazyVGrid(columns: columns, alignment: .leading, spacing: 20) {
                      ForEach(movies) { m in
                          NavigationLink(value: m) {
                              VStack(alignment: .leading, spacing: 6) {
                                  Artwork(movie: m, aspect: 2.0 / 3.0)
                                  Text(m.title).font(.caption.weight(.semibold)).lineLimit(2)
                                  if let y = m.year { Text(y).font(.caption2).foregroundStyle(.secondary) }
                              }
                              .contentShape(Rectangle())
                              .prefetching(m)
                          }
                          .buttonStyle(PressableStyle())
                      }
                  }
              }
          }

          // MARK: Buttons

          struct PressableStyle: ButtonStyle {
              func makeBody(configuration: Configuration) -> some View {
                  configuration.label
                      .scaleEffect(configuration.isPressed ? 0.96 : 1)
                      .opacity(configuration.isPressed ? 0.85 : 1)
                      .animation(.easeOut(duration: 0.15), value: configuration.isPressed)
              }
          }

          /// The big white button. Plays (or resumes) the movie; if there's no video file it
          /// opens the FebBox link, and failing that the movie's web page.
          struct PlayButton: View {
              let movie: Movie
              var fullWidth = false
              @EnvironmentObject private var store: LibraryStore
              @Environment(\.openURL) private var openURL

              var body: some View {
                  Button(action: tap) {
                      HStack(spacing: 8) {
                          if finding {
                              ProgressView().tint(.black)
                          } else {
                              Image(systemName: icon).font(.body.weight(.bold))
                          }
                          Text(finding ? "Finding video…" : title).font(.body.weight(.semibold)).lineLimit(1)
                      }
                      .frame(maxWidth: fullWidth ? .infinity : nil)
                      .padding(.horizontal, 28)
                      .frame(height: 52)
                      .foregroundStyle(.black)
                      .background(canAct ? Color.white : Color.white.opacity(0.4), in: RoundedRectangle(cornerRadius: 12, style: .continuous))
                  }
                  .buttonStyle(PressableStyle())
                  .disabled(!canAct)
              }

              private var finding: Bool { store.lookingUp.contains(movie.id) && !movie.hasVideo }

              private var canAct: Bool {
                  !finding && (movie.hasVideo || !movie.externalLinks.isEmpty || movie.needsLookup || movie.pageURL != nil)
              }

              private var title: String {
                  guard canAct || finding else { return "Not Available" }
                  return store.resumePosition(movie.id) != nil ? "Resume" : "Play"
              }

              private var icon: String { "play.fill" }

              /// One tap does everything: finds the video (clicking through the site if needed) and plays it.
              private func tap() {
                  Task { await store.playSmart(movie) }
              }
          }

          /// Round icon button with a caption underneath, like the TV app's action row.
          struct CircleAction: View {
              let title: String
              let systemImage: String

              var body: some View {
                  VStack(spacing: 7) {
                      Image(systemName: systemImage)
                          .font(.system(size: 19, weight: .semibold))
                          .frame(width: 52, height: 52)
                          .background(Color(white: 0.17), in: Circle())
                      Text(title)
                          .font(.caption2.weight(.medium))
                          .foregroundStyle(.secondary)
                          .lineLimit(1)
                  }
                  .frame(minWidth: 64)
                  .foregroundStyle(.white)
              }
          }

          enum ExternalPlayer: String, CaseIterable, Identifiable {
              case vlc = "VLC"
              case infuse = "Infuse"

              var id: String { rawValue }

              func url(for video: URL) -> URL {
                  let enc = video.absoluteString.addingPercentEncoding(withAllowedCharacters: .alphanumerics) ?? ""
                  switch self {
                  case .vlc: return URL(string: "vlc-x-callback://x-callback-url/stream?url=\(enc)")!
                  case .infuse: return URL(string: "infuse://x-callback-url/play?url=\(enc)")!
                  }
              }

              var missingMessage: String {
                  switch self {
                  case .vlc: return "VLC isn't installed. Get “VLC for Mobile” (free) from the App Store, then tap this again."
                  case .infuse: return "Infuse isn't installed. Get “Infuse” from the App Store, then tap this again."
                  }
              }

              /// File types the built-in iOS player can't play.
              static func needed(for url: URL?) -> Bool {
                  guard let ext = url?.pathExtension.lowercased() else { return false }
                  return ["mkv", "avi", "wmv", "flv", "webm", "mpg", "mpeg", "ogv"].contains(ext)
              }
          }

          // MARK: Misc

          struct ScanBanner: View {
              @EnvironmentObject private var store: LibraryStore

              var body: some View {
                  if case .scanning(let pages, let found, let status) = store.scanState {
                      HStack(spacing: 12) {
                          ProgressView().tint(.white)
                          VStack(alignment: .leading, spacing: 2) {
                              Text("Updating your movies… \(found) found")
                                  .font(.subheadline.weight(.semibold))
                              Text("\(pages) pages checked · \(status)")
                                  .font(.caption).foregroundStyle(.secondary)
                                  .lineLimit(1).truncationMode(.middle)
                          }
                          Spacer()
                          Button("Stop") { store.stopScan() }
                              .font(.subheadline.weight(.semibold))
                      }
                      .padding(14)
                      .background(Color(white: 0.12), in: RoundedRectangle(cornerRadius: 14, style: .continuous))
                  }
              }
          }

          struct EmptyStateView<Actions: View>: View {
              let systemImage: String
              let title: String
              let message: String
              @ViewBuilder var actions: () -> Actions

              var body: some View {
                  VStack(spacing: 14) {
                      Image(systemName: systemImage)
                          .font(.system(size: 54, weight: .light))
                          .foregroundStyle(.secondary)
                      Text(title).font(.title2.weight(.bold)).multilineTextAlignment(.center)
                      Text(message)
                          .font(.body)
                          .foregroundStyle(.secondary)
                          .multilineTextAlignment(.center)
                      VStack(spacing: 10) { actions() }.padding(.top, 6)
                  }
                  .padding(32)
                  .frame(maxWidth: .infinity, maxHeight: .infinity)
              }
          }

          /// Big obvious button used in setup and empty screens.
          struct BigButton: View {
              let title: String
              var systemImage: String? = nil
              var prominent = true
              let action: () -> Void

              var body: some View {
                  Button(action: action) {
                      HStack(spacing: 8) {
                          if let systemImage { Image(systemName: systemImage) }
                          Text(title)
                      }
                      .font(.headline)
                      .frame(maxWidth: .infinity)
                      .frame(height: 54)
                      .foregroundStyle(prominent ? .black : .white)
                      .background(prominent ? Color.white : Color(white: 0.18), in: RoundedRectangle(cornerRadius: 14, style: .continuous))
                  }
                  .buttonStyle(PressableStyle())
              }
          }

          /// Website address box with Paste and Clear buttons.
          struct AddressField: View {
              @Binding var text: String
              var onSubmit: () -> Void

              var body: some View {
                  HStack(spacing: 10) {
                      Image(systemName: "globe").foregroundStyle(.secondary)
                      TextField("mymovies.com", text: $text)
                          .keyboardType(.URL)
                          .textContentType(.URL)
                          .textInputAutocapitalization(.never)
                          .autocorrectionDisabled()
                          .submitLabel(.go)
                          .onSubmit(onSubmit)
                      if !text.isEmpty {
                          Button { text = "" } label: {
                              Image(systemName: "xmark.circle.fill").foregroundStyle(.secondary)
                          }
                          .accessibilityLabel("Clear")
                      }
                      PasteButton(payloadType: String.self) { strings in
                          let pasted = strings.first?.trimmingCharacters(in: .whitespacesAndNewlines) ?? ""
                          DispatchQueue.main.async { text = pasted }
                      }
                      .labelStyle(.titleOnly)
                      .buttonBorderShape(.capsule)
                      .controlSize(.small)
                  }
                  .padding(.horizontal, 14)
                  .frame(height: 56)
                  .background(Color(white: 0.13), in: RoundedRectangle(cornerRadius: 14, style: .continuous))
              }
          }

          extension View {
              /// Where tapping a movie or a shelf's "See all" goes, in every tab.
              func movieDestinations() -> some View {
                  self
                      .navigationDestination(for: Movie.self) { MovieDetailView(movie: $0) }
                      .navigationDestination(for: ShelfRoute.self) { ShelfGridView(route: $0) }
              }
          }
          CINESCOUT_EOF

          # ---- Console.swift
          cat > 'CineScout/Sources/Console.swift' <<'CINESCOUT_EOF'
          import Foundation
          import SwiftUI
          import UIKit
          import JavaScriptCore

          // MARK: Engine

          /// The back door: paste what Claude sends, tap Run. Accepts three kinds of input:
          ///
          /// 1. A patch (JSON with any of these keys):
          ///      {"rules": {…only the rules to change…}, "settings": {"maxPages": 800}, "commands": ["rescan"]}
          /// 2. A complete rules file (JSON with rule names at the top level) – replaces the rules.
          /// 3. JavaScript using the `cinescout` object, e.g.
          ///      cinescout.movies().filter(m => !m.poster).length
          ///
          /// Commands: rescan, lookUpAll, clearLibrary, resetRules, clearLog, verboseOn, verboseOff.
          @MainActor
          final class ConsoleEngine: ObservableObject {
              struct Entry: Identifiable {
                  let id = UUID()
                  let input: String
                  let output: String
                  let ok: Bool
              }

              @Published private(set) var history: [Entry] = []
              private let store: LibraryStore
              private lazy var js: JSContext = makeContext()
              private var lastJSError: String?

              init(store: LibraryStore) {
                  self.store = store
              }

              func run(_ raw: String) {
                  let input = Self.stripFences(raw)
                  guard !input.isEmpty else { return }
                  let (output, ok) = execute(input)
                  history.insert(Entry(input: input, output: output, ok: ok), at: 0)
                  DiagLog.shared.log("console", "\(ok ? "OK" : "ERROR"): \(String(input.prefix(200)).replacingOccurrences(of: "\n", with: " ")) → \(String(output.prefix(300)))")
                  UINotificationFeedbackGenerator().notificationOccurred(ok ? .success : .error)
              }

              func clearHistory() { history.removeAll() }

              private func execute(_ input: String) -> (String, Bool) {
                  if input.hasPrefix("{"),
                     let obj = try? JSONSerialization.jsonObject(with: Data(input.utf8)) as? [String: Any] {
                      let patchKeys: Set<String> = ["rules", "settings", "commands"]
                      if !patchKeys.isDisjoint(with: obj.keys) {
                          return applyPatch(obj)
                      }
                      if let error = Rules.save(input) { return (error, false) }
                      return ("Rules replaced. Pull down on Home (or run the command rescan) to apply.", true)
                  }
                  let simple = input.trimmingCharacters(in: .whitespacesAndNewlines)
                  if simple.range(of: #"^[A-Za-z]+$"#, options: .regularExpression) != nil, let out = command(simple) {
                      return out
                  }
                  return runJS(input)
              }

              // MARK: Patches

              private func applyPatch(_ obj: [String: Any]) -> (String, Bool) {
                  var lines: [String] = []
                  var ok = true
                  if let rules = obj["rules"] as? [String: Any] {
                      if let error = Rules.merge(rules) {
                          lines.append("Rules: \(error)")
                          ok = false
                      } else {
                          lines.append("Rules updated: \(rules.keys.sorted().joined(separator: ", ")).")
                      }
                  }
                  if let settings = obj["settings"] as? [String: Any] {
                      for (k, v) in settings.sorted(by: { $0.key < $1.key }) {
                          lines.append(setSetting(k, v))
                      }
                  }
                  if let commands = obj["commands"] as? [String] {
                      for c in commands {
                          if let (out, cOK) = command(c) {
                              lines.append(out)
                              ok = ok && cOK
                          } else {
                              lines.append("Unknown command: \(c)")
                              ok = false
                          }
                      }
                  }
                  return (lines.isEmpty ? "Nothing to do in that patch." : lines.joined(separator: "\n"), ok)
              }

              private static let allowedSettings: Set<String> = ["maxPages", "compressQuality", "verboseLog", "sortMode"]

              private func setSetting(_ key: String, _ value: Any) -> String {
                  guard Self.allowedSettings.contains(key) else { return "Unknown setting: \(key)" }
                  if key == "maxPages", let n = value as? Int {
                      store.maxPages = max(25, min(n, 10_000))
                      return "maxPages = \(store.maxPages)"
                  }
                  UserDefaults.standard.set(value, forKey: key)
                  return "\(key) = \(value)"
              }

              private func command(_ name: String) -> (String, Bool)? {
                  switch name.lowercased() {
                  case "rescan":
                      store.rescanAll()
                      return ("Rescanning your websites.", true)
                  case "lookupall":
                      store.lookUpAll()
                      return ("Looking up videos for every movie that still needs it.", true)
                  case "clearlibrary":
                      store.clearLibrary()
                      return ("Library cleared. Run rescan to fill it again.", true)
                  case "resetrules":
                      Rules.writeDefaults()
                      return ("Rules reset to this build's defaults.", true)
                  case "clearlog":
                      DiagLog.shared.clear()
                      return ("Log cleared.", true)
                  case "verboseon":
                      UserDefaults.standard.set(true, forKey: "verboseLog")
                      return ("Detailed scan log is on.", true)
                  case "verboseoff":
                      UserDefaults.standard.set(false, forKey: "verboseLog")
                      return ("Detailed scan log is off.", true)
                  case "removenow":
                      store.pumpRemovals()
                      let n = (UserDefaults.standard.array(forKey: "febboxPendingRemovals") as? [[String]])?.count ?? 0
                      return ("Removing \(n) finished item(s) from your FebBox collaborative files.", true)
                  case "help":
                      return (Self.help, true)
                  default:
                      return nil
                  }
              }

              static let help = """
              Paste what Claude sends you and tap Run.
              Commands: rescan, lookUpAll, clearLibrary, resetRules, clearLog, verboseOn, verboseOff, removeNow
              Script: cinescout.movies(), cinescout.editMovie(id, {title, year, overview, poster}), cinescout.removeMovie(id), cinescout.rules(), cinescout.setRules({...}), cinescout.setSetting(key, value), cinescout.run("rescan"), cinescout.log(text)
              """

              // MARK: JavaScript

              private func runJS(_ code: String) -> (String, Bool) {
                  lastJSError = nil
                  let value = js.evaluateScript(code)
                  if let e = lastJSError { return ("Script error: \(e)", false) }
                  guard let value, !value.isUndefined else { return ("Done.", true) }
                  if value.isObject, let obj = value.toObject(), JSONSerialization.isValidJSONObject(obj),
                     let data = try? JSONSerialization.data(withJSONObject: obj, options: [.prettyPrinted, .sortedKeys]),
                     let text = String(data: data, encoding: .utf8) {
                      return (String(text.prefix(20_000)), true)
                  }
                  return (value.toString() ?? "Done.", true)
              }

              private func makeContext() -> JSContext {
                  let ctx = JSContext()!
                  ctx.exceptionHandler = { [weak self] _, e in
                      let text = e?.toString() ?? "unknown"
                      MainActor.assumeIsolated { self?.lastJSError = text }
                  }
                  let api = JSValue(newObjectIn: ctx)!
                  let store = self.store

                  let log: @convention(block) (String) -> Void = { DiagLog.shared.log("console", $0) }
                  let movies: @convention(block) () -> [[String: Any]] = {
                      MainActor.assumeIsolated {
                          store.movies.map { m in
                              [
                                  "id": m.id,
                                  "title": m.title,
                                  "year": m.year ?? "",
                                  "overview": m.overview ?? "",
                                  "poster": m.posterURL?.absoluteString ?? "",
                                  "page": m.pageURL?.absoluteString ?? "",
                                  "source": m.source,
                                  "videos": m.videoURLs.map(\.absoluteString),
                                  "links": m.externalLinks.map { $0.url.absoluteString },
                                  "pending": m.pendingLinks.map(\.absoluteString),
                              ]
                          }
                      }
                  }
                  let editMovie: @convention(block) (String, [String: Any]) -> Bool = { id, fields in
                      MainActor.assumeIsolated {
                          store.editMovie(id,
                                          title: fields["title"] as? String,
                                          year: (fields["year"] as? String) ?? (fields["year"] as? NSNumber)?.stringValue,
                                          overview: fields["overview"] as? String,
                                          poster: (fields["poster"] as? String).flatMap(URL.init(string:)))
                      }
                  }
                  let removeMovie: @convention(block) (String) -> Bool = { id in
                      MainActor.assumeIsolated { store.removeMovie(id) }
                  }
                  let rules: @convention(block) () -> [String: Any] = {
                      (try? JSONSerialization.jsonObject(with: Data(Rules.currentText().utf8)) as? [String: Any]) ?? [:]
                  }
                  let setRules: @convention(block) ([String: Any]) -> String = { patch in
                      Rules.merge(patch) ?? "Rules updated."
                  }
                  let setSetting: @convention(block) (String, JSValue) -> String = { [weak self] key, value in
                      let v: Any = value.toObject() ?? NSNull()
                      return MainActor.assumeIsolated { self?.setSetting(key, v) ?? "" }
                  }
                  let run: @convention(block) (String) -> String = { [weak self] name in
                      MainActor.assumeIsolated { self?.command(name)?.0 ?? "Unknown command: \(name)" }
                  }

                  api.setObject(unsafeBitCast(log, to: AnyObject.self), forKeyedSubscript: "log" as NSString)
                  api.setObject(unsafeBitCast(movies, to: AnyObject.self), forKeyedSubscript: "movies" as NSString)
                  api.setObject(unsafeBitCast(editMovie, to: AnyObject.self), forKeyedSubscript: "editMovie" as NSString)
                  api.setObject(unsafeBitCast(removeMovie, to: AnyObject.self), forKeyedSubscript: "removeMovie" as NSString)
                  api.setObject(unsafeBitCast(rules, to: AnyObject.self), forKeyedSubscript: "rules" as NSString)
                  api.setObject(unsafeBitCast(setRules, to: AnyObject.self), forKeyedSubscript: "setRules" as NSString)
                  api.setObject(unsafeBitCast(setSetting, to: AnyObject.self), forKeyedSubscript: "setSetting" as NSString)
                  api.setObject(unsafeBitCast(run, to: AnyObject.self), forKeyedSubscript: "run" as NSString)
                  ctx.setObject(api, forKeyedSubscript: "cinescout" as NSString)
                  return ctx
              }

              static func stripFences(_ text: String) -> String {
                  var t = text.trimmingCharacters(in: .whitespacesAndNewlines)
                  if t.hasPrefix("```") {
                      if let nl = t.firstIndex(of: "\n") { t = String(t[t.index(after: nl)...]) } else { t = "" }
                  }
                  if t.hasSuffix("```") { t = String(t.dropLast(3)) }
                  return t.trimmingCharacters(in: .whitespacesAndNewlines)
                      .replacingOccurrences(of: "“", with: "\"").replacingOccurrences(of: "”", with: "\"")
                      .replacingOccurrences(of: "‘", with: "'").replacingOccurrences(of: "’", with: "'")
              }
          }

          extension Rules {
              /// Changes only the rules named in `patch` (null removes one, so the default applies).
              /// Returns an error message, or nil on success.
              static func merge(_ patch: [String: Any]) -> String? {
                  var current = (try? JSONSerialization.jsonObject(with: Data(currentText().utf8)) as? [String: Any]) ?? [:]
                  for (k, v) in patch {
                      if v is NSNull { current.removeValue(forKey: k) } else { current[k] = v }
                  }
                  guard let data = try? JSONSerialization.data(withJSONObject: current, options: [.prettyPrinted, .sortedKeys, .withoutEscapingSlashes]),
                        let text = String(data: data, encoding: .utf8) else { return "Couldn't combine those rules." }
                  return save(text)
              }
          }

