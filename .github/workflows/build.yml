                      Section { Label(message, systemImage: "checkmark.circle.fill").foregroundStyle(.green) }
                  case .failed(let message):
                      Section { Label(message, systemImage: "exclamationmark.triangle.fill").foregroundStyle(.orange) }
                  }
              }

              private func add() {
                  let a = address
                  address = ""
                  store.addSite(a)
              }
