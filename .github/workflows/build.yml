                      excludeVideoPattern: excludeVideoPattern ?? d.excludeVideoPattern,
                      resolvePlayLinksDuringScan: resolvePlayLinksDuringScan ?? d.resolvePlayLinksDuringScan,
                      robotClickPattern: robotClickPattern ?? d.robotClickPattern,
                      robotTimeout: robotTimeout ?? d.robotTimeout,
