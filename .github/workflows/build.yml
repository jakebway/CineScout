          import Foundation
          import SwiftUI
          import UIKit
          import AVKit
          import AVFoundation
          import Combine
          #if canImport(MobileVLCKit)
          import MobileVLCKit
          #endif

          /// Which playback engines this build has.
          enum PlaybackSupport {
              /// True when the build includes the VLC engine (plays MKV, AVI, WMV…).
              static let vlc: Bool = {
                  #if canImport(MobileVLCKit)
                  return true
                  #else
                  return false
                  #endif
              }()
          }

          struct TrackOption: Identifiable, Hashable {
              let id: Int
              let name: String
          }

          // MARK: Controller

          /// Runs one video in either the iPhone's own player or the VLC engine, switching
          /// automatically if the first one can't play the file.
          @MainActor
          final class PlaybackController: NSObject, ObservableObject {
              enum Engine: String {
                  case native = "iPhone player"
                  case vlc = "VLC engine"
              }

              @Published private(set) var engine: Engine
              @Published private(set) var isPlaying = false
              @Published private(set) var isBuffering = true
              @Published private(set) var position: Double = 0
              @Published private(set) var duration: Double = 0
              @Published private(set) var failure: String?
              @Published private(set) var rate: Float = 1
              @Published private(set) var subtitles: [TrackOption] = []
              @Published private(set) var audioTracks: [TrackOption] = []
              @Published private(set) var selectedSubtitle: Int = -1
              @Published private(set) var selectedAudio: Int = -1
              @Published private(set) var canPiP = false
              @Published var fill = false
              @Published var isScrubbing = false

              let request: PlayRequest
              private let store: LibraryStore
              let avPlayer = AVPlayer()
              private var avObserver: Any?
              private var statusTask: Task<Void, Never>?
              private var pip: AVPictureInPictureController?
              private var lastSaved = Date.distantPast
              private var resumeAt: Double
              private var didResume = false
              private var triedFallback = false
              private var stopped = false
              #if canImport(MobileVLCKit)
              let vlcPlayer = VLCMediaPlayer()
              let vlcView = UIView()
              private var vlcTimer: Timer?
              #endif

              init(request: PlayRequest, store: LibraryStore) {
                  self.request = request
                  self.store = store
                  self.resumeAt = request.start
                  let needsVLC = ExternalPlayer.needed(for: request.url)
                  self.engine = (needsVLC && PlaybackSupport.vlc) ? .vlc : .native
                  super.init()
              }

              var otherEngineAvailable: Bool { PlaybackSupport.vlc }
              var remaining: Double { max(0, duration - position) }

              // MARK: Lifecycle

              func start() {
                  stopped = false
                  failure = nil
                  isBuffering = true
                  UIApplication.shared.isIdleTimerDisabled = true
                  DiagLog.shared.log("player", "Opening “\(request.movie.title)” in the \(engine.rawValue): \(request.url.absoluteString)")
                  switch engine {
                  case .native: startNative()
                  case .vlc: startVLC()
                  }
              }

              func stop() {
                  guard !stopped else { return }
                  stopped = true
                  saveProgress(force: true)
                  teardown()
                  UIApplication.shared.isIdleTimerDisabled = false
                  if let folder = request.cleanup {
                      WorkFolder.delete(folder, reason: "finished watching “\(request.movie.title)”")
                  }
                  if !request.febboxNames.isEmpty {
                      store.scheduleFebBoxRemoval(request.febboxNames, title: request.movie.title)
                  }
              }

              private func teardown() {
                  statusTask?.cancel()
                  statusTask = nil
                  if let avObserver { avPlayer.removeTimeObserver(avObserver) }
                  avObserver = nil
                  avPlayer.pause()
                  avPlayer.replaceCurrentItem(with: nil)
                  #if canImport(MobileVLCKit)
                  vlcTimer?.invalidate()
                  vlcTimer = nil
                  if vlcPlayer.media != nil { vlcPlayer.stop() }
                  #endif
              }

              /// Switch between the iPhone player and the VLC engine, keeping your place.
              func switchEngine() {
                  guard otherEngineAvailable else { return }
                  resumeAt = position
                  didResume = false
                  teardown()
                  engine = engine == .native ? .vlc : .native
                  subtitles = []
                  audioTracks = []
                  DiagLog.shared.log("player", "Switched to the \(engine.rawValue) at \(Int(resumeAt))s")
                  start()
              }

              // MARK: Controls

              func togglePlay() {
                  switch engine {
                  case .native:
                      if avPlayer.timeControlStatus == .paused { avPlayer.playImmediately(atRate: rate) } else { avPlayer.pause() }
                  case .vlc:
                      #if canImport(MobileVLCKit)
                      if vlcPlayer.isPlaying { vlcPlayer.pause() } else { vlcPlayer.play() }
                      #endif
                  }
                  isPlaying.toggle()
                  saveProgress(force: true)
              }

              func skip(_ seconds: Double) { seek(to: position + seconds) }

              func seek(to seconds: Double) {
                  let upper = duration > 1 ? duration - 1 : max(seconds, 0)
                  let t = min(max(0, seconds), upper)
                  position = t
                  switch engine {
                  case .native:
                      avPlayer.seek(to: CMTime(seconds: t, preferredTimescale: 600), toleranceBefore: .zero, toleranceAfter: .zero)
                  case .vlc:
                      #if canImport(MobileVLCKit)
                      if duration > 0 { vlcPlayer.position = Float(t / duration) }
                      #endif
                  }
              }

              func setRate(_ r: Float) {
                  rate = r
                  switch engine {
                  case .native:
                      avPlayer.defaultRate = r
                      if avPlayer.timeControlStatus != .paused { avPlayer.rate = r }
                  case .vlc:
                      #if canImport(MobileVLCKit)
                      vlcPlayer.rate = r
                      #endif
                  }
              }

              func selectSubtitle(_ id: Int) {
                  selectedSubtitle = id
                  switch engine {
                  case .native:
                      guard let item = avPlayer.currentItem else { return }
                      Task {
                          guard let g = try? await item.asset.loadMediaSelectionGroup(for: .legible) else { return }
                          if id >= 0 && id < g.options.count { item.select(g.options[id], in: g) } else { item.select(nil, in: g) }
                      }
                  case .vlc:
                      #if canImport(MobileVLCKit)
                      vlcPlayer.currentVideoSubTitleIndex = Int32(id)
                      #endif
                  }
              }

              func selectAudio(_ id: Int) {
                  selectedAudio = id
                  switch engine {
                  case .native:
                      guard let item = avPlayer.currentItem else { return }
                      Task {
                          guard let g = try? await item.asset.loadMediaSelectionGroup(for: .audible), id >= 0, id < g.options.count else { return }
                          item.select(g.options[id], in: g)
                      }
                  case .vlc:
                      #if canImport(MobileVLCKit)
                      vlcPlayer.currentAudioTrackIndex = Int32(id)
                      #endif
                  }
              }

              func attach(layer: AVPlayerLayer) {
                  guard AVPictureInPictureController.isPictureInPictureSupported() else { return }
                  let controller = AVPictureInPictureController(playerLayer: layer)
                  controller?.canStartPictureInPictureAutomaticallyFromInline = true
                  pip = controller
                  canPiP = controller != nil
              }

              func togglePiP() {
                  guard let pip else { return }
                  if pip.isPictureInPictureActive { pip.stopPictureInPicture() } else { pip.startPictureInPicture() }
              }

              // MARK: iPhone player

              private func startNative() {
                  var options: [String: Any] = [:]
                  if !request.cookies.isEmpty { options[AVURLAssetHTTPCookiesKey] = request.cookies }
                  if !request.headers.isEmpty { options["AVURLAssetHTTPHeaderFieldsKey"] = request.headers }
                  let asset = AVURLAsset(url: request.url, options: options.isEmpty ? nil : options)
                  let item = AVPlayerItem(asset: asset)
                  item.preferredForwardBufferDuration = 30
                  avPlayer.replaceCurrentItem(with: item)
                  avPlayer.allowsExternalPlayback = true
                  avPlayer.automaticallyWaitsToMinimizeStalling = true
                  avPlayer.defaultRate = rate
                  avObserver = avPlayer.addPeriodicTimeObserver(forInterval: CMTime(seconds: 0.5, preferredTimescale: 600), queue: .main) { [weak self] time in
                      Task { @MainActor in self?.nativeTick(time) }
                  }
                  statusTask = Task { [weak self] in
                      for await status in item.publisher(for: \.status).values {
                          guard let self, !Task.isCancelled else { return }
                          if status == .readyToPlay {
                              self.nativeReady(item)
                          } else if status == .failed {
                              self.handleFailure(item.error)
                              return
                          }
                      }
                  }
                  avPlayer.play()
              }

              private func nativeReady(_ item: AVPlayerItem) {
                  let d = item.duration.seconds
                  if d.isFinite && d > 0 { duration = d }
                  if !didResume && resumeAt > 1 {
                      didResume = true
                      avPlayer.seek(to: CMTime(seconds: resumeAt, preferredTimescale: 600))
                      DiagLog.shared.log("player", "Resumed at \(Int(resumeAt))s")
                  }
                  Task { await loadNativeTracks(item) }
              }

              private func loadNativeTracks(_ item: AVPlayerItem) async {
                  if let g = try? await item.asset.loadMediaSelectionGroup(for: .legible), !g.options.isEmpty {
                      subtitles = g.options.enumerated().map { TrackOption(id: $0.offset, name: $0.element.displayName) }
                  }
                  if let g = try? await item.asset.loadMediaSelectionGroup(for: .audible), g.options.count > 1 {
                      audioTracks = g.options.enumerated().map { TrackOption(id: $0.offset, name: $0.element.displayName) }
                      selectedAudio = 0
                  }
              }

              private func nativeTick(_ time: CMTime) {
                  guard engine == .native, !stopped else { return }
                  if !isScrubbing, time.seconds.isFinite { position = time.seconds }
                  if let d = avPlayer.currentItem?.duration.seconds, d.isFinite, d > 0 { duration = d }
                  isPlaying = avPlayer.timeControlStatus == .playing
                  isBuffering = avPlayer.timeControlStatus == .waitingToPlayAtSpecifiedRate
                  if duration > 0 && position >= duration - 0.6 { finishedPlaying() }
                  saveProgress()
              }

              // MARK: VLC engine

              private func startVLC() {
                  #if canImport(MobileVLCKit)
                  vlcView.backgroundColor = .black
                  vlcPlayer.drawable = vlcView
                  let media = VLCMedia(url: request.url)
                  var vlcOptions: [AnyHashable: Any] = ["network-caching": 3000]
                  if let ref = request.headers["Referer"] { vlcOptions["http-referrer"] = ref }
                  if let ua = request.headers["User-Agent"] { vlcOptions["http-user-agent"] = ua }
                  if !request.cookies.isEmpty {
                      vlcOptions["http-cookie"] = request.cookies.map { "\($0.name)=\($0.value)" }.joined(separator: "; ")
                  }
                  media.addOptions(vlcOptions)
                  vlcPlayer.media = media
                  vlcPlayer.play()
                  vlcPlayer.rate = rate
                  vlcTimer = Timer.scheduledTimer(withTimeInterval: 0.5, repeats: true) { [weak self] _ in
                      Task { @MainActor in self?.vlcTick() }
                  }
                  #else
                  handleFailure(nil)
                  #endif
              }

              #if canImport(MobileVLCKit)
              private func vlcTick() {
                  guard engine == .vlc, !stopped else { return }
                  let p = vlcPlayer
                  let length = Double(p.media?.length.intValue ?? 0) / 1000
                  if length > 0 { duration = length }
                  if !isScrubbing { position = max(0, Double(p.time.intValue) / 1000) }
                  isPlaying = p.isPlaying
                  switch p.state {
                  case .opening, .buffering:
                      isBuffering = !p.isPlaying
                  case .error:
                      vlcTimer?.invalidate()
                      handleFailure(nil)
                      return
                  case .ended:
                      isBuffering = false
                      finishedPlaying()
                  default:
                      isBuffering = false
                  }
                  if !didResume && resumeAt > 1 && duration > 0 && p.isPlaying {
                      didResume = true
                      p.position = Float(resumeAt / duration)
                      DiagLog.shared.log("player", "Resumed at \(Int(resumeAt))s")
                  }
                  if subtitles.isEmpty,
                     let names = p.videoSubTitlesNames as? [String],
                     let indexes = p.videoSubTitlesIndexes as? [NSNumber],
                     names.count == indexes.count, names.count > 1 {
                      subtitles = zip(indexes, names).filter { $0.0.intValue >= 0 }.map { TrackOption(id: $0.0.intValue, name: $0.1) }
                      selectedSubtitle = Int(p.currentVideoSubTitleIndex)
                  }
                  if audioTracks.isEmpty,
                     let names = p.audioTrackNames as? [String],
                     let indexes = p.audioTrackIndexes as? [NSNumber],
                     names.count == indexes.count, names.count > 2 {
                      audioTracks = zip(indexes, names).filter { $0.0.intValue >= 0 }.map { TrackOption(id: $0.0.intValue, name: $0.1) }
                      selectedAudio = Int(p.currentAudioTrackIndex)
                  }
                  saveProgress()
              }
              #endif

              // MARK: Progress & errors

              private func finishedPlaying() {
                  guard !stopped else { return }
                  store.saveProgress(id: request.movie.id, position: duration, duration: duration)
                  lastSaved = Date()
              }

              private func saveProgress(force: Bool = false) {
                  guard duration > 0, position > 0 else { return }
                  guard force || Date().timeIntervalSince(lastSaved) > 10 else { return }
                  lastSaved = Date()
                  store.saveProgress(id: request.movie.id, position: position, duration: duration)
              }

              private func handleFailure(_ error: Error?) {
                  var detail = ""
                  if let ns = error as NSError? {
                      detail = " [\(ns.domain) \(ns.code)"
                      if let under = ns.userInfo[NSUnderlyingErrorKey] as? NSError { detail += " ← \(under.domain) \(under.code)" }
                      detail += "]"
                  }
                  DiagLog.shared.log("player", "The \(engine.rawValue) couldn't play \(request.url.absoluteString): \(error?.localizedDescription ?? "no details")\(detail)")
                  if otherEngineAvailable && !triedFallback {
                      triedFallback = true
                      DiagLog.shared.log("player", "Trying the other engine automatically")
                      switchEngine()
                      return
                  }
                  isBuffering = false
                  failure = "This video couldn't be played. The link may be broken, the site may be offline, or the file may be damaged."
                  UIApplication.shared.isIdleTimerDisabled = false
              }
          }

          // MARK: Video surfaces

